# Every option in ingestion_workflow.config.Settings, with its default.
# Generated from the model; precedence is CLI flags > this file > environment.

# ===== Where things live =====
data_root: "data"  # Root directory for workflow data (manifests, staging, etc.)
cache_root: ".cache"  # Root directory for all cached indices
catalog_root: ".catalog"  # Directory holding catalog.sqlite and the blob store
ns_pond_root: "ns-pond"  # Local mirror of Neurostore content organized by base study ID
manifest_path: null  # Default identifiers manifest, when none is given on the command line

# ===== Retry policy =====
max_attempts: 3  # Failed stage attempts before an article is left alone
retry_after_hours: 24  # Hours to wait before retrying a failed stage attempt

# ===== Download sources =====
download_sources:  # Ordered list of download sources to attempt
  - pmc  # PMC's Cloud Service, then NCBI efetch: the OA subset and author manuscripts
  - europepmc  # Europe PMC full text: its OA subset and funders' manuscripts
  - pubget
  - elsevier
  - springer  # Springer Nature's Open Access API: the JATS of a licensed open-access article with a Springer Nature DOI. Needs springer_api_key
  - ace
  - pdf
  - wiley  # Wiley's TDM API: the PDF of an article with a Wiley DOI, read into its pdf text. Needs wiley_api_key
pubget_cache_root: "/tmp/pubget_cache"  # Optional override for Pubget cache root directory
ace_cache_root: "/tmp/ace_cache"  # Optional override for ACE cache root directory
elsevier_cache_root: "/tmp/elsevier_cache"  # Optional override for Elsevier cache root directory
pdf_cache_root: null  # Optional override for downloaded-PDF cache root directory
pmc_cache_root: null  # Optional override for the cache of XML fetched from NCBI's PMC
europepmc_cache_root: null  # Optional override for the cache of XML fetched from Europe PMC
pdf_extract_workers: null  # Docling worker processes for PDF extraction; None means one per CUDA device, or 1 on CPU
ace_max_workers: 4  # Maximum number of parallel workers dedicated to ACE downloads
# node_path: "/path/to/node/bin"  # Directory holding node (or the binary), put first on PATH. ACE/readabilipy needs node >= 20.19. Also INGEST_NODE_PATH

# ===== External APIs =====
pubmed_email: "MY_EMAIL_ADDRESS"  # Contact email for PubMed API (required by NCBI guidelines)
pubmed_api_key: "MY_PUBMED_API_KEY"  # Optional API key for increased PubMed rate limits
pubmed_batch_size: 500  # Number of records per PubMed API request
pubmed_tool: "IngestionWorkflowProject"  # Optional tool name reported to NCBI; if not provided, API calls may use a library default
semantic_scholar_api_key: "MY_SEMANTIC_SCHOLAR_API_KEY"  # Optional API key for Semantic Scholar (increases rate limits)
openalex_email: "MY_EMAIL_ADDRESS"  # Contact email for OpenAlex API (enables polite pool)
metadata_providers:  # Ordered list of providers searched by title when attaching local PDFs
  - semantic_scholar
  - pubmed
  - openalex
elsevier_api_key: "MY_ELSEVIER_API_KEY"  # API key for Elsevier full-text access
sciencedirect_keep_books: false  # Keep the book content a ScienceDirect search finds (a PII starting with B); by default only journal content is kept
elsevier_http_proxy: "socks5://127.0.0.1:1080"  # HTTP proxy URL to use for Elsevier requests (e.g., socks5://127.0.0.1:1080)
elsevier_https_proxy: "socks5://127.0.0.1:1080"  # HTTPS proxy URL to use for Elsevier requests (e.g., socks5://127.0.0.1:1080)
elsevier_use_proxy: true  # Whether to route Elsevier requests through configured proxy
wiley_api_key: "MY_WILEY_TDM_TOKEN"  # Wiley Text and Data Mining token, sent as Wiley-TDM-Client-Token. Also WILEY_API_KEY
springer_api_key: "MY_SPRINGER_API_KEY"  # Springer Nature Open Access API key. Also SPRINGER_API_KEY

# ===== LLM =====
llm_api_key: null  # API key for the configured LLM provider
llm_api_base: null  # Optional base URL for the configured LLM provider
llm_model: "gpt-5-mini"  # Specific model to use for coordinate extraction
llm_reasoning_effort: null  # Reasoning effort to send with coordinate parsing; leave unset for models that reject the parameter. Reasoning models that refuse function tools alongside reasoning need 'none'
n_llm_workers: 2  # Maximum number of concurrent LLM workers

# ===== Coordinates in prose =====
prose_model: null  # Model that reads coordinates written in the text; setting it runs passages, prose and resolve
prose_api_base: null  # Its server, apart from the table model's; defaults to llm_api_base

# ===== What each coordinate set is for =====
# role_model_table: {endpoint: "http://host:8000/v1", model: "name"}  # The served set-role model for table sets, {endpoint, model}. The roles stage always runs; without it every article with a table set is blocked there, and nothing is uploaded
# role_model_prose: {endpoint: "http://host:8001/v1", model: "name"}  # The served set-role model for prose sets, {endpoint, model}. Without it every article with a prose set is blocked at the roles stage

# ===== Parallelism =====
max_workers: 4  # Maximum number of parallel workers for concurrent operations

# ===== Output =====
sync_overwrite: true  # Overwrite individual files when writing ns-pond sync outputs

# ===== Logging =====
verbose: false  # Enable verbose logging output
log_to_file: true  # Persist logs to a file (defaults to <data_root>/logs/pipeline.log)
log_to_console: true  # Emit selected logs to the console in addition to the log file
log_file: null  # Optional override for log file path
show_progress: true  # Show tqdm progress bars on the console
dry_run: false  # Upload sends nothing and records nothing in the catalog; it writes each request body under <data_root>/neurostore_dry_run/ instead

# ===== Upload =====
neurostore_env: "staging"  # Which deployment's database `ingest add --from-neurostore` reads. Sets the ssh host, ssh user, container name, docker network and forward port together; any of those set explicitly still wins. The upload stage posts to neurostore_api_url instead
upload_use_ssh: true  # Tunnel over SSH to the neurostore database `ingest add --from-neurostore` reads
upload_ssh_host: "neurostore.xyz"  # SSH host for tunneling to the remote database
upload_ssh_user: "jdkent"  # SSH user for tunneling to the remote database
upload_ssh_key: "~/.ssh/id_ed25519"  # Path to SSH private key for tunneling
upload_remote_bind_host: "neurostore-staging-store-store-pgsql17-1"  # Container name of the Postgres service on the remote host. Compose namespaces these per deployment, so find yours with `ssh <host> docker ps --format '{{.Names}}' | grep pgsql`
upload_remote_container_network: "neurostore-staging-store_default"  # Docker network to look the remote bind host up on when it is a container name that does not resolve outside the remote host
upload_remote_bind_port: 5432  # Remote bind port for the Postgres service
upload_local_forward_port: 6543  # Local port to forward to the remote database via SSH
upload_db_host: "localhost"  # Database host used by SQLAlchemy (often localhost when tunneling)
upload_db_name: "neurostore"  # Name of the neurostore database `ingest add --from-neurostore` reads
upload_db_user: "postgres"  # User for the neurostore database `ingest add --from-neurostore` reads
upload_db_password: "example"  # Password for the neurostore database `ingest add --from-neurostore` reads
upload_connect_timeout: 30  # Connection timeout (seconds) for the neurostore database `ingest add --from-neurostore` reads
neurostore_api_url: null  # Base URL of the neurostore the upload stage posts coordinate parses to (<url>/api/study-schema-uploads/), without /api: https://staging.neurostore.xyz or https://neurostore.org. Unset, upload sends nothing
neurostore_auth0_url: null  # Auth0 tenant upload asks for a token with NEUROSTORE_CLIENT_ID and NEUROSTORE_CLIENT_SECRET when NEUROSTORE_TOKEN is unset. Unset, the tenant neurostore_api_url's deployment uses (neurosynth-staging for staging, neurosynth for neurostore.org)
neurostore_auth0_audience: null  # Audience of that token: the Auth0 API neurostore checks tokens against, not the URL uploads go to. Unset, the deployment's own (https://staging.synth.neurostore.xyz/api/ for staging)
