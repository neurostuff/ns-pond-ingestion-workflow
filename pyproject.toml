[project]
name = "ingestion-workflow"
version = "0.1.0"
description = "Modular ingestion workflow for Neurostore data pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Ingestion Workflow Team" }
]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.5",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  # study_schema's JSON Schema, the ingester's own check, run on every parse before upload.
  "jsonschema>=4.0",
  "tenacity>=8.2",
  "openai>=1.35.0",
  "pandas>=2.2",
  "lxml>=4.9",
  "beautifulsoup4>=4.12",
  "readabilipy~=0.3.0",
  "regex>=2024.5.15",
  "SQLAlchemy>=2.0",
  "simplejson>=3.19",
  "xmltodict>=0.13",
  "seleniumbase>=4.34",
  "tqdm>=4.66",
  "filelock>=3.15",
  # The table reader, serialiser and the two gates that decide which tables are
  # worth an LLM call. Its own repo so the models can be refitted and the
  # generator iterated on without touching the pipeline.
  "nspond-tables @ git+https://github.com/neurostuff/coordinate-table-identifier.git@main",
  "paramiko>=3,<4",
  "pubget @ git+https://github.com/neuroquery/pubget.git@main",
  "ACE @ git+https://github.com/neurosynth/ACE.git@master",
  "elsevier-coordinate-extraction @ git+https://github.com/neurostuff/elsevier_coordinate_extractor.git@main",
  "pydantic-settings>=2.5",
  "sshtunnel>=0.4",
  "psycopg[binary]>=3.1",
  "docling>=2.0",
  "pypdfium2>=4",
  "shortuuid>=1.0",
  "pyarty @ git+https://github.com/jdkent/pyarty.git@main#egg=pyarty",
  # study_schema.spaces, the coordinate-space alias table shared with pondie and
  # neurostore, and CoordinateRole and AnchorKind, the role vocabulary of every
  # set (services.set_roles; needs CoordinateRole.other), keys.normalize_name,
  # which resolve compares prose analysis names by, and keys.analysis_key, the
  # content key the parse mints for every analysis, and CopyRoute, CopyVersion and
  # CopyAccess, the facts each download records about its copy, and paper_parse.Author,
  # each author with ids and affiliations, and ParsedPaper.links with the
  # data_availability SectionKind, and each PaperLink's occurrences (LinkOccurrence,
  # LinkSource), and LicenseId spelled as its member names (`cc_by`; paper-parse 0.11.0),
  # and the `normalized` sidecar on every extracted value, which `normalization` writes.
  # Pinned to the merge of neurostuff/study_schema#56, the commit pondie pins.
  "study-schema @ git+https://github.com/neurostuff/study_schema.git@b7efbdd6c465a00e2ef80d19b47acff6bb17471e",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
  "pytest-cov>=4.1",
  "pytest-recording>=0.13",
  "pytest-xdist>=3.5",
  # The mock neurostore checks requests and answers against neurostore's OpenAPI 3.0 spec.
  "openapi-schema-validator>=0.6",
]
lint = [
  "ruff>=0.6",
]
# `ingestion_workflow.normalization`: task, condition, medical-condition and contrast-set
# normalization of extraction records. pondie supplies the MONDO/ONVOC linker and the
# sidecar shape; the pin is the merge of neurostuff/pondie#31, which pins the same
# study_schema commit as above. scikit-learn is pinned to the version the fixed fits were
# pickled with. spaCy's en_core_web_sm, pondie's negation parser, is a separate download:
# python -m spacy download en_core_web_sm
normalize = [
  "pondie[encoders] @ git+https://github.com/neurostuff/pondie.git@8c796f4eb2fc03337bad38ffadca2dea4f6e9f8d",
  "scikit-learn==1.9.1",
  "scipy>=1.11",
  "numpy>=1.26",
  "sentence-transformers>=3",
]

[project.scripts]
ingest = "ingestion_workflow.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion_workflow*"]

[tool.setuptools.package-data]
"ingestion_workflow.data_sources" = ["curated.tsv"]
"ingestion_workflow.normalization" = ["data/*.json", "data/hed-task/*.json", "data/hed-task/mappings/*.tsv"]

[tool.ruff]
target-version = "py39"
line-length = 99
src = ["ingestion_workflow"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Ported from the Astra build's scripts and taskcat in their own style, so a rule can be diffed against
# the code it came from line by line.
"ingestion_workflow/normalization/**" = ["E501", "E701", "E702", "E731", "E741"]
"experiments/normalization/**" = ["E501", "E701", "E702", "E731", "E741"]
# Vendored from taskcat unchanged but for its data paths.
"ingestion_workflow/normalization/taskcat/**" = ["E402", "E501", "E701", "E702", "E731", "E741", "F841"]

[tool.coverage.run]
branch = true
# ACE extraction runs in a process pool; pytest-cov 7 no longer follows children by itself.
patch = ["subprocess"]
source = ["ingestion_workflow"]
omit = ["ingestion_workflow/tests/*"]
