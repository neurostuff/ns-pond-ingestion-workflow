name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Placeholders so the tests that need a key run against their cassettes.
      # Cassettes are replayed only (--record-mode=none); no secret is used.
      ELSEVIER_API_KEY: replay
      SEMANTIC_SCHOLAR_API_KEY: replay
      # typer forces ANSI colour when GITHUB_ACTIONS is set, which splits the help
      # text the CLI tests assert on.
      _TYPER_FORCE_DISABLE_TERMINAL: "1"
    steps:
      - uses: actions/checkout@v4

      # pyproject names nspond-tables by ssh URL; the repo is public, so fetch it over https.
      - name: Fetch git dependencies over https
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # docling would pull CUDA torch from PyPI (several GB); the CPU wheels are enough.
      # Installed first, alone, so that no other package is resolved against this index.
      - name: Install torch (CPU)
        run: |
          uv venv
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install
        run: uv pip install -e ".[test]"

      # The two docling tests download its model weights from Hugging Face; cached per docling version.
      - name: Read docling's version
        id: docling
        run: echo "version=$(uv pip show docling | sed -n 's/^Version: //p')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: weights
        with:
          path: ~/.cache/huggingface
          key: huggingface-docling-${{ steps.docling.outputs.version }}

      # The only step that reaches Hugging Face: it runs the tests that load the weights,
      # so docling fetches exactly the files it uses. The Test step below runs offline.
      - name: Fetch docling weights
        if: steps.weights.outputs.cache-hit != 'true'
        run: >
          .venv/bin/python -m pytest
          "ingestion_workflow/tests/pipeline/test_extract_symbols_as_digits.py::test_the_pdf_extractor_sets_a_misread_text_aside"
          "ingestion_workflow/tests/extractors/test_wiley_extractor.py::test_a_wiley_pdf_is_read_into_the_articles_pdf_text"
          --record-mode=none

      # readabilipy's wheel ships ExtractArticle.js without its node_modules.
      - name: Install readabilipy's node modules
        run: |
          js="$(.venv/bin/python -c 'import pathlib, readabilipy; print(pathlib.Path(readabilipy.__file__).parent / "javascript")')"
          npm install --prefix "$js" --no-audit --no-fund
          test -f "$js/node_modules/jsdom/lib/api.js"

      - name: Test
        env:
          HF_HUB_OFFLINE: "1"
        run: >
          .venv/bin/python -m pytest ingestion_workflow
          -n auto
          --record-mode=none
          --block-network
          --allowed-hosts=127.0.0.1,localhost
          -rs
          --durations=25
          --cov --cov-report=xml --cov-report=html --cov-report=term

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo
            .venv/bin/python -m coverage report --format=total | sed 's/$/%  (line + branch)/'
            echo
            echo "<details><summary>Per file</summary>"
            echo
            .venv/bin/python -m coverage report --format=markdown --skip-empty
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/

  # Report-only: the repo has many E501 findings that predate this check.
  ruff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Ruff on the files this PR changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- '*.py' > changed.txt
          if [ -s changed.txt ]; then
            xargs uvx ruff@0.17.1 check --output-format=github --exit-zero < changed.txt
          fi
