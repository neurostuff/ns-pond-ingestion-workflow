<figure><p>Data collection and experimental procedure. (a) After psychiatric assessment, subjects who met study criteria (see Patients and Methods section) completed questionnaires assessing self-reported sexual behavior and substance use in the weeks preceding fMRI. (b) Incentive delay task used in the fMRI session. Subjects first saw a cue informing them about the type (pictogram with a $ or a woman), magnitude (size of pictogram), and probability (pie chart) of an upcoming reward. Examples of all possible cases of cues are presented in <a data-track="click" data-track-label="link" data-track-action="figure anchor" href="/articles/npp201778#Fig1">Figure 1c</a>. An empty circle was used to signal control trials with a 100% likelihood of getting no reward (<a data-track="click" data-track-label="link" data-track-action="figure anchor" href="/articles/npp201778#Fig1">Figure 1b</a>, top). Next, the cue was replaced by a question mark, symbolizing a delay period during which a pseudorandom draw was performed according to the previously displayed probability. Following this anticipation phase, participants had to perform a target discrimination task within 1 s. The target was either a triangle (left button press required) or a square (right button press required). If subjects answered correctly within &lt;1 s, they were then allowed to view the outcome of the pseudorandom draw. RTs were later used as an index of motivation. In rewarded monetary trials (following the cue with pictogram of a $; <a data-track="click" data-track-label="link" data-track-action="figure anchor" href="/articles/npp201778#Fig2">Figure 2b</a>, middle), subjects saw a monetary amount displayed on a safe. In rewarded erotic trials (following cue with the pictogram of woman; <a data-track="click" data-track-label="link" data-track-action="figure anchor" href="/articles/npp201778#Fig2">Figure 2b</a>, bottom), subjects saw an erotic picture. After each reward outcome, subjects had to provide a hedonic rating on a continuous scale (1—do not like it to 9—like it very much). In non-rewarded and control trials, subjects saw a scrambled picture (top). (c) Types of cues. Both monetary and erotic cues provided information about the magnitude and probability of reward. For erotic rewards, a small magnitude was always predictive of pictures of women in lingerie or swimming suits, and a large magnitude was always predictive of explicit pictures of woman in postures inviting sexual activity. For monetary cues, a small magnitude was predictive of gains ranging from 1 to 3 PLN (approximately 0.25–0.75 EUR), while a large magnitude was predictive of gains ranging from 6 to 8 PLN (1.5–2 EUR). The probability of obtaining a reward after a correct and fast (&lt;1 s) response was indicated by a background pie chart representing probabilities of 25, 50, or 75%. All monetary gains were paid to the participants at the end of the experiment. Credits for the sample photo: Lies Thru a Lens, CC BY 2.0. For license terms, see: CC BY 2.0.</p></figure>
