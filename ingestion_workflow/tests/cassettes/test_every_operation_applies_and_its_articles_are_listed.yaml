      string: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"indexed":{"date-parts":[[2026,8,29]],"date-time":"2026-08-29T22:58:18Z","timestamp":1788044298306,"version":"build-2784847793"},"reference-count":19,"publisher":"Wiley","issue":"3","license":[{"start":{"date-parts":[[2022,7,19]],"date-time":"2022-07-19T00:00:00Z","timestamp":1658188800000},"content-version":"vor","delay-in-days":48,"URL":"http:\/\/onlinelibrary.wiley.com\/termsAndConditions#vor"}],"content-domain":{"domain":["onlinelibrary.wiley.com"],"crossmark-restriction":true},"short-container-title":["Epileptic
        Disorders"],"published-print":{"date-parts":[[2022,6]]},"abstract":"<jats:title>Abstract<\/jats:title><jats:p><jats:bold><jats:italic>Objective<\/jats:italic><\/jats:bold>.
        <jats:italic>D\u00e9j\u00e0\u2010vu<\/jats:italic> is a mental phenomenon
        commonly experienced during temporal lobe seizures and can be evoked by electrical
        stimulation of the temporal lobe. We analyzed reproducible <jats:italic>d\u00e9j\u00e0\u2010vu<\/jats:italic>
        experiences evoked by stimulating the insula in two patients with pharmacoresistant
        temporal lobe epilepsy.<\/jats:p><jats:p><jats:bold><jats:italic>Methods<\/jats:italic><\/jats:bold>.
        We reviewed video\u2010electroencephalography (EEG) recordings from extraoperative
        electrical cortical stimulation sessions. In addition, we performed the directed
        transfer function (DTF) effective connectivity measure of monopolar signals
        in Patient 1. To highlight elective changes due to each stimulation, we subtracted
        pre\u2010stimulation DTF matrices from early poststimulation matrices. This
        analysis was performed for both non\u2010inducing\u2010<jats:italic>d\u00e9j\u00e0vu<\/jats:italic>
        stimulation (control matrix) and <jats:italic>d\u00e9j\u00e0\u2010vu<\/jats:italic>\u2010inducing
        stimulation (active matrix). Finally, the control matrix was subtracted from
        the active matrix.<\/jats:p><jats:p><jats:bold><jats:italic>Results<\/jats:italic><\/jats:bold>.
        Comparison of effective connectivity during control stimulation versus <jats:italic>d\u00e9j\u00e0\u2010vu<\/jats:italic>\u2010inducing
        stimulation revealed a reversal of connectivity levels in three main regions:
        the contralateral inferior insula (the ipsilateral insula could not be analyzed),
        bilateral mesiotemporal regions and the ipsilateral superior frontal gyrus.
        The drivers of evoked <jats:italic>d\u00e9j\u00e0\u2010vu<\/jats:italic> were
        the mesiotemporal regions (mainly ipsilateral) and the ipsilateral superior
        frontal gyrus.<\/jats:p><jats:p><jats:bold><jats:italic>Significance<\/jats:italic><\/jats:bold>.
        Although our findings are possibly anecdotal, the insula may (in rare instances)
        remotely generate unexpected <jats:italic>d\u00e9j\u00e0\u2010vu<\/jats:italic>.
        If confirmed by further studies, this might change the assessment strategy
        for possible causes of anterior temporal lobectomy failure.<\/jats:p>","DOI":"10.1684\/epd.2022.1433","type":"journal-article","created":{"date-parts":[[2022,6,30]],"date-time":"2022-06-30T10:17:43Z","timestamp":1656584263000},"page":"561-566","update-policy":"https:\/\/doi.org\/10.1002\/crossmark_policy","source":"Crossref","is-referenced-by-count":6,"title":["<i>D\u00e9j\u00e0\u2010vu<\/i>
