    body:
      string: '[{"paperId": "04930cb34061847ed43870d37c5a989e1ef4a6a0", "title": "Human
        neuroimaging reveals the subcomponents of grasping, reaching and pointing
        actions.", "venue": "Cortex; a journal devoted to the study of the nervous
        system and behavior", "year": 2018, "isOpenAccess": true, "openAccessPdf":
        {"url": "http://dro.dur.ac.uk/21963/", "status": "GREEN", "license": "CCBYNCND",
        "disclaimer": "Notice: Paper or abstract available at https://api.unpaywall.org/v2/10.1016/j.cortex.2017.05.018?email=<INSERT_YOUR_EMAIL>
        or https://doi.org/10.1016/j.cortex.2017.05.018, which is subject to the license
        by the author or copyright owner provided with this content. Please go to
        the source to verify the license and copyright information for your use."},
        "publicationDate": null, "authors": [{"authorId": "1399579848", "name": "C.
        Cavina-Pratesi"}, {"authorId": "11686285", "name": "J. Connolly"}, {"authorId":
        "6101580", "name": "S. Monaco"}, {"authorId": "7280327", "name": "Teresa D
        Figley"}, {"authorId": "153558474", "name": "A. Milner"}, {"authorId": "2512036695",
        "name": "T. Schenk"}, {"authorId": "3048019", "name": "J. Culham"}], "abstract":
        "Although the neural underpinnings of visually guided grasping and reaching
        have been well delineated within lateral and medial fronto-parietal networks
        (respectively), the contributions of subcomponents of visuomotor actions have
        not been explored in detail. Using careful subtraction logic, here we investigated
        which aspects of grasping, reaching, and pointing movements drive activation
        across key areas within visuomotor networks implicated in hand actions. For
        grasping tasks, we find activation differences based on the precision required
        (fine\u00a0>\u00a0coarse grip: anterior intraparietal sulcus, aIPS), the requirement
        to lift the object (grip\u00a0+\u00a0lift\u00a0>\u00a0grip: aIPS; dorsal premotor
        cortex, PMd; and supplementary motor area, SMA), and the number of digits
        employed (3-/5- vs. 2-digit grasps: ventral premotor cortex, PMv; motor cortex,
        M1, and somatosensory cortex, S1). For reaching/pointing tasks, we find activation
        differences based on whether the task required arm transport ((reach-to-point
        with index finger and reach-to-touch with knuckles) vs. point-without-reach;
        anterior superior parietal lobule, aSPL) and whether it required pointing
        to the object centre ((point-without-reach and reach-to-point) vs. reach-to-touch:
        anterior superior parieto-occipital cortex, aSPOC). For point-without-reach,
        in which the index finger is oriented towards the object centre but from a
        distance (point-without-reach\u00a0>\u00a0(reach-to-point and reach-to-touch)),
        we find activation differences that may be related to the communicative nature
        of the task (temporo-parietal junction, TPJ) and the need to precisely locate
        the target (lateral occipito-temporal cortex, LOTC). The present findings
        elucidate the different subcomponents of hand actions and the roles of specific
        brain regions in their computation."}]

        '
