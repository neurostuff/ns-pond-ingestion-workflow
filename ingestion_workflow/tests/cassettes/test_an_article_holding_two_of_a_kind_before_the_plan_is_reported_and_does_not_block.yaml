      string: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"indexed":{"date-parts":[[2026,8,17]],"date-time":"2026-08-17T20:45:05Z","timestamp":1786999505514,"version":"build-2736575974"},"reference-count":32,"publisher":"Cambridge
        University Press (CUP)","issue":"10","license":[{"start":{"date-parts":[[2017,3,14]],"date-time":"2017-03-14T00:00:00Z","timestamp":1489449600000},"content-version":"unspecified","delay-in-days":0,"URL":"https:\/\/www.cambridge.org\/core\/terms"}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":["Psychol.
        Med."],"published-print":{"date-parts":[[2017,7]]},"abstract":"<jats:sec id=\"S0033291717000265_sec_a1\">\n                    <jats:title>Background<\/jats:title>\n                    <jats:p>Generalized
        anxiety disorder (GAD) and social anxiety disorder (SAD) are co-morbid and
        associated with similar neural disruptions during emotion regulation. In contrast,
        the lack of optimism examined here may be specific to GAD and could prove
        an important biomarker for that disorder.<\/jats:p>\n                  <\/jats:sec>\n                  <jats:sec
        id=\"S0033291717000265_sec_a2\" sec-type=\"methods\">\n                    <jats:title>Method<\/jats:title>\n                    <jats:p>\n                      Unmedicated
        individuals with GAD (\n                      <jats:italic>n<\/jats:italic>\n                      \u00a0=\u00a018)
        and age-, intelligence quotient- and gender-matched SAD (\n                      <jats:italic>n<\/jats:italic>\n                      \u00a0=\u00a018)
        and healthy (\n                      <jats:italic>n<\/jats:italic>\n                      \u00a0=\u00a018)
        comparison individuals were scanned while contemplating likelihoods of high-
        and low-impact negative (e.g. heart attack; heartburn) or positive (e.g. winning
        lottery; hug) events occurring to themselves in the future.\n                    <\/jats:p>\n                  <\/jats:sec>\n                  <jats:sec
        id=\"S0033291717000265_sec_a3\" sec-type=\"results\">\n                    <jats:title>Results<\/jats:title>\n                    <jats:p>\n                      As
        expected, healthy subjects showed significant optimistic bias (OB); they considered
        themselves significantly less likely to experience future negative but significantly
        more likely to experience future positive events relative to others (\n                      <jats:italic>p<\/jats:italic>\n                      \u00a0&lt;\u00a00.001).
        This was also seen in SAD, albeit at trend level for positive events (\n                      <jats:italic>p<\/jats:italic>\n                      \u00a0&lt;\u00a00.001
        and\n                      <jats:italic>p<\/jats:italic>\n                      \u00a0&lt;\u00a00.10,
        respectively). However, GAD patients showed no OB for positive events (\n                      <jats:italic>t<\/jats:italic>\n                      <jats:sub>17<\/jats:sub>\n                      \u00a0=\u00a00.82,\n                      <jats:sc>n.s<\/jats:sc>\n                      .)
        and showed significantly reduced neural modulation relative to the two other
        groups of regions including the medial prefrontal cortex (mPFC) and caudate
        to these events (\n                      <jats:italic>p<\/jats:italic>\n                      \u00a0&lt;\u00a00.001
        for all). The GAD group further differed from the other groups by showing
        increased neural responses to low-impact events in regions including the rostral
        mPFC (\n                      <jats:italic>p<\/jats:italic>\n                      \u00a0&lt;\u00a00.05
        for both).\n                    <\/jats:p>\n                  <\/jats:sec>\n                  <jats:sec
        id=\"S0033291717000265_sec_a4\" sec-type=\"conclusion\">\n                    <jats:title>Conclusions<\/jats:title>\n                    <jats:p>The
        neural dysfunction identified here may represent a unique feature associated
        with reduced optimism and increased worry about everyday events in GAD. Consistent
        with this possibility, patients with SAD did not show such dysfunction. Future
        studies should consider if this dysfunction represents a biomarker for GAD.<\/jats:p>\n                  <\/jats:sec>","DOI":"10.1017\/s0033291717000265","type":"journal-article","created":{"date-parts":[[2017,3,14]],"date-time":"2017-03-14T05:10:54Z","timestamp":1489468254000},"page":"1806-1815","source":"Crossref","is-referenced-by-count":22,"title":["Reduced
        optimism and a heightened neural response to everyday worries are specific
        to generalized anxiety disorder, and not seen in social anxiety"],"prefix":"10.1017","volume":"47","author":[{"given":"K.
        S.","family":"Blair","sequence":"first","affiliation":[],"role":[{"vocabulary":"crossref","role":"author"}]},{"given":"M.","family":"Otero","sequence":"additional","affiliation":[],"role":[{"vocabulary":"crossref","role":"author"}]},{"given":"C.","family":"Teng","sequence":"additional","affiliation":[],"role":[{"vocabulary":"crossref","role":"author"}]},{"given":"M.","family":"Geraci","sequence":"additional","affiliation":[],"role":[{"vocabulary":"crossref","role":"author"}]},{"given":"M.","family":"Ernst","sequence":"additional","affiliation":[],"role":[{"vocabulary":"crossref","role":"author"}]},{"given":"R.
