      string: '[{"id":28121,"slug":"the-atherosclerosis-risk-in-communities-study","link":"https:\/\/neurodegenerationresearch.eu\/the-atherosclerosis-risk-in-communities-study\/","title":{"rendered":"The
        Atherosclerosis Risk in Communities Study"},"content":{"rendered":"<p>The
        Atherosclerosis Risk in Communities Study (ARIC) is a prospective epidemiologic
        study conducted in four U.S. communities. ARIC is designed to investigate
        the etiology and natural history of atherosclerosis, the etiology of clinical
        atherosclerotic diseases, and variation in cardiovascular risk factors, medical
        care and disease by race, gender, location, and date. Since 2011 a large ancillary
        study, the ARIC Neurocognitive Study (ARIC-NCS) has been assessing neurocognitive
        status and adjudicating possible cases of dementia.<\/p>\n<p>Four ARIC field
        centers each randomly selected and recruited a cohort sample of approximately
        4,000 individuals aged 45-64 from a defined population in their community.
        A total of 15,792 participants received an extensive baseline examination
        (visit 1, 1987-1989), including medical, social, and demographic data collection.
        Subsequent examinations occurred in 1990-92 (visit 2), 1993-95 (visit 3),
        1996-98 (visit 4), 2011-2013 (visit 5) and 2016-2017 (visit 6).  Visit 7 (2018-2019)
        is currently in progress. Follow-up occurs annually (semi-annually since 2012)
        by telephone to maintain contact with participants and to assess health status
        of the cohort.<\/p>\n<p><span data-sheets-root=\"1\">Types <\/span>General
        population-based cohort<br \/>\n<span data-sheets-root=\"1\">Participant Types
