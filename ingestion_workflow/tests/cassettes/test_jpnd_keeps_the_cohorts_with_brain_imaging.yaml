        Science Foundation of Shandong Province<br \/>\ncontact email <a href=\"mailto:
        chengxuan.qiu@ki.se\">chengxuan.qiu@ki.se<\/a><br \/>\ncontact phone number\u00a0<br
        \/>\nestimated current sample size 0 to 4,999<br \/>\nsample sizes\u00a01,480<\/p>\n","protected":false}},{"id":28105,"slug":"epiporto","link":"https:\/\/neurodegenerationresearch.eu\/epiporto\/","title":{"rendered":"EPIPorto"},"content":{"rendered":"<p>The
        EPIPorto study is a landmark in epidemiological research in Portugal. It is
        a population-based cohort study, ongoing for over 15 years, with the main
        aim of assessing the determinants of health in the adult population of Porto.
        For this purpose we randomly selected 2485 persons, who have been repeatedly
        evaluated over time.<\/p>\n<p>Participants were invited to visit the study
        centre to answer a questionnaire on social, demographic and behavioural characteristics,
        and their clinical history. Additionally, objective measurements were made,
        including blood tests, blood pressure, weight and height, electrocardiogram,
        evaluation of lung function and bone mineral density. The participants\u0092
        address was georeferenced, allowing the analysis of the spatial distribution
        of health states and events in the city. Subgroups of the cohort at the baseline
        evaluation were used as controls in case-control studies namely on myocardial
        infarction and gastric cancer.<\/p>\n<p><span data-sheets-root=\"1\">Types
        <\/span>General population-based cohort<br \/>\n<span data-sheets-root=\"1\">Participant
        Types <\/span><br \/>\n<span data-sheets-root=\"1\">Countries <\/span>Portugal<br
        \/>\n<span data-sheets-root=\"1\">Genders <\/span>Male and Female<br \/>\n<span
