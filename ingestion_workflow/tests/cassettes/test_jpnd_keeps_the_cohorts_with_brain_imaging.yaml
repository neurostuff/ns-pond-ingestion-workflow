        Longitudinal Study of Adult Men"},"content":{"rendered":"<p>ULSAM is a unique,
        ongoing, longitudinal, epidemiologic study based on all available men, born
        between 1920 and 1924, in Uppsala County, Sweden. The men were investigated
        at the ages of 50, 60, 70, 77, 82 88 and 93 years. The reinvestigations in
        ULSAM were based on the previous investigations. Full screening and official
        registry data is available in our databases and more data is continuously
        added.<\/p>\n<p>Health examination at 93 years of age was carried out between
        December 2013 and March 2015. To this examination 245 men have been invited.
        Totally 147 men (60%) participated in the investigation. Of these, 23 men
        were examined at the hospital and 102 were visited at home by a nurse. In
        addition, 22 men completed only a questionnaire. To this examination even
        spouses were invited. In the complete examination 43 spouses have participated
        and 11 completed only a questionnaire.<\/p>\n<p><span data-sheets-root=\"1\">Types
