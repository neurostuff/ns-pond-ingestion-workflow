        \/>\nsample sizes\u00a02,322<\/p>\n","protected":false}},{"id":28032,"slug":"next-steps-2-2","link":"https:\/\/neurodegenerationresearch.eu\/next-steps-2-2\/","title":{"rendered":"Next
        Steps"},"content":{"rendered":"<p>Recruitment Period: 2004<br \/>\nSample
        size at start or planned sample size if still recruiting: 16,122 (15,770 households
        included at Sweep 1; 352 ethnic boost interviews added at Sweep 4)<br \/>\nEstimated
        current sample size: 15,629<br \/>\nAge at recruitment: 13-14<\/p>\n<p>Abstract<br
        \/>\nNext Steps (previously known as the Longitudinal Study of Young People
        in England &#8211; LSYPE) is a major innovative cohort study of young people.
        The study began in 2004 and included all young people in Year 9, aged between
        13 and 14, who attended state and independent schools in England.<\/p>\n<p>Next
        Steps is one of the main information sources for the formation and appraisal
        of policies relating to young people and will continue to be so for at least
        the next 10 years. The baseline data will be used to monitor the progress
        of the cohort group, evaluate the success of policies aimed at this group
        and provide an evidence base for further policy development. The study brings
        together data from a wide range of sources and reflects the variety of influences
        on learning and progression. <\/p>\n<p>Following the initial survey at age
        13-14, the cohort members were visited every year until 2010, when they were
        age 19-20. Young people were interviewed along with their parents up to sweep
        4 (age 17).<\/p>\n<p>The most recent survey took place in 2015\/16, when the
        cohort members were 25 years old. It maintained the strong focus on education,
        but the content was broadened to become a more multi-disciplinary research
        resource. Data was collected about cohort members&#8217; housing and family
        life, employment and economic circumstances, education and job training, physical
        and emotional health, and identity and participation. A wide range of administrative
        data linkage consents were collected in the domains of health, education,
        economics and criminal behaviour.<\/p>\n<p><span data-sheets-root=\"1\">Types
        <\/span>General population-based cohort<br \/>\n<span data-sheets-root=\"1\">Participant
