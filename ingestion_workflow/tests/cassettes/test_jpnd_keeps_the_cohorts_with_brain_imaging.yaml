        details<br \/>\nabstract\u00a0 JSTAR project researchers aimed to construct
        a world-class longitudinal dataset on middle-aged and elderly Japanese persons
        to enable researchers worldwide to perform scientific investigation on aging
        and retirement from an international perspective.<br \/>\nfunders\u00a0 Research
        Institute of Economy, Trade and Industry (RIETI)<br \/>\ncontact email <a
