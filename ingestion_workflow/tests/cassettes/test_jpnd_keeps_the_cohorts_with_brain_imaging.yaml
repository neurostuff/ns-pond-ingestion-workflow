        Confucius Hometown Aging Project"},"content":{"rendered":"<p>The Confucius
        Hometown Aging Project (CHAP) is a longitudinal study of vascular risk factors,
        ageing, and health in people aged 60 years or older who live in a rural community
        near Qufu (hometown of Confucius), Shandong, China. The study was done by
        local hospital staff consisting of clinicians and nurses.<\/p>\n<p><span data-sheets-root=\"1\">Types
