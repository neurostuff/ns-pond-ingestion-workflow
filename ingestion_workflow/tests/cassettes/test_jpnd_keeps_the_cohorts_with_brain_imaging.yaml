        hidehashimoto-circ@umin.ac.jp<\/a><br \/>\ncontact phone number\u00a0<br \/>\nestimated
        current sample size<br \/>\nsample sizes\u00a07,268<\/p>\n","protected":false}},{"id":28107,"slug":"1958-national-child-development-study-2","link":"https:\/\/neurodegenerationresearch.eu\/1958-national-child-development-study-2\/","title":{"rendered":"1958
        National Child Development Study"},"content":{"rendered":"<p>The National
        Child Development Study (NCDS) is a longitudinal study which follows the lives
        of 17,000 people born in England, Scotland and Wales in a single week of 1958.
        Also known as the 1958 Birth Cohort Study, it collects information on physical
        and educational development, economic circumstances, employment, family life,
        health behaviour, wellbeing, social participation and attitudes.<\/p>\n<p>Since
        the birth survey in 1958, there have been nine further \u0091sweeps\u0092
        of all cohort members at ages 7, 11, 16, 23, 33, 42, 46, 50 and 55. In 2003
        (at age 45), 9,000 cohort members also participated in a special bio-medical
        survey to learn more about how development, environments and lifestyles affect
        people\u0092s health. CLS will carry out a new survey of the NCDS cohort at
        age 60 in 2018.<\/p>\n<p>NCDS is part of CLOSER (Cohort &amp; Longitudinal
        Studies Enhancement Resources) which aims to maximise the use, value and impact
        of the UK&#8217;s longitudinal studies.<\/p>\n<p><span data-sheets-root=\"1\">Types
        <\/span>General population-based cohort<br \/>\n<span data-sheets-root=\"1\">Participant
        Types <\/span>No diagnosis<br \/>\n<span data-sheets-root=\"1\">Countries
