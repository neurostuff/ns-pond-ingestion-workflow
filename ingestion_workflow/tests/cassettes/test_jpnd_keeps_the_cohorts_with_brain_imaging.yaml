        1970 British Cohort Study"},"content":{"rendered":"<p>The 1970 British Cohort
        Study (BCS70) follows the lives of more than 17,000 people born in England,
        Scotland and Wales in a single week of 1970. Over the course of cohort members
        lives, the BCS70 has collected information on health, physical, educational
        and social development, and economic circumstances among other factors.<\/p>\n<p><span
