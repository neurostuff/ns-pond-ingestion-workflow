      string: '[{"paperId": "e80de2e17d4a79d0d1955975ff1d17537210119d", "title": "Intranasal
        oxytocin increases neural responses to social reward in post-traumatic stress
        disorder", "venue": "Social Cognitive and Affective Neuroscience", "year":
        2016, "isOpenAccess": true, "openAccessPdf": {"url": "https://doi.org/10.1093/scan/nsw123",
        "status": "HYBRID", "license": "CCBYNC", "disclaimer": "Notice: Paper or abstract
        available at https://pmc.ncbi.nlm.nih.gov/articles/PMC5390752, which is subject
        to the license by the author or copyright owner provided with this content.
        Please go to the source to verify the license and copyright information for
        your use."}, "publicationDate": "2016-10-25", "authors": [{"authorId": "4349481",
        "name": "L. Nawijn"}, {"authorId": "88026243", "name": "M. van Zuiden"}, {"authorId":
        "143993800", "name": "S. Koch"}, {"authorId": "6723470", "name": "J. Frijling"},
        {"authorId": "2605579", "name": "D. Veltman"}, {"authorId": "6138013", "name":
        "M. Olff"}], "abstract": "Abstract Therapeutic alliance and perceived social
        support are important predictors of treatment response for post-traumatic
        stress disorder (PTSD). Intranasal oxytocin administration may enhance treatment
        response by increasing sensitivity for social reward and thereby therapeutic
        alliance and perceived social support. As a first step to investigate this
        therapeutical potential, we investigated whether intranasal oxytocin enhances
        neural sensitivity to social reward in PTSD patients. Male and female police
        officers with (n = 35) and without PTSD (n = 37) were included in a double-blind,
        randomized, placebo-controlled cross-over fMRI study. After intranasal oxytocin
        (40\u2009IU) and placebo administration, a social incentive delay task was
        conducted to investigate neural responses during social reward and punishment
        anticipation and feedback. Under placebo, PTSD patients showed reduced left
        anterior insula (AI) responses to social rewards (i.e. happy faces) compared
        with controls. Oxytocin administration increased left AI responses during
        social reward in PTSD patients, such that PTSD patients no longer differed
        from controls under placebo. Furthermore, in PTSD patients, oxytocin increased
        responses to social reward in the right putamen. By normalizing abberant insula
        responses and increasing putamen responses to social reward, oxytocin administration
        may enhance sensitivity for social support and therapeutic alliance in PTSD
        patients. Future studies are needed to investigate clinical effects of oxytocin."}]

        '
