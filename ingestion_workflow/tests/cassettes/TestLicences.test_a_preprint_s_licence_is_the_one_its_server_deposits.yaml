    body:
      string: '[{"paperId": "16cbcd88abb68cb55ca887a010c805e087e8f9d5", "title": "Direct
        interoceptive input to the insular cortex shapes learned feeding behavior",
        "venue": "bioRxiv", "year": 2025, "isOpenAccess": true, "openAccessPdf": {"url":
        "https://www.biorxiv.org/content/biorxiv/early/2025/05/17/2025.05.13.653896.full.pdf",
        "status": "GREEN", "license": "CCBYNCND", "disclaimer": "Notice: Paper or
        abstract available at https://pmc.ncbi.nlm.nih.gov/articles/PMC12132522, which
        is subject to the license by the author or copyright owner provided with this
        content. Please go to the source to verify the license and copyright information
        for your use."}, "publicationDate": "2025-05-17", "authors": [{"authorId":
        "2291774548", "name": "Zhe Zhao"}, {"authorId": "2291394360", "name": "Binbin
        Xu"}, {"authorId": "2161262597", "name": "Skylar A. Anthony"}, {"authorId":
        "2284315911", "name": "S. Subramanian"}, {"authorId": "2293070854", "name":
        "B. Granger"}, {"authorId": "2099828669", "name": "Carolyn Von-Walter"}, {"authorId":
        "5773772", "name": "E. Mizrachi"}, {"authorId": "2073386726", "name": "M.
        Kidd"}, {"authorId": "2291130456", "name": "Abhishikta Srigiriraju"}, {"authorId":
        "2291130040", "name": "Isaac McKie"}, {"authorId": "2109822108", "name": "Zhiying
        Li"}, {"authorId": "2291130389", "name": "M. Bolton"}, {"authorId": "2294839988",
        "name": "S. Berto"}, {"authorId": "2277457002", "name": "Sarah A. Stern"}],
        "abstract": "The insular cortex (insula) is an interoceptive hub, which senses
        internal states such as hunger, thirst, pain, and emotions. Previous studies
        suggest that the insula directly senses internal states, but the mechanisms
        remain elusive. We identified a population of leptin receptor-positive cells
        with a unique morphology in the insula (INSLepR). Based on leptin\u2019s known
        role in signaling adiposity, we hypothesized that INSLepR neurons detect internal
        states to regulate food intake and body weight. Accordingly, we found that
        intra-insula leptin administration or optogenetic stimulation of INSLepR neurons
        impacts feeding behavior. Moreover, INSLepR neuron activity encodes feeding
        bouts in an internal-state dependent manner, and leptin alters insula neural
        dynamics in response to feeding, while also reshaping the transcriptome. Taken
        together, our data supports a model for direct interoceptive input to the
        insula, in which INSLepR cells integrate adiposity level signals to regulate
        feeding and body weight in a learned manner."}]

        '
