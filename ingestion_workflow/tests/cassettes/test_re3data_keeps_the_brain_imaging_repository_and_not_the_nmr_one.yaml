        \                               <r3d:remarks>Description: &quot;The National
        Database for Autism Research (NDAR) is an NIH-funded research data repository
        that aims to accelerate progress in autism spectrum disorders (ASD) research
        through data sharing, data harmonization, and the reporting of research results.
        NDAR also serves as a scientific community platform and portal to multiple
        other research repositories, allowing for aggregation and secondary analysis
        of data. NDAR combines the function of a data repository, which holds genetic,
        phenotypic, clinical, and medical imaging data, and the function of a scientific
        community platform, which defines the standard tools and policies to integrate
        the computational resources developed by scientific research institutions,
        private foundations, and other federal and state agencies supporting ASD research.
        Furthermore, NDAR is working to develop the means to connect relevant repositories
        together through data federation.&quot;\r\nNDAR is part of the NIMH Data Archive.
        \r\nThe NDAR Data Access Committee (DAC) approves access to data and/or images
        from the NDAR Central Repository for research purposes only.</r3d:remarks>\n
