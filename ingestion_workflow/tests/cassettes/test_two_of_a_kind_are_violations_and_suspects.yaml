        Science Foundation","award":["1764421"],"award-info":[{"award-number":["1764421"]}]},{"DOI":"10.13039\/100000002","name":"National
        Institutes of Health","doi-asserted-by":"crossref","award":["R01GM116538"],"award-info":[{"award-number":["R01GM116538"]}],"id":[{"id":"10.13039\/100000002","id-type":"DOI","asserted-by":"crossref"}]}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"published-print":{"date-parts":[[2024,7,15]]},"abstract":"<jats:title>ABSTRACT<\/jats:title>\n                  <jats:p>SoxB1
        transcription factors (Sox2\/3) are well known for their role in early neural
        fate specification in the embryo, but little is known about functional roles
        for SoxB1 factors in non-neural ectodermal cell types, such as the neural
        plate border (NPB). Using Xenopus laevis, we set out to determine whether
        SoxB1 transcription factors have a regulatory function in NPB formation. Here,
        we show that SoxB1 factors are necessary for NPB formation, and that prolonged
        SoxB1 factor activity blocks the transition from a NPB to a neural crest state.
        Using ChIP-seq, we demonstrate that Sox3 is enriched upstream of NPB genes
        in early NPB cells and in blastula stem cells. Depletion of SoxB1 factors
        in blastula stem cells results in downregulation of NPB genes. Finally, we
        identify Pou5f3 factors as potential Sox3 partners in regulating the formation
        of the NPB and show that their combined activity is needed for normal NPB
