      string: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"institution":[{"name":"bioRxiv"}],"indexed":{"date-parts":[[2026,1,15]],"date-time":"2026-01-15T20:23:47Z","timestamp":1768508627596,"version":"3.49.0"},"posted":{"date-parts":[[2023,9,29]]},"group-title":"Developmental
        Biology","reference-count":69,"publisher":"openRxiv","content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"accepted":{"date-parts":[[2023,9,29]]},"abstract":"<jats:title>Abstract<\/jats:title>\n                <jats:p>\n                  SoxB1
        transcription factors (Sox2\/3) are well known for their role in early neural
        fate specification in the embryo, but little is known about functional roles
        for SoxB1 factors in non-neural ectodermal cell types, such as the neural
        plate border (NPB). Using\n                  <jats:italic>Xenopus laevis<\/jats:italic>\n                  ,
        we set out to determine if SoxB1 transcription factors have a regulatory function
        in NPB formation. Herein, we show that SoxB1 factors are necessary for NPB
        formation, and that prolonged SoxB1 factor activity blocks the transition
        from a NPB to a neural crest state. Using ChIP-seq we demonstrate that Sox3
        is enriched upstream of NPB genes in early NPB cells and, surprisingly, in
        blastula stem cells. Depletion of SoxB1 factors in blastula stem cells results
        in downregulation of NPB genes. Finally, we identify Pou5f3 factors as a potential
        SoxB1 partners in regulating the formation of the NPB and show their combined
        activity is needed to maintain NPB gene expression. Together, these data identify
        a novel role for SoxB1 factors in the establishment and maintenance of the
        NPB, in part through partnership with Pou5f3 factors.\n                <\/jats:p>","DOI":"10.1101\/2023.09.28.560033","type":"posted-content","created":{"date-parts":[[2023,9,29]],"date-time":"2023-09-29T22:30:15Z","timestamp":1696026615000},"source":"Crossref","is-referenced-by-count":2,"title":["SoxB1
