        content-type=\"pdf\">nihpp-2023.02.24.529876.pdf</self-uri><related-article
        xmlns:xlink=\"http://www.w3.org/1999/xlink\" related-article-type=\"published-article\"
        xml:lang=\"en\" xlink:title=\"research-article\" journal-id=\"Biol Psychiatry\"
        journal-id-type=\"nlm-ta\" ext-link-type=\"pmc\" xlink:href=\"PMC10772211\"><article-title>Traumatic
        brain injury-induced fear generalization in mice involves hippocampal memory
        trace dysfunction and is alleviated by (<italic toggle=\"yes\">R,S</italic>)-ketamine</article-title><volume>95</volume><issue>1</issue><date><day>8</day><month>7</month><year>2023</year></date><fpage>15</fpage><lpage>26</lpage><source>Biological
        psychiatry</source><pub-id pub-id-type=\"doi\">10.1016/j.biopsych.2023.06.030</pub-id><pub-id
        pub-id-type=\"pmcid\">PMC10772211</pub-id><pub-id pub-id-type=\"pmid\">37423591</pub-id></related-article><abstract><title>ABSTRACT</title><sec><title>INTRODUCTION</title><p>Traumatic
        brain injury (TBI) is a debilitating neurological disorder caused by an impact
        to the head by an outside force. TBI results in persistent cognitive impairments,
        including fear generalization, the inability to distinguish between aversive
        and neutral stimuli. The mechanisms underlying fear generalization have not
        been fully elucidated, and there are no targeted therapeutics to alleviate
        this symptom of TBI.</p></sec><sec><title>METHODS</title><p>\nTo identify
        the neural ensembles mediating fear generalization, we utilized the ArcCreER\n<sup>T2</sup>\nx
        enhanced yellow fluorescent protein (EYFP) mice, which allow for activity-dependent
        labeling and quantification of memory traces. Mice were administered a sham
        surgery or the controlled cortical impact (CCI) model of TBI. Mice were then
        administered a contextual fear discrimination (CFD) paradigm and memory traces
        were quantified in numerous brain regions. In a separate group of mice, we
        tested if (\n<italic toggle=\"yes\">R,S</italic>\n)-ketamine could decrease
        fear generalization and alter the corresponding memory traces in TBI mice.\n</p></sec><sec><title>RESULTS</title><p>\nTBI
        mice exhibited increased fear generalization when compared with sham mice.
        This behavioral phenotype was paralleled by altered memory traces in the DG,
        CA3, and amygdala, but not by alterations in inflammation or sleep. In TBI
        mice, (\n<italic toggle=\"yes\">R,S</italic>\n)-ketamine facilitated fear
        discrimination and this behavioral improvement was reflected in DG memory
        trace activity.\n</p></sec><sec><title>CONCLUSIONS</title><p>\nThese data
        show that TBI induces fear generalization by altering fear memory traces,
        and that this deficit can be improved with a single injection of (\n<italic
        toggle=\"yes\">R,S</italic>\n)-ketamine. This work enhances our understanding
        of the neural basis of TBI-induced fear generalization and reveals potential
        therapeutic avenues for alleviating this symptom.\n</p></sec></abstract><custom-meta-group><custom-meta><meta-name>pmc-status-qastatus</meta-name><meta-value>0</meta-value></custom-meta><custom-meta><meta-name>pmc-status-live</meta-name><meta-value>yes</meta-value></custom-meta><custom-meta><meta-name>pmc-status-embargo</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-status-released</meta-name><meta-value>yes</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-open-access</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-olf</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-manuscript</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-legally-suppressed</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-has-pdf</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-has-supplement</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-pdf-only</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-suppress-copyright</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-is-real-version</meta-name><meta-value>yes</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-is-scanned-article</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-preprint</meta-name><meta-value>yes</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-in-epmc</meta-name><meta-value>no</meta-value></custom-meta></custom-meta-group></article-meta></front></article><article
