        ext-link-type=\"pmc\" xlink:href=\"PMC10939754\"><article-title>Dissociable
        neuronal substrates of visual feature attention and working memory</article-title><volume>112</volume><issue>5</issue><date><day>15</day><month>1</month><year>2024</year></date><fpage>850</fpage><lpage>863.e6</lpage><source>Neuron</source><pub-id
        pub-id-type=\"doi\">10.1016/j.neuron.2023.12.007</pub-id><pub-id pub-id-type=\"pmcid\">PMC10939754</pub-id><pub-id
        pub-id-type=\"pmid\">38228138</pub-id></related-article><abstract><title>Abstract</title><p>Attention
        and working memory (WM) are distinct cognitive functions, yet given their
        close interactions, it has been proposed that they share the same neuronal
        mechanisms. Here we show that in macaques performing a WM-guided feature attention
        task, the activity of most neurons in areas middle temporal (MT), medial superior
        temporal (MST), lateral intraparietal (LIP), and posterior lateral prefrontal
        cortex (LPFC-p) displays either WM coding or attentional modulation, but not
        both. One area thought to play a role in both functions is LPFC-p. To test
        this, we optogenetically inactivated LPFC-p bilaterally during the attention
        or WM periods of the task. Attention period inactivation reduced attentional
        modulation in LPFC-p, MST, and LIP neurons, and impaired task performance.
        WM period inactivation did not affect attentional modulation nor performance,
        and minimally reduced WM coding. Our results suggest that feature attention
        and WM have dissociable neuronal substrates, and that LPFC-p plays a critical
        role in attention but not WM.</p></abstract><custom-meta-group><custom-meta><meta-name>pmc-status-qastatus</meta-name><meta-value>0</meta-value></custom-meta><custom-meta><meta-name>pmc-status-live</meta-name><meta-value>yes</meta-value></custom-meta><custom-meta><meta-name>pmc-status-embargo</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-status-released</meta-name><meta-value>yes</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-open-access</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-olf</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-manuscript</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-legally-suppressed</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-has-pdf</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-has-supplement</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-pdf-only</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-suppress-copyright</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-is-real-version</meta-name><meta-value>yes</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-is-scanned-article</meta-name><meta-value>no</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-preprint</meta-name><meta-value>yes</meta-value></custom-meta><custom-meta><meta-name>pmc-prop-in-epmc</meta-name><meta-value>no</meta-value></custom-meta></custom-meta-group></article-meta></front></article></pmc-articleset>"
