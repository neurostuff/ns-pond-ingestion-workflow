    body:
      string: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"indexed":{"date-parts":[[2026,8,10]],"date-time":"2026-08-10T21:30:46Z","timestamp":1786397446962,"version":"build-2736575974"},"posted":{"date-parts":[[2022,1,28]]},"reference-count":0,"publisher":"Wiley","content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"abstract":"<jats:p>Background:
        Mounting evidence demonstrates that meditation can lower\npain and emotional
        distress in adults, and more recently, in children.\nMeditation may be an
        effective form of emotion regulation in children\nbecause it is easily accessible
        and more easily done across a variety of\nsettings in which toys may not be
        available, for e.g., settings\nrequiring a \u201cclean\u201d environment (e.g.,
        surgical prep). Further,\nneuroimaging studies in adults suggest that meditation
        techniques are\nneurobiologically distinct from other forms of emotion regulation,
        such\nas distraction, that rely on prefrontal control mechanisms, which are\nunderdeveloped
        in youth. Rather, meditation techniques may not rely on\n\u201ctop-down\u201d
        prefrontal control and may therefore be utilized across the\nlifespan. Procedure:
        We examined neural activation in children with\ncancer, who experience significant
        distress. During neuroimaging,\nchildren viewed distress-inducing video clips
        while using martial\narts-based meditation (focused attention, mindful acceptance)
        or\nnon-meditation (distraction) emotion regulation techniques. In a third\ncondition
        (control), participants passively viewed the video clip.\nResults: We found
        that meditation techniques were associated with lower\nactivation in default
        mode network (DMN) regions, including the medial\nfrontal cortex, precuneus,
        and posterior cingulate cortex, compared to\nthe control condition. Additionally,
        we found evidence that meditation\ntechniques may be more effective for modulating
        DMN activity than\ndistraction. There were no differences in self-reported
        distress ratings\nbetween conditions. Conclusion: Together, these findings
        suggest that\nmartial arts-based meditation modulates negative self-referential\nprocessing
        associated with the DMN, and may have implications for the\nmanagement of
        pediatric pain and negative emotion.<\/jats:p>","DOI":"10.22541\/au.164340169.91748604\/v1","type":"posted-content","created":{"date-parts":[[2022,1,28]],"date-time":"2022-01-28T15:28:16Z","timestamp":1643383696000},"source":"Crossref","is-referenced-by-count":0,"title":["Meditation
