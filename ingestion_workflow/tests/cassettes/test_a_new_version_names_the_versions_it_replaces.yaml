        Research Ltd","license":[{"start":{"date-parts":[[2024,4,10]],"date-time":"2024-04-10T00:00:00Z","timestamp":1712707200000},"content-version":"tdm","delay-in-days":0,"URL":"http:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":["f1000research.com"],"crossmark-restriction":false},"short-container-title":["F1000Res"],"abstract":"<ns3:p>\n                    Background
        Stroke is ischemia and neurological dysfunction caused by acute brain circulation
        loss. It causes acute localized neurological abnormalities such as weakness,
        sensory deficit, or language issues that require long-term treatment. These
        deficiencies harm the patient and their family psychologically, socially,
        and economically. Thus, combination treatment can rapidly rehabilitate such
        patients. Detoxification methods like Ayurvedic medicated enema help stroke
        pathophysiology. Physical modalities in physiotherapy have been shown to facilitate
        normal movement and function on the stroke patient\u2019s affected side, increasing
        independence with everyday duties. A stroke patient may benefit from\n                    <ns3:italic>Dashmoola
        Niruha Basti<\/ns3:italic>\n                    , Function Electrical Stimulation
        (FES), and Motor Relearning Programme (MRP). Aim &amp; Objectives This study
        compares the adjuvant role of\n                    <ns3:italic>Dashmoola Basti<\/ns3:italic>\n                    with
        MRP and FES in stroke recovery. The main goals of this study are to assess
        and compare the adjuvant role of\n                    <ns3:italic>Dashmoola
        Basti<\/ns3:italic>\n                    with standard control over sensorimotor
        function of lower extremities, static and dynamic balance in stroke patients;
        gait parameters; resistance experienced during passive range of motion; quality
        of life of patients; Barthel Index; Modified Ashworth Scale; and Fuglmeyer
        assessment, Single Limb Stance Test, Functional Reach Test. Methods A total
        of 40 patients will be enrolled and divided randomly into two equal groups.
        In Group A (control), standard treatment (modern + physiotherapy) will be
        prescribed for one month. In Group B (interventional group),\n                    <ns3:italic>Dashmoola
        Basti<\/ns3:italic>\n                    will be added to the aforementioned
        standard treatment for one month. Expected results Improvement in Fuglmeyer
        assessment, Single Limb Stance Test, Functional Reach Test, quality of Life
        of Patients, Barthel Index, Modified Ashworth scale, and National Institute
        of Health (NIH) stroke-scale-score will be observed and recorded. Conclusions
        Results and conclusions will be derived according to the data collected in
        case record form and assessment sheets filled at baseline and follow-up visits.
        Trial registration CTRI\/2021\/10\/037445 dated 21.10.2021.\n                  <\/ns3:p>","DOI":"10.12688\/f1000research.141553.3","type":"journal-article","created":{"date-parts":[[2024,4,10]],"date-time":"2024-04-10T13:25:05Z","timestamp":1712755505000},"page":"1589","update-policy":"https:\/\/doi.org\/10.12688\/f1000research.crossmark-policy","source":"Crossref","is-referenced-by-count":0,"title":["Efficacy
