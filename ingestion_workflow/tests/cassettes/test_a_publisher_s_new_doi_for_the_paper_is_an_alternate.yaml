    body:
      string: "{\"type\":\"article-journal\",\"language\":\"eng\",\"author\":[{\"literal\":\"Malcolm
        Wells\"},{\"literal\":\"Rebekah Jacques\"},{\"literal\":\"Manuel Montero Odasso\"}],\"issued\":{\"date-parts\":[[2011,8]]},\"abstract\":\"An
        84 year old woman with history of moderate Alzheimer\u2019s disease, depression,
        and an anxiety disorder presented to our emergency room at Victoria Hospital,
        London, Ontario in an \u2018unresponsive\u2019 state. The patient was akinetic
        with mutism, and clonic perseveration induced in the upper limbs was evident
        while she was examined. Heart attack, massive stroke, or intracranial bleed
        were ruled out, and an electroencephalogram showed no epileptiform activity.
        Despite a normal CT, a magnetic resonance scan was ordered and showed bilateral
        acute paramedian thalamogeniculate infarction arising from occlusion of the
        artery of Percheron. Bilateral thalamic infarcts can cause sudden onset of
        akinetic mutism with clonic perseveration, which may be confused with coma
        and seizures due to life threatening conditions such as a massive stroke.
        Thorough clinical assessment and early use of MRI scanning will assist physicians
        with a more accurate diagnosis of older adults with this kind of presentation.\",\"container-title\":\"Aging
        Clinical and Experimental Research\",\"DOI\":\"10.3275\\/7271\",\"issue\":\"4\",\"publisher\":\"Editrice
        Kurtis srl\",\"publisher-place\":\"IT\",\"title\":\"Thalamic infarct presenting
        as catastrophic life-threatening event in an older adult\",\"URL\":\"https:\\/\\/doi.org\\/10.3275\\/7271\",\"volume\":\"23\"}"
