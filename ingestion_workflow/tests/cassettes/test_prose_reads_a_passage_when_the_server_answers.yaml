# Composed: the answer is the shape vLLM's chat completions endpoint returns for the
# prose request, with the empty analyses list.
interactions:
- request:
    body: null
    headers:
      accept:
      - application/json
      content-type:
      - application/json
      host:
      - prose.test
    method: POST
    uri: http://prose.test/v1/chat/completions
  response:
    body:
      string: '{"id": "chatcmpl-1", "object": "chat.completion", "created": 0, "model": "nu-prose-v2", "choices": [{"index": 0, "finish_reason": "stop", "message": {"role": "assistant", "content": "{\"space\": \"MNI\", \"analyses\": []}"}}], "usage": {"prompt_tokens": 10, "completion_tokens": 8, "total_tokens": 18}}'
    headers:
      content-type:
      - application/json
    status:
      code: 200
      message: OK
version: 1
