        xmlns:xlink=\"http://www.w3.org/1999/xlink\" content-type=\"pdf\" xlink:href=\"zns00923001600.pdf\"/><abstract><p>Individual
        differences in delay discounting\u2014how much we discount future compared
        to immediate rewards\u2014are associated with general life outcomes, psychopathology,
        and obesity. Here, we use machine learning on fMRI activity during an intertemporal
        choice task to develop a functional brain marker of these individual differences
        in human adults. Training and cross-validating the marker in one dataset (Study
        1, <italic toggle=\"yes\">N</italic>\u2009=\u2009110 male adults) resulted
        in a significant prediction\u2013outcome correlation (<italic toggle=\"yes\">r</italic>\u2009=\u20090.49),
        generalized to predict individual differences in a completely independent
        dataset (Study 2: <italic toggle=\"yes\">N</italic>\u2009=\u2009145 male and
        female adults, <italic toggle=\"yes\">r</italic>\u2009=\u20090.45), and predicted
        discounting several weeks later. Out-of-sample responses of the functional
        brain marker, but not discounting behavior itself, differed significantly
        between overweight and lean individuals in both studies, and predicted fasting-state
        blood levels of insulin, c-peptide, and leptin in Study 1. Significant predictive
        weights of the marker were found in cingulate, insula, and frontoparietal
        areas, among others, suggesting an interplay among regions associated with
        valuation, conflict processing, and cognitive control. This new functional
        brain marker is a step toward a generalizable brain model of individual differences
        in delay discounting. Future studies can evaluate it as a potential transdiagnostic
        marker of altered decision-making in different clinical and developmental
        populations.</p><p><bold>SIGNIFICANCE STATEMENT</bold> People differ substantially
        in how much they prefer smaller sooner rewards or larger later rewards such
        as spending money now versus saving it for retirement. These individual differences
        are generally stable over time and have been related to differences in mental
        and bodily health. What is their neurobiological basis? We applied machine
        learning to brain-imaging data to identify a novel brain activity pattern
        that accurately predicts how much people prefer sooner versus later rewards,
        and which can be used as a new brain-based measure of intertemporal decision-making
        in future studies. The resulting functional brain marker also predicts overweight
        and metabolism-related blood markers, providing new insight into the possible
        links between metabolism and the cognitive and brain processes involved in
        intertemporal decision-making.</p></abstract><kwd-group><kwd>brain model</kwd><kwd>decision-making</kwd><kwd>delay
