  response:
    body:
      string: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"institution":[{"name":"bioRxiv"}],"indexed":{"date-parts":[[2026,7,30]],"date-time":"2026-07-30T16:52:18Z","timestamp":1785430338030,"version":"3.56.0"},"posted":{"date-parts":[[2025,5,2]]},"group-title":"Neuroscience","reference-count":147,"publisher":"openRxiv","license":[{"start":{"date-parts":[[2025,5,2]],"date-time":"2025-05-02T00:00:00Z","timestamp":1746144000000},"content-version":"vor","delay-in-days":0,"URL":"https:\/\/www.biorxiv.org\/about\/FAQ#license"}],"funder":[{"id":[{"id":"https:\/\/ror.org\/022swbj46","id-type":"ROR","asserted-by":"publisher"}]}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"accepted":{"date-parts":[[2025,11,3]]},"abstract":"<jats:title>Abstract<\/jats:title>\n                <jats:p>Age-related
        decline underlies cognitive functions such as sensorimotor control, executive
        functioning, memory, and language production (LP), whereas language comprehension
        (LC) tends to remain intact or improve across healthy adult lifespan. This
        preservation likely stems from structural and functional integrity within
        core language network (cLAN) regions. To investigate this hypothesis, we analyzed
        the relationships among brain\u2019s resting-state functional connectivity
        (FC), structural connectivity (SC), and language behaviour (LC and LP) using
        a cross-sectional cohort of healthy adults (N = 652; M\/F = 322\/330; aged
        18\u201388) from the Cambridge Centre for Ageing and Neuroscience (Cam-CAN)
        dataset. Six cognitive tasks assessing LC and LP were employed, with neuroimaging
        measures focused on region-specific connections within the cLAN. Using generalized
        additive mixed models (GAMMs), complex brain-behaviour interactions were identified.
        Behavioral analyses revealed established age-related dichotomy, LC abilities
        in vocabulary and proverb comprehension improved and in syntactic and semantic
        comprehension remained stable, whereas LP tasks, e.g., verbal fluency, picture
        priming, and tip of tongue exhibited significant decline across the lifespan.
        SC exhibited decline in both intra-and inter-hemispheric fronto-temporal and
        frontal lobe connections, contrasted by preserved or enhanced temporal lobe
        connectivity, supporting a pattern of frontal vulnerability concomitant with
        temporal resilience. Age-related FC patterns demonstrated overall preservation,
        reflecting compensatory mechanisms to sustain functional integrity despite
        structural degradation. GAMM analyses revealed complex relationships between
        brain connectivity and language performance across age. Thus, integrating
        knowledge of brain structure, function, and language abilities, we identified
        the brain network mechanisms associated with dichotomous language behavior
        along lifespan.<\/jats:p>\n                <jats:sec>\n                  <jats:title>Significance<\/jats:title>\n                  <jats:p>Understanding
        age-related changes in language abilities is vital for early detection of
        cognitive decline and intervention development. This study reveals heterogeneous
        language aging trajectories: language production often declines, while comprehension
        remains stable or improves. Notably, comprehension tasks with high executive
        and working memory demands also show resilience, suggesting compensatory mechanisms
        beyond crystallized knowledge. Using multimodal neuroimaging in a large adult
        lifespan cohort, we link behavioral patterns to distinct network dynamics
        within the core language system. We uncover relative vulnerability in frontal
        brain regions, with pronounced structural decline in fronto-temporal pathways,
        contrasted by resilience in temporal connectivity, which is preserved or strengthened.
        These findings highlight regionally specific vulnerabilities and compensatory
        functional adaptations, refining current models and providing a framework
        to guide research promoting healthy cognitive aging.<\/jats:p>\n                <\/jats:sec>","DOI":"10.1101\/2025.04.29.651293","type":"posted-content","created":{"date-parts":[[2025,5,6]],"date-time":"2025-05-06T07:35:22Z","timestamp":1746516922000},"source":"Crossref","is-referenced-by-count":0,"title":["Frontal
        Vulnerability vs. Temporal Resilience within the core Language Network: Neuro-compensatory
        mechanisms underline differential language aging trajectories"],"prefix":"10.64898","author":[{"ORCID":"https:\/\/orcid.org\/0009-0008-9892-7459","authenticated-orcid":false,"given":"Partika","family":"Jain","sequence":"first","affiliation":[],"role":[{"vocabulary":"crossref","role":"author"}]},{"ORCID":"https:\/\/orcid.org\/0009-0008-1303-2892","authenticated-orcid":false,"given":"Azman","family":"Akhter","sequence":"additional","affiliation":[],"role":[{"vocabulary":"crossref","role":"author"}]},{"ORCID":"https:\/\/orcid.org\/0000-0002-3725-0463","authenticated-orcid":false,"given":"Arpan","family":"Banerjee","sequence":"additional","affiliation":[],"role":[{"vocabulary":"crossref","role":"author"}]}],"member":"54368","reference":[{"key":"2025110509250687000_2025.04.29.651293v2.1","doi-asserted-by":"publisher","DOI":"10.1016\/j.neuroimage.2016.06.058"},{"key":"2025110509250687000_2025.04.29.651293v2.2","doi-asserted-by":"publisher","DOI":"10.1006\/nimg.2001.0746"},{"key":"2025110509250687000_2025.04.29.651293v2.3","doi-asserted-by":"publisher","DOI":"10.1016\/S1053-8119(03)00336-7"},{"key":"2025110509250687000_2025.04.29.651293v2.4","doi-asserted-by":"publisher","DOI":"10.1016\/j.neuroimage.2013.07.018"},{"key":"2025110509250687000_2025.04.29.651293v2.5","doi-asserted-by":"publisher","DOI":"10.1016\/j.neuroimage.2005.02.018"},{"key":"2025110509250687000_2025.04.29.651293v2.6","doi-asserted-by":"publisher","DOI":"10.1007\/s11357-021-00367-5"},{"key":"2025110509250687000_2025.04.29.651293v2.7","doi-asserted-by":"publisher","DOI":"10.1016\/j.neuroimage.2010.02.036"},{"key":"2025110509250687000_2025.04.29.651293v2.8","doi-asserted-by":"publisher","DOI":"10.18637\/jss.v067.i01"},{"key":"2025110509250687000_2025.04.29.651293v2.9","doi-asserted-by":"publisher","DOI":"10.1016\/j.neuroimage.2007.04.042"},{"key":"2025110509250687000_2025.04.29.651293v2.10","doi-asserted-by":"publisher","DOI":"10.1111\/j.2517-6161.1995.tb02031.x"},{"key":"2025110509250687000_2025.04.