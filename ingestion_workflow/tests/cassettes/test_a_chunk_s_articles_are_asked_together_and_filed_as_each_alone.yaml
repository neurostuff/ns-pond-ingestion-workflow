  response:
    body:
      string: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"institution":[{"name":"bioRxiv"}],"indexed":{"date-parts":[[2026,1,15]],"date-time":"2026-01-15T15:35:50Z","timestamp":1768491350173,"version":"3.49.0"},"posted":{"date-parts":[[2020,5,8]]},"group-title":"Genetics","reference-count":68,"publisher":"openRxiv","license":[{"start":{"date-parts":[[2020,5,8]],"date-time":"2020-05-08T00:00:00Z","timestamp":1588896000000},"content-version":"vor","delay-in-days":0,"URL":"https:\/\/www.biorxiv.org\/about\/FAQ#license"}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"accepted":{"date-parts":[[2020,5,7]]},"abstract":"<jats:title>Abstract<\/jats:title>\n                <jats:p>\n                  Associations
        between altered DNA methylation of the serotonin transporter (5-HTT)-encoding
        gene\n                  <jats:italic>SLC6A4<\/jats:italic>\n                  and
        early life adversity, mood and anxiety disorders, and amygdala reactivity
        have been reported. However, few studies have examined epigenetic alterations
        of\n                  <jats:italic>SLC6A4<\/jats:italic>\n                  in
        schizophrenia (SZ). We examined CpG sites of\n                  <jats:italic>SLC6A4<\/jats:italic>\n                  ,
        whose DNA methylation levels have been reported to be altered in bipolar disorder,
        using three independent cohorts of patients with SZ and age-matched controls.
        We found significant hypermethylation of a CpG site in\n                  <jats:italic>SLC6A4<\/jats:italic>\n                  in
        male patients with SZ in all three cohorts. We showed that chronic administration
        of risperidone did not affect the DNA methylation status at this CpG site
        using common marmosets, and that\n                  <jats:italic>in vitro<\/jats:italic>\n                  DNA
        methylation at this CpG site diminished the promoter activity of\n                  <jats:italic>SLC6A4<\/jats:italic>\n                  .
        We then genotyped the 5-HTT-linked polymorphic region (5-HTTLPR) and investigated
        the relationship among 5-HTTLPR, DNA methylation, and amygdala volume using
        brain imaging data. We found that patients harboring low-activity 5-HTTLPR
        alleles showed hypermethylation and they showed a negative correlation between
        DNA methylation levels and left amygdala volumes. These results suggest that
        hypermethylation of the CpG site in\n                  <jats:italic>SLC6A4<\/jats:italic>\n                  is
        involved in the pathophysiology of SZ, especially in male patients harboring
        low-activity 5-HTTLPR alleles.\n                <\/jats:p>","DOI":"10.1101\/2020.05.06.058792","type":"posted-content","created":{"date-parts":[[2020,5,8]],"date-time":"2020-05-08T08:36:23Z","timestamp":1588926983000},"source":"Crossref","is-referenced-by-count":1,"title":["Promoter
        activity-based case-control association study on\n                  <i>SLC6A4<\/i>\n                  highlighting
