    body:
      string: "{\"data\":{\"id\":\"4b9v8\",\"type\":\"nodes\",\"attributes\":{\"title\":\"Neural
        Mechanisms of Cognitive Conflict:  Processing COVID-19 Vaccine Misinformation\",\"description\":\"The
        rapid spread of misinformation during the COVID-19 pandemic has raised important
        questions about how individuals process misinformation, particularly in contexts
        where prior beliefs are already strongly held. This study used functional
        magnetic resonance imaging (fMRI) to examine the neural mechanisms involved
        in evaluating COVID-19 vaccine misinformation and factual information, with
        a focus on how prior beliefs shape these processes. \\nVaccine-adherent participants
        (N=39) were exposed to a series of vaccine-related statements\u2014both accurate
        and false\u2014and indicated their level of agreement during scanning. Contrary
        to our hypotheses, we did not observe significant involvement of emotional
        processing regions such as the amygdala or precuneus when participants were
        exposed to vaccine-related misinformation that conflicted with their prior-held
        beliefs. However, when participants made belief-incongruent responses (i.e.,
        endorsing misinformation or rejecting accurate information) we observed increased
        activation in the left dorsolateral prefrontal cortex (DLPFC), dorsomedial
        prefrontal cortex (DMPFC), intraparietal sulcus (IPS), and middle frontal
        gyrus (MFG)\u2014regions implicated in decision-making, moral reasoning, memory
        integration, and cognitive control. Our findings suggest that resolving conflicts
        between incoming information and prior beliefs engages effortful decision-making
        systems that battle uncertainty and conflict. Due to recruitment limitations,
        the present analysis was restricted to vaccine-adherent individuals. Future
        research should explore whether vaccine-resistant individuals show similar
        or distinct neural responses which may provide more insight into the persistence
        of misinformation in the context of negative prior beliefs. \\n\",\"category\":\"project\",\"custom_citation\":null,\"date_created\":\"2025-07-03T22:36:03.011677\",\"date_modified\":\"2026-01-03T23:20:06.803523\",\"registration\":false,\"preprint\":false,\"fork\":false,\"collection\":false,\"tags\":[\"decision-making\",\"fMRI\",\"misinformation\",\"prior
        beliefs\",\"semantic memory\",\"vaccine hesitancy\"],\"access_requests_enabled\":true,\"node_license\":null,\"analytics_key\":\"\",\"current_user_can_comment\":false,\"current_user_permissions\":[\"read\"],\"current_user_is_contributor\":false,\"current_user_is_contributor_or_group_member\":false,\"wiki_enabled\":true,\"public\":true,\"subjects\":[]},\"relationships\":{\"children\":{\"links\":{\"related\":{\"href\":\"https://api.osf.io/v2/nodes/4b9v8/children/\",\"meta\":{}}}},\"collected_in\":{\"links\":{\"related\":{\"href\":\"https://api.osf.io/v2/nodes/4b9v8/collections/\",\"meta\":{}}}},\"comments\":{\"links\":{\"related\":{\"href\":\"https://api.osf.io/v2/nodes/4b9v8/comments/?filter%5Btarget%5D=4b9v8\",\"meta\":{}}}},\"contributors\":{\"links\":{\"related\":{\"href\":\"https://api.osf.io/v2/nodes/4b9v8/contributors/\",\"meta\":{}}}},\"bibliographic_contributors\":{\"links\":{\"related\":{\"href\":\"https://api.osf.io/v2/nodes/4b9v8/bibliographic_contributors/\",\"meta\":{}}}},\"implicit_contributors\":{\"links\":{\"related\":{\"href\":\"https://api.osf.io/v2/nodes/4b9v8/implicit_contributors/\",\"meta\":{}}}},\"files\":{\"links\":{\"related\":{\"href\":\"https://api.osf.io/v2/nodes/4b9v8/files/\",\"meta\":{}}}},\"settings\":{\"links\":{\"related\":{\"href\":\"https://api.osf.io/v2/nodes/4b9v8/settings/\",\"meta\":{}}},\"data\":{\"id\":\"4b9v8\",\"type\":\"node-setting\"}},\"wikis\":{\"links\":{\"related\":{\"href\":\"https://api.osf.io/v2/nodes/4b9v8/wikis/\",\"meta\":{}}}},\"forks\":{\"links\":{\"related\":{\"href\":\"https://api.osf.io/v2/nodes/4b9v8/forks/\",\"meta\":{}}}},\"node_links\":{\"links\":{\"related\":{\"href\":\"https://api.osf.io/v2/nodes/4b9v8/node_links/\",\"meta\":{}}}},\"linked_by_nodes\":{\"links\":{\"related\":{\"href\":\"https://api.osf.io/v2/nodes/4b9v8/linked_by_nodes/\",\"meta\":{}}}},\"linked_by_registrations\":{\"links\":{\"related\":{\"href\":\"https://api.osf.io/v2/nodes/4b9v8/linked_by_registrations/\",\"meta\":{}}}},\"id