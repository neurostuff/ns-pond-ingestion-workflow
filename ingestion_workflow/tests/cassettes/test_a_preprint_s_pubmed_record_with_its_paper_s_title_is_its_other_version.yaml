  response:
    body:
      string: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"institution":[{"name":"bioRxiv"}],"indexed":{"date-parts":[[2026,1,15]],"date-time":"2026-01-15T19:37:06Z","timestamp":1768505826069,"version":"3.49.0"},"posted":{"date-parts":[[2023,2,2]]},"group-title":"Neuroscience","reference-count":89,"publisher":"openRxiv","content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"accepted":{"date-parts":[[2023,11,22]]},"abstract":"<jats:title>Abstract<\/jats:title>\n                <jats:p>How
        does a train of TMS pulses modify neural activity in humans? Despite adoption
        of repetitive TMS (rTMS) for the treatment of neuropsychiatric disorders,
        we still do not understand how rTMS changes the human brain. This limited
        understanding stems in part from a lack of methods for noninvasively measuring
        the neural effects of a single TMS train \u2014 a fundamental building block
        of treatment \u2014 as well as the cumulative effects of consecutive TMS trains.
        Gaining this understanding would provide foundational knowledge to guide the
        next generation of treatments. Here, to overcome this limitation, we developed
        methods to noninvasively measure causal and acute changes in cortical excitability
        and evaluated this neural response to single and sequential TMS trains. In
        16 healthy adults, standard 10 Hz trains were applied to the dorsolateral
        prefrontal cortex (dlPFC) in a randomized, sham-controlled, event-related
        design and changes were assessed based on the TMS-evoked potential (TEP),
        a measure of cortical excitability. We hypothesized that single TMS trains
        would induce changes in the local TEP amplitude and that those changes would
        accumulate across sequential trains, but primary analyses did not indicate
        evidence in support of either of these hypotheses. Exploratory analyses demonstrated
        non-local neural changes in sensor and source space and local neural changes
        in phase and source space. Together these results suggest that single and
        sequential TMS trains may not be sufficient to modulate local cortical excitability
        indexed by typical TEP amplitude metrics but may cause neural changes that
        can be detected outside the stimulation area or using phase or source space
        metrics. This work should be contextualized as methods development for the
        monitoring of transient noninvasive neural changes during rTMS and contributes
        to a growing understanding of the neural effects of rTMS.<\/jats:p>","DOI":"10.1101\/2023.01.30.526374","type":"posted-content","created":{"date-parts":[[2023,2,2]],"date-time":"2023-02-02T15:10:23Z","timestamp":1675350623000},"source":"Crossref","is-referenced-by-count":3,"title":["Neural
        effects of TMS trains on the human prefrontal cortex"],"prefix":"10.64898","author":[{"ORCID":"https:\/\/orcid.org\/0000-0002-7487-8946","authenticated-orcid":false,"given":"Jessica
