        Rep"],"abstract":"<jats:title>Abstract<\/jats:title>\n                  <jats:p>How
        does a train of TMS pulses modify neural activity in humans? Despite adoption
        of repetitive TMS (rTMS) for the treatment of neuropsychiatric disorders,
        we still do not understand how rTMS changes the human brain. This limited
        understanding stems in part from a lack of methods for noninvasively measuring
        the neural effects of a single TMS train\u2014a fundamental building block
        of treatment\u2014as well as the cumulative effects of consecutive TMS trains.
        Gaining this understanding would provide foundational knowledge to guide the
        next generation of treatments. Here, to overcome this limitation, we developed
        methods to noninvasively measure causal and acute changes in cortical excitability
        and evaluated this neural response to single and sequential TMS trains. In
        16 healthy adults, standard 10\u00a0Hz trains were applied to the dorsolateral
        prefrontal cortex in a randomized, sham-controlled, event-related design and
        changes were assessed based on the TMS-evoked potential (TEP), a measure of
        cortical excitability. We hypothesized that single TMS trains would induce
        changes in the local TEP amplitude and that those changes would accumulate
        across sequential trains, but primary analyses did not indicate evidence in
        support of either of these hypotheses. Exploratory analyses demonstrated non-local
        neural changes in sensor and source space and local neural changes in phase
        and source space. Together these results suggest that single and sequential
        TMS trains may not be sufficient to modulate local cortical excitability indexed
        by typical TEP amplitude metrics but may cause neural changes that can be
        detected outside the stimulation area or using phase or source space metrics.
        This work should be contextualized as methods development for the monitoring
        of transient noninvasive neural changes during rTMS and contributes to a growing
        understanding of the neural effects of rTMS.<\/jats:p>","DOI":"10.1038\/s41598-023-49250-7","type":"journal-article","created":{"date-parts":[[2023,12,20]],"date-time":"2023-12-20T02:02:26Z","timestamp":1703037746000},"update-policy":"https:\/\/doi.org\/10.1007\/springer_crossmark_policy","source":"Crossref","is-referenced-by-count":15,"title":["Neural
