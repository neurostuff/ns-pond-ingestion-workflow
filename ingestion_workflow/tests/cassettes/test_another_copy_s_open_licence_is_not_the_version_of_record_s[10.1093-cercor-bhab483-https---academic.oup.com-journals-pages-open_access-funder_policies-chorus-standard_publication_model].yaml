      string: '[{"paperId": "dd621ed5b1a1de3455dcf1bca2a1d1b003fa5589", "title": "Same
        Action, Different Meaning: Neural Substrates of Action Semantic Meaning.",
        "venue": "Cerebral Cortex", "year": 2022, "isOpenAccess": true, "openAccessPdf":
        {"url": "https://www.biorxiv.org/content/biorxiv/early/2021/04/18/2021.04.18.440307.full.pdf",
        "status": "GREEN", "license": "CCBYNCND", "disclaimer": "Notice: Paper or
        abstract available at https://api.unpaywall.org/v2/10.1093/cercor/bhab483?email=<INSERT_YOUR_EMAIL>
        or https://doi.org/10.1093/cercor/bhab483, which is subject to the license
        by the author or copyright owner provided with this content. Please go to
        the source to verify the license and copyright information for your use."},
        "publicationDate": "2022-01-13", "authors": [{"authorId": "2197221557", "name":
        "Shahar Aberbach-Goodman"}, {"authorId": "40960243", "name": "Batel Buaron"},
        {"authorId": "2106897", "name": "L. Mudrik"}, {"authorId": "3022855", "name":
        "R. Mukamel"}], "abstract": "Voluntary actions are shaped by desired goals
        and internal intentions. Multiple factors, including the planning of subsequent
        actions and the expectation of sensory outcome, were shown to modulate kinetics
        and neural activity patterns associated with similar goal-directed actions.
        Notably, in many real-world tasks, actions can also vary across the semantic
        meaning they convey, although little is known about how semantic meaning modulates
        associated neurobehavioral measures. Here, we examined how behavioral and
        functional magnetic resonance imaging measures are modulated when subjects
        execute similar actions (button presses) for two different semantic meanings-to
        answer \"yes\" or \"no\" to a binary question. Our findings reveal that, when
        subjects answer using their right hand, the two semantic meanings are differentiated
        based on voxel patterns in the frontoparietal cortex and lateral-occipital
        complex bilaterally. When using their left hand, similar regions were found,
        albeit only with a more liberal threshold. Although subjects were faster to
        answer \"yes\" versus \"no\" when using their right hand, the neural differences
        cannot be explained by these kinetic differences. To the best of our knowledge,
        this is the first evidence showing that semantic meaning is embedded in the
        neural representation of actions, independent of alternative modulating factors
        such as kinetic and sensory features."}]

        '
