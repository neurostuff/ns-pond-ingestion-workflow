    body:
      string: '[{"paperId": "4452926671dde445590cf3bdb18d2ee88d4bc8af", "title": "A
        functional dissociation of conflict processing within anterior cingulate cortex",
        "venue": "Human Brain Mapping", "year": 2008, "isOpenAccess": true, "openAccessPdf":
        {"url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/hbm.21020?download=true",
        "status": "BRONZE", "license": "CCBY", "disclaimer": "Notice: Paper or abstract
        available at https://api.unpaywall.org/v2/10.1002/hbm.21020?email=<INSERT_YOUR_EMAIL>
        or https://doi.org/10.1002/hbm.21020, which is subject to the license by the
        author or copyright owner provided with this content. Please go to the source
        to verify the license and copyright information for your use."}, "publicationDate":
        "2008-11-12", "authors": [{"authorId": "2441958", "name": "Chobok Kim"}, {"authorId":
        "2581629", "name": "James K. Kroger"}, {"authorId": "3141034", "name": "Jeounghoon
        Kim"}], "abstract": "Goal\u2010directed behavior requires cognitive control
        to regulate the occurrence of conflict. The dorsal anterior cingulate cortex
        (dACC) has been suggested in detecting response conflict during various conflict
        tasks. Recent findings, however, have indicated not only that two distinct
        subregions of dACC are involved in conflict processing but also that the conflict
        occurs at both perceptual and response levels. In this study, we sought to
        examine whether perceptual and response conflicts are functionally dissociated
        in dACC. Thirteen healthy subjects performed a version of the Stroop task
        during functional magnetic resonance imaging (fMRI) scanning. We identified
        a functional dissociation of the caudal dACC (cdACC) and the rostral dACC
        (rdACC) in their responses to different sources of conflict. The cdACC was
        selectively engaged in perceptual conflict whereas the rdACC was more active
        in response conflict. Further, the dorsolateral prefrontal cortex (DLPFC)
        was coactivated not with cdACC but with rdACC. We suggest that cdACC plays
        an important role in regulative processing of perceptual conflict whereas
        rdACC is involved in detecting response conflict. Hum Brain Mapp, 2011. \u00a9
        2010 Wiley\u2010Liss, Inc."}]

        '
