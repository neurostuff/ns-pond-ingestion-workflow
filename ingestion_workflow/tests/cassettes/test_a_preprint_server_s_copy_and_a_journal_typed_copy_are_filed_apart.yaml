    body:
      string: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"indexed":{"date-parts":[[2025,11,16]],"date-time":"2025-11-16T16:12:37Z","timestamp":1763309557011,"version":"3.45.0"},"posted":{"date-parts":[[2020,10,27]]},"group-title":"SocArXiv","reference-count":0,"publisher":"Center
        for Open Science","license":[{"start":{"date-parts":[[2020,10,27]],"date-time":"2020-10-27T00:00:00Z","timestamp":1603756800000},"content-version":"unspecified","delay-in-days":0,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/legalcode"}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"abstract":"<p>**Background.**This
        study aimed to determine whether crime patterns in Mexico City changed due
        to the COVID-19 pandemic, and to test whether any changes observed were associated
        with the disruption of routine activities.**Method.**The first objective was
        assessed by comparing the observed incidence of crime after the COVID-19 pandemic
        was detected in the country with that expected based on ARIMA forecasts based
        on the pre-pandemic trends. The second objective was assessed by examining
        the association between crime incidence and the number of passengers on public
        transport using regressions with ARIMA errors. **Results.**Results indicated
        that most crime categories decreased significantly after the pandemic was
        detected in the country or after a national lockdown was instituted. Furthermore,
        the study found that most of the declines observed were associated with the
        reductions seen in public transport passenger numbers. However, the declines
        predicted by the changes in mobility were not always consistent nor as large
        as those observed. **Conclusion.**The findings contribute to the global evaluation
        of the effects of COVID-19 on crime and propose a robust method to explictily
        test whether the changes observed are associated with changes in routine activities.<\/p>","DOI":"10.31235\/osf.io\/3jfwu","type":"posted-content","created":{"date-parts":[[2020,10,27]],"date-time":"2020-10-27T08:11:26Z","timestamp":1603786286000},"source":"Crossref","is-referenced-by-count":4,"title":["Crime
        and COVID-19: Effect of changes in routine activities in Mexico City"],"prefix":"10.31235","author":[{"ORCID":"https:\/\/orcid.org\/0000-0001-7513-6904","authenticated-orcid":true,"given":"Patricio
        Rodrigo","family":"Est\u00e9vez-Soto","sequence":"first","affiliation":[],"role":[{"role":"author","vocabulary":"crossref"}]}],"member":"15934","container-title":[],"original-title":[],"deposited":{"date-parts":[[2025,11,16]],"date-time":"2025-11-16T16:09:06Z","timestamp":1763309346000},"score":1,"resource":{"primary":{"URL":"https:\/\/osf.io\/3jfwu_v1"}},"subtitle":[],"short-title":[],"issued":{"date-parts":[[2020,10,27]]},"references-count":0,"URL":"https:\/\/doi.org\/10.31235\/osf.io\/3jfwu","relation":{"is-preprint-of":[{"id-type":"doi","id":"10.1186\/s40163-021-00151-y","asserted-by":"subject"}]},"subject":[],"published":{"date-parts":[[2020,10,27]]},"subtype":"preprint"}}'
