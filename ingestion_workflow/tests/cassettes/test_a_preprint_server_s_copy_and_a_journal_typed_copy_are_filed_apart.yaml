        Sci"],"published-print":{"date-parts":[[2021,12]]},"abstract":"<jats:title>Abstract<\/jats:title>\n                  <jats:sec>\n                    <jats:title>Background<\/jats:title>\n                    <jats:p>This
        study aimed to determine whether crime patterns in Mexico City changed due
        to the COVID-19 pandemic, and to test whether any changes observed were associated
        with the disruption of routine activities, as measured by changes in public
        transport passenger numbers.<\/jats:p>\n                  <\/jats:sec>\n                  <jats:sec>\n                    <jats:title>Method<\/jats:title>\n                    <jats:p>The
        first objective was assessed by comparing the observed incidence of crime
        after the COVID-19 pandemic was detected in the country with that expected
        based on ARIMA forecasts based on the pre-pandemic trends. The second objective
        was assessed by examining the association between crime incidence and the
        number of passengers on public transport using regressions with ARIMA errors.<\/jats:p>\n                  <\/jats:sec>\n                  <jats:sec>\n                    <jats:title>Results<\/jats:title>\n                    <jats:p>Results
        indicated that most crime categories decreased significantly after the pandemic
        was detected in the country or after a national lockdown was instituted. Furthermore,
        the study found that some of the declines observed were associated with the
        reductions seen in public transport passenger numbers. However, the findings
        suggested that the changes in mobility explain part of the declines observed,
        with important variations per crime type.<\/jats:p>\n                  <\/jats:sec>\n                  <jats:sec>\n                    <jats:title>Conclusion<\/jats:title>\n                    <jats:p>The
        findings contribute to the global evaluation of the effects of COVID-19 on
        crime and propose a robust method to explicitly test whether the changes observed
        are associated with changes in routine activities.<\/jats:p>\n                  <\/jats:sec>","DOI":"10.1186\/s40163-021-00151-y","type":"journal-article","created":{"date-parts":[[2021,6,30]],"date-time":"2021-06-30T05:03:27Z","timestamp":1625029407000},"update-policy":"https:\/\/doi.org\/10.1007\/springer_crossmark_policy","source":"Crossref","is-referenced-by-count":64,"title":["Crime
