        Neurosci."],"accepted":{"date-parts":[[2025,11,1]]},"published-print":{"date-parts":[[2026,1,14]]},"abstract":"<jats:p>\n                    Age-related
        decline underlies cognitive functions such as sensorimotor control, executive
        functioning, memory, and language production (LP), whereas language comprehension
        (LC) tends to remain intact or improve across healthy adult lifespan. This
        preservation likely stems from structural and functional integrity within
        core language network (cLAN) regions. To investigate this hypothesis, we analyzed
        the relationships among brain\u2019s resting-state functional connectivity
        (FC), structural connectivity (SC), and language behavior (LC and LP) using
        a cross-sectional cohort of healthy adults (\n                    <jats:italic>N<\/jats:italic>\n                    \u2009=\u2009652;
        M\/F\u2009=\u2009322\/330; aged 18\u201388) from the Cambridge Centre for
        Ageing and Neuroscience (CamCAN) dataset. Six cognitive tasks assessing LC
        and LP were employed, with neuroimaging measures focused on region-specific
        connections within the cLAN. Using generalized additive mixed models (GAMMs),
        complex brain-behavior interactions were identified. Behavioral analyses revealed
        established age-related dichotomy, LC abilities in vocabulary and proverb
        comprehension improved, and in syntactic and semantic comprehension remained
        stable, whereas LP tasks, e.g., verbal fluency, picture priming, and tip of
        tongue, exhibited significant decline across the lifespan. SC exhibited decline
        in both intra- and interhemispheric frontotemporal and frontal lobe connections,
        contrasted by preserved or enhanced temporal lobe connectivity, supporting
        a pattern of frontal vulnerability concomitant with temporal resilience. Age-related
        FC patterns demonstrated overall preservation, reflecting compensatory mechanisms
        to sustain functional integrity despite structural degradation. GAMM analyses
        revealed complex relationships between brain connectivity and language performance
        across age. Thus, integrating knowledge of brain structure, function, and
        language abilities, we identified the brain network mechanisms associated
        with dichotomous language behavior along lifespan.\n                  <\/jats:p>","DOI":"10.1523\/jneurosci.0839-25.2025","type":"journal-article","created":{"date-parts":[[2025,12,2]],"date-time":"2025-12-02T18:50:15Z","timestamp":1764701415000},"page":"e0839252025","update-policy":"https:\/\/doi.org\/10.1523\/jneurosci.crossmarkpolicy","source":"Crossref","is-referenced-by-count":4,"title":["Frontal
