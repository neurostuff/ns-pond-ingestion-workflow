    body:
      string: '[{"paperId": "611cb28eb89774a1876482c06ebab2e2f3e720cc", "title": "Selective
        extinction through cognitive evaluation: Linking emotion regulation and extinction",
        "venue": "European Journal of Neuroscience", "year": 2020, "isOpenAccess":
        true, "openAccessPdf": {"url": "https://doi.org/10.31234/osf.io/cdw92", "status":
        "GOLD", "license": "CCBY", "disclaimer": "Notice: Paper or abstract available
        at https://api.unpaywall.org/v2/10.1111/ejn.14701?email=<INSERT_YOUR_EMAIL>
        or https://doi.org/10.1111/ejn.14701, which is subject to the license by the
        author or copyright owner provided with this content. Please go to the source
        to verify the license and copyright information for your use."}, "publicationDate":
        "2020-02-11", "authors": [{"authorId": "35702469", "name": "Birthe Macdonald"},
        {"authorId": "1651710257", "name": "S. Wake"}, {"authorId": "30361732", "name":
        "T. Johnstone"}], "abstract": "The extinction of a previously conditioned
        response can be modulated through cognitive processes, including feature\u2010based
        information, and explicit instruction. Here, we introduce a selective extinction
        through cognitive evaluation (SECE) task in which information is cognitively
        evaluated on a trial\u2010by\u2010trial basis to ascertain the extinction
        contingencies. Participants were conditioned to expect an electric shock during
        the presentation of one of two letters (CS+/CS\u2212). During the SECE task,
        the letters were presented within words belonging to two categories, one of
        which indicated safety (COG\u2212_CS+ trials), while risk of shock was maintained
        for the other category (COG+_CS+ trials). Skin conductance responses indicated
        that participants reduced their response to COG\u2212_CS+ trials compared
        to COG+_CS+ trials. Clusters in bilateral insula and anterior cingulate cortex
        showed activation for COG+_CS+ trials that was reduced for COG\u2212_CS+ trials.
        A network of brain regions, including left inferior frontal gyrus, and bilateral
        temporal and parietal cortices showed greater activation for COG\u2212_CS+
        versus COG+_CS+ trials. This is consistent with the semantic processing and
        decision\u2010making necessary to evaluate the trial contingencies. We compared
        activation in the SECE task to activation in a cognitive reappraisal task
        in which participants were asked to attend to, or regulate their emotional
        reactions to affective IAPS images. This task replicated prefrontal activation
        seen in previous reappraisal studies. A voxelwise conjunction analysis found
        no overlap between the cognitive reappraisal and the SECE task, but we did
        find evidence for common activation in follow\u2010up ROI analyses, supporting
        the idea of common lateral prefrontal mechanisms involved in both processes."}]

        '
