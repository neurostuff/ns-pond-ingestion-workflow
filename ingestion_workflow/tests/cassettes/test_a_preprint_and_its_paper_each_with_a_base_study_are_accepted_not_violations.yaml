      string: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"institution":[{"name":"Research
        Square"}],"indexed":{"date-parts":[[2026,6,3]],"date-time":"2026-06-03T08:01:17Z","timestamp":1780473677689,"version":"3.54.1"},"posted":{"date-parts":[[2026,2,2]]},"group-title":"In
        Review","reference-count":60,"publisher":"Springer Science and Business Media
        LLC","license":[{"start":{"date-parts":[[2026,2,2]],"date-time":"2026-02-02T00:00:00Z","timestamp":1769990400000},"content-version":"unspecified","delay-in-days":0,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"accepted":{"date-parts":[[2026,1,25]]},"abstract":"<title>Abstract<\/title>\n                <p>\n                  <italic>Background\/Objectives:<\/italic>\n                  Neurobiological
        frameworks of obesity in youth have focused largely on non-homeostatic systems
        (reward, salience, executive control), while the homeostatic system\u2014particularly
        the hypothalamus\u2014is comparatively understudied. A clearer picture of
        how these systems interact in adolescents with severe obesity is needed to
        inform treatment. This study sought to test whether adolescents with severe
        obesity exhibit altered hypothalamic functional connectivity, relative to
        healthy-weight peers, across fasting and fed states.\n                  <italic>Subjects\/Methods:<\/italic>\n                  We
        analyzed data from the Food and Adolescent Brain Study, a single-blinded randomized
        cross-over trial (NCT04208256) of 13\u201318-year-old adolescents with severe
        obesity (SO; body mass index [BMI] &gt;99\n                  <sup>th<\/sup>\n                  %ile;
        n=30; mean [SD] age 14.6 years [1.5]) and with healthy weight (HW; BMI &lt;85\n                  <sup>th<\/sup>\n                  %ile;
        n=26; 15.5 years [1.6]).\n                  <italic>Interventions\/Methods:<\/italic>\n                  Participants
        completed resting-state functional magnetic resonance scans during fasting
        and after ingesting a 75-gram glucose drink (1 255.8 kJ [300 kcal]) to induce
        a fed state. Multivariate general linear models were run in seed-to-voxel
        analyses to estimate functional connectivity, setting the hypothalamus as
        the seed region. All models were adjusted for age and sex, with significance
        determined via cluster-forming voxel-level p&lt;0.005 and false discovery
        rate-corrected cluster-level p&lt;0.05.\n                  <italic>Results<\/italic>\n                  :
        In adolescents with SO,\n                  <italic\/>\n                  during
        fasting, hypothalamic connectivity in adolescents with SO was weaker to the
        bilateral cerebellum and left(L) middle occipital gyrus, and stronger to the
        right(R) postcentral\/supramarginal gyri, compared to the HW group. During
        the fed state, hypothalamic connectivity increased to the bilateral middle
        frontal gyri and R putamen and decreased to the R caudate and L superior frontal
        gyrus in adolescents with SO, relative to the HW group.\n                  <italic>Conclusion:<\/italic>\n                  Severe
        obesity in adolescence is associated with altered communication between homeostatic
        (hypothalamus) and non-homeostatic brain structures, evident across fasting
        and fed states. Findings underscore the need to incorporate homeostatic circuitry
        into pediatric obesity frameworks.\n                <\/p>","DOI":"10.21203\/rs.3.rs-8694593\/v1","type":"posted-content","created":{"date-parts":[[2026,2,2]],"date-time":"2026-02-02T10:41:43Z","timestamp":1770028903000},"source":"Crossref","is-referenced-by-count":0,"title":["Altered
