    body:
      string: '[{"paperId": "14074a7ce78c3a3dc3064ca433dbc6f156239fb1", "title": "Neural
        networks for sentence comprehension and production: an ALE-based meta-analysis
        of neuroimaging studies", "venue": "Human Brain Mapping", "year": 2019, "isOpenAccess":
        true, "openAccessPdf": {"url": "https://doi.org/10.3389/conf.fnhum.2018.228.00076",
        "status": "GOLD", "license": "CCBY", "disclaimer": "Notice: Paper or abstract
        available at https://pmc.ncbi.nlm.nih.gov/articles/PMC6597252, which is subject
        to the license by the author or copyright owner provided with this content.
        Please go to the source to verify the license and copyright information for
        your use."}, "publicationDate": "2019-01-28", "authors": [{"authorId": "6128246",
        "name": "Matthew Walenski"}, {"authorId": "3582653", "name": "Eduardo Europa"},
        {"authorId": "2071357151", "name": "D. Caplan"}, {"authorId": "144721942",
        "name": "C. Thompson"}], "abstract": "Comprehending and producing sentences
        is a complex endeavor requiring the coordinated activity of multiple brain
        regions. We examined three issues related to the brain networks underlying
        sentence comprehension and production in healthy individuals: First, which
        regions are recruited for sentence comprehension and sentence production?
        Second, are there differences for auditory sentence comprehension vs. visual
        sentence comprehension? Third, which regions are specifically recruited for
        the comprehension of syntactically complex sentences? Results from activation
        likelihood estimation (ALE) analyses (from 45 studies) implicated a sentence
        comprehension network occupying bilateral frontal and temporal lobe regions.
        Regions implicated in production (from 15 studies) overlapped with the set
        of regions associated with sentence comprehension in the left hemisphere,
        but did not include inferior frontal cortex, and did not extend to the right
        hemisphere. Modality differences between auditory and visual sentence comprehension
        were found principally in the temporal lobes. Results from the analysis of
        complex syntax (from 37 studies) showed engagement of left inferior frontal
        and posterior temporal regions, as well as the right insula. The involvement
        of the right hemisphere in the comprehension of these structures has potentially
        important implications for language treatment and recovery in individuals
        with agrammatic aphasia following left hemisphere brain damage."}]

        '
