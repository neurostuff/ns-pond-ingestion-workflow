        BY</meta-value></custom-meta></custom-meta-group></article-meta></front><body><sec
        id=\"s1\"><title>Introduction</title><p>Although structural changes have been
        reported in patients with corticobasal syndrome (CBS) using neuroimaging <xref
        rid=\"pone.0041873-Brooks1\" ref-type=\"bibr\">[1]</xref>, <xref rid=\"pone.0041873-Erbetta1\"
        ref-type=\"bibr\">[2]</xref>, <xref rid=\"pone.0041873-Josephs1\" ref-type=\"bibr\">[3]</xref>,
        <xref rid=\"pone.0041873-Whitwell1\" ref-type=\"bibr\">[4]</xref>, the individual
        dynamics of progression of clinical symptoms in CBS and their relationship
        to the topography of structural changes that segregate the neurodegenerative
        effects are not well understood. In particular at the beginning of the disease
        local structural changes are indiscernible from those observed during normal
        aging due to considerable intersubject variability. The currently available
        tools for the analysis of MR images mainly lack the necessary sensitivity
        for detecting small changes that occur over a relatively short period of time,
        such as few months. However, in CBS and other neurodegenerative diseases such
        tools are desperately needed for an early clinical diagnosis and for the identification
        of treatment strategies that may modify the disease progression <xref rid=\"pone.0041873-Williams1\"
        ref-type=\"bibr\">[5]</xref>.</p><p>CBS is a rapidly progressing disease,
        which comprises different entities including corticobasal degeneration (CBS-CBD),
        Alzheimer disease (CBS-AD), progressive supranuclear palsy (CBS-PSP), frontotemporal
        lobar degeneration (FTLD), multisystem tauopathy, and parkinsonism linked
        to chromosome 17, wherefore pathological diagnosis is required as gold standard
        <xref rid=\"pone.0041873-Boeve1\" ref-type=\"bibr\">[6]</xref>, <xref rid=\"pone.0041873-Ling1\"
        ref-type=\"bibr\">[7]</xref>, <xref rid=\"pone.0041873-Litvan1\" ref-type=\"bibr\">[8]</xref>.
        The nomenclature and included subtypes, however, are still a matter of discussion
        <xref rid=\"pone.0041873-Boeve2\" ref-type=\"bibr\">[9]</xref>.</p><p>In 24\u201355%
        of all patients presenting with symptoms of CBS the underlying pathology is
        CBS-CBD <xref rid=\"pone.0041873-Ling1\" ref-type=\"bibr\">[7]</xref>, <xref
        rid=\"pone.0041873-Wadia1\" ref-type=\"bibr\">[10]</xref>. CBS-CBD commences
        between the age of 60\u201380 with typical signs of a progressive, asymmetric,
        akinetic-rigid syndrome including the clinical hallmarks of an ideomotor limb
        apraxia, alien limb syndrome and cortical sensory loss that respond poorly
        to levodopa therapy <xref rid=\"pone.0041873-Mahapatra1\" ref-type=\"bibr\">[11]</xref>.
        In addition, CBS-CBD can lead to frontotemporal dementia and non-fluent aphasia
        <xref rid=\"pone.0041873-Wadia1\" ref-type=\"bibr\">[10]</xref>. Due to this
        clinical heterogeneity, an overlap with other neurodegenerative diseases is
        common and may lead to clinical misdiagnosis <xref rid=\"pone.0041873-Boeve2\"
        ref-type=\"bibr\">[9]</xref>. In patients with clinical diagnosis of CBS-CBD,
        only 50% revealed pathologically proven CBD, and PSP was mainly detected in
        false positive cases <xref rid=\"pone.0041873-Ling1\" ref-type=\"bibr\">[7]</xref>,
        <xref rid=\"pone.0041873-Wadia1\" ref-type=\"bibr\">[10]</xref>. Furthermore,
        unusual types of Alzheimer\u2019s disease with prominent motor features or
        FTLD may have a similar clinical presentation <xref rid=\"pone.0041873-Ling1\"
        ref-type=\"bibr\">[7]</xref>, <xref rid=\"pone.0041873-Litvan1\" ref-type=\"bibr\">[8]</xref>,
        <xref rid=\"pone.0041873-Boeve2\" ref-type=\"bibr\">[9]</xref>, <xref rid=\"pone.0041873-Wadia1\"
        ref-type=\"bibr\">[10]</xref>.</p><p>The major histopathological feature of
        CBS-CBD is a widespread accumulation of abnormal phosphorylated tau protein
        in both glial cells and neurons, astrocytic plaques, and coiled bodies with
        gliosis of the substantia nigra <xref rid=\"pone.0041873-Mackenzie1\" ref-type=\"bibr\">[12]</xref>.
        Focal cortical neuronal loss and underlying white matter degeneration is primarily
        present in sensory and motor areas of the parietal and frontal cortex with
        relative sparing of temporal as well as occipital regions <xref rid=\"pone.0041873-Mahapatra1\"
        ref-type=\"bibr\">[11]</xref>. However, the localization of these findings
        overlaps with other tauopathies that may explain clinical similarity, leading
        to an ongoing discussion if these diseases in fact reflect separate entities
        <xref rid=\"pone.0041873-Litvan1\" ref-type=\"bibr\">[8]</xref>, <xref rid=\"pone.0041873-Boeve2\"
        ref-type=\"bibr\">[9]</xref>.</p><p>During the last years different functional
        and morphometric in-vivo studies (primarily cross-sectional) focused on the
        subtype differentiation of CBS <xref rid=\"pone.0041873-Josephs1\" ref-type=\"bibr\">[3]</xref>,
        <xref rid=\"pone.0041873-Whitwell1\" ref-type=\"bibr\">[4]</xref>, <xref rid=\"pone.0041873-Boxer1\"
        ref-type=\"bibr\">[13]</xref>. Recently, Whitwell and colleagues published
        cross-sectional imaging findings of autopsy-proven CBS patients <xref rid=\"pone.0041873-Whitwell1\"
        ref-type=\"bibr\">[4]</xref>. According to the pathological diagnosis, an
        increased focal cortical atrophy in the premotor und supplementary motor area
        was due to CBS-CBD and CBS-PSP pathology, whereas FTLD revealed a stronger
        frontotemporal and CBS-AD a more prominent temporo-parietal pattern of atrophy.</p><p>We
        here applied magnetic resonance imaging (MRI) and deformation field morphometry
        (DFM) in six clinically diagnosed CBS patients and eleven age- and sex-matched
        healthy controls from an ongoing follow-up study employing a longitudinal
        design. DFM is capable of detecting even subtle regional volume changes in
        the entire brain in small samples. The topography of significant volume changes
        was identified using probabilistic maps of cytoarchitectonic areas <xref rid=\"pone.0041873-Amunts1\"
        ref-type=\"bibr\">[14]</xref>, <xref rid=\"pone.0041873-Pieperhoff1\" ref-type=\"bibr\">[15]</xref>,
        <xref rid=\"pone.0041873-Pieperhoff2\" ref-type=\"bibr\">[16]</xref>.</p><table-wrap
