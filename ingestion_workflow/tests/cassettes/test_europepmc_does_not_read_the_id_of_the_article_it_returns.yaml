        id=\"nt102\"><label/><p>P values are given for a two-sided Mann-Whitney-U-test.
        *indicates significant P values (corrected for multiple comparisons by controlling
        the false discovery rate at 0.05). F indicates myeloarchitectonically defined
        maps of fibers, M indicates macroanatomically and C cytoarchitectonically
        defined areas.</p></fn></table-wrap-foot></table-wrap><p>The control group
        consisted of eleven age- and sex-matched, right-handed healthy volunteers
        with no previous history of neurological or medical disorder, who underwent
        21.4\xB12.7 months of follow-up with 2\u20134 serial MRIs obtained (<xref
        ref-type=\"supplementary-material\" rid=\"pone.0041873.s001\">Table S1</xref>).</p><fig
        id=\"pone-0041873-g001\" orientation=\"portrait\" position=\"float\"><object-id
        pub-id-type=\"doi\">10.1371/journal.pone.0041873.g001</object-id><label>Figure
        1</label><caption><title>Statistical maps (A: coronal and B: axial sections)
        of voxel-wise volume differences (upper trace) in comparison to probabilistic
        maps of cytoarchitectonically defined areas (lower trace) between 6 CBS patients
        and 11 age- and sex-matched controls (P&lt;0.01).</title><p>The colored bar
        represents the <italic toggle=\"yes\">T</italic> score of significant voxels
        (red to yellow indicate volume decline, blue indicate volume increase). Abbreviations:
        IPL \u200A=\u200A Inferior Parietal Lobule, CN \u200A=\u200A Caudate Nucleus,
        CST \u200A=\u200A Corticospinal Tract, SPL \u200A=\u200A Superior Parietal
        Lobule, VP \u200A=\u200A Ventral Posterior Nucleus of the thalamus, VA \u200A=\u200A
        Ventral Anterior Nucleus of the thalamus, C \u200A=\u200A Contralateral to
        the clinically most affected side, I \u200A=\u200A Ipsilateral to the clinically
        most affected side.</p></caption><graphic xmlns:xlink=\"http://www.w3.org/1999/xlink\"
        position=\"float\" orientation=\"portrait\" xlink:href=\"pone.0041873.g001.jpg\"><?image-name
        pone.0041873.g001.jpg?><?image-size 180665?><?image-md5 f05c410286a1d87a6faf2ca7ef24edac?><?image-image-server-status
        LOAD_COMPLETED?><?image-original-height 4758?><?image-original-width 6721?><?image-scaled-height
        559?><?image-scaled-width 790?><?image-cloudpmc-urn urn:cdn:blobs/e2e8/3407125/f05c410286a1/pone.0041873.g001.jpg?><?thumb-name
        pone.0041873.g001.gif?><?thumb-size 21329?><?thumb-md5 17e1fb55b0817a31054293d4c355b248?><?thumb-image-server-status
        NEVER_LOAD?><?thumb-scaled-height 80?><?thumb-scaled-width 113?><?thumb-cloudpmc-urn
        urn:cdn:blobs/e2e8/3407125/17e1fb55b081/pone.0041873.g001.gif?></graphic></fig><sec
        id=\"s2a\"><title>Ethics</title><p>Patients examined in this study were recruited
        from a large longitudinal study on patients with movement disorders, approved
        by the local ethics committee (study-no. 2849, \u201CEthikkommission der Medizinischen
        Fakult\xE4t der Heinrich-Heine-Universit\xE4t D\xFCsseldorf\u201D, <ext-link
        xmlns:xlink=\"http://www.w3.org/1999/xlink\" ext-link-type=\"uri\" xlink:href=\"http://medfak.uni-duesseldorf.de/dekanat/kommissionen/ethikkommission/\">http://medfak.uni-duesseldorf.de/dekanat/kommissionen/ethikkommission/</ext-link>,
        <email>replay@example.com</email>). The procedure and the reason for this
        examination in particular were explained to all patients and carers as well
        as healthy controls in full detail. At study inclusion all patients had adequate
        capacity/ability to personally give written informed consent as approved by
        the detailed neurological and neuropsychological testing. The study is in
        accordance with the Declaration of Helsinki.</p><fig id=\"pone-0041873-g002\"
        orientation=\"portrait\" position=\"float\"><object-id pub-id-type=\"doi\">10.1371/journal.pone.0041873.g002</object-id><label>Figure
        2</label><caption><title>Longitudinal local volume ratios (percent, y-axis)
        during follow-up examination (months, x-axis) of different cortical regions,
        the corticospinal tract and lateral ventricles that revealed significant group
        differences between CBS patients (coloured lines) and controls (grey lines).</title><p>Note
        that the y-axis of the lowermost graph is differently scaled.</p></caption><graphic
        xmlns:xlink=\"http://www.w3.org/1999/xlink\" position=\"float\" orientation=\"portrait\"
        xlink:href=\"pone.0041873.g002.jpg\"><?image-name pone.0041873.g002.jpg?><?image-size
        143136?><?image-md5 8f58b682f36eb9f3afc128f00299a6f9?><?image-image-server-status
        LOAD_COMPLETED?><?image-original-height 2802?><?image-original-width 1866?><?image-scaled-height
        1120?><?image-scaled-width 746?><?image-cloudpmc-urn urn:cdn:blobs/e2e8/3407125/8f58b682f36e/pone.0041873.g002.jpg?><?thumb-name
        pone.0041873.g002.gif?><?thumb-size 12195?><?thumb-md5 2e7fc2ee20a7691e84d3c2a414ffa8c0?><?thumb-image-server-status
        NEVER_LOAD?><?thumb-scaled-height 150?><?thumb-scaled-width 100?><?thumb-cloudpmc-urn
        urn:cdn:blobs/e2e8/3407125/2e7fc2ee20a7/pone.0041873.g002.gif?></graphic></fig></sec><sec
        id=\"s2b\"><title>MRI</title><p>Brains of the patients and the healthy controls
        were scanned in a 1.5 Tesla (Magnetom Vision, Siemens Medical Solutions; Erlangen,
        Germany) or 3 Tesla (Magnetom Trio Tim System, Siemens Medical Solutions;
        Erlangen, Germany) MR-tomograph with a standard CP head coil. Pulse sequences
        were as follows: sagittal 3D gradient echo sequence (repetition time (TR)
        9.7 ms, echo time (TE) 4 ms, 1 mm slice thickness for 1.5 Tesla and TR 2300
        ms, TE 2.98 ms, 1 mm slice thickness for 3 Tesla, with one signal acquired),
        field of view (FOV) 256-mm and 256\xD7256 matrix. All follow-up scans of a
        single patient or control were acquired by using the same scanner as for the
        initial scan (<xref ref-type=\"table\" rid=\"pone-0041873-t001\">Table 1</xref>,
        <xref ref-type=\"supplementary-material\" rid=\"pone.0041873.s001\">Table
        S1</xref>).</p><fig id=\"pone-0041873-g003\" orientation=\"portrait\" position=\"float\"><object-id
        pub-id-type=\"doi\">10.1371/journal.pone.0041873.g003</object-id><label>Figure
        3</label><caption><title>Longitudinal local volume ratios (percent, y-axis)
        during follow-up examination (months, x-axis) of different subcortical regions
        that revealed significant group differences between CBS patients (coloured
        lines) and controls (grey lines).</title></caption><graphic xmlns:xlink=\"http://www.w3.org/1999/xlink\"
        position=\"float\" orientation=\"portrait\" xlink:href=\"pone.0041873.g003.jpg\"><?image-name
        pone.0041873.g003.jpg?><?image-size 145298?><?image-md5 47a632364a1d367fa9702e207430881f?><?image-image-server-status
        LOAD_COMPLETED?><?image-original-height 2802?><?image-original-width 1885?><?image-scaled-height
        1121?><?image-scaled-width 754?><?image-cloudpmc-urn urn:cdn:blobs/e2e8/3407125/47a632364a1d/pone.0041873.g003.jpg?><?thumb-name
        pone.0041873.g003.gif?><?thumb-size 12187?><?thumb-md5 621a46a0d4600263465291604c14da99?><?thumb-image-server-status
        NEVER_LOAD?><?thumb-scaled-height 149?><?thumb-scaled-width 100?><?thumb-cloudpmc-urn
        urn:cdn:blobs/e2e8/3407125/621a46a0d460/pone.0041873.g003.gif?></graphic></fig></sec><sec
        id=\"s2c\"><title>Deformation Field Morphometry (DFM)</title><p>A detailed
        description of the applied morphometric technique has been published <xref
        rid=\"pone.0041873-Pieperhoff2\" ref-type=\"bibr\">[16]</xref>. Hence, we
        only provide a brief outline here. Serial MR images of each subject were examined
        for intraindividual differences between each follow-up and the initial MR
        image (Ti). Therefore, the follow-up images were registered to the initial
        image using a non-linear registration. As a result of registration, deformation
        fields were calculated for each subject and each follow-up imaging. The deformation
        fields were transformed to \u201Clocal volume ratio\u201D (LVR) maps <xref
        rid=\"pone.0041873-Pieperhoff2\" ref-type=\"bibr\">[16]</xref>. The LVR data
        indicate voxel-wise volume differences of the brain between the initial and
        corresponding follow-up MR observations. Therefore, a sequence of each subject\u2019s
        LVR maps encodes structural changes in each voxel of the brain.</p><fig id=\"pone-0041873-g004\"
        orientation=\"portrait\" position=\"float\"><object-id pub-id-type=\"doi\">10.1371/journal.pone.0041873.g004</object-id><label>Figure
        4</label><caption><title>Longitudinal local volume ratios (percent, y-axis)
        during follow-up examination (months, x-axis) of different cortical and subcortical
        regions that revealed no significant group differences between CBS patients
        (coloured lines) and controls (grey lines).</title><p>Note that at individual
        level in cases 3 and 6 a mild affection of the inferior temporal gyrus is
        evident.</p></caption><graphic xmlns:xlink=\"http://www.w3.org/1999/xlink\"
        position=\"float\" orientation=\"portrait\" xlink:href=\"pone.0041873.g004.jpg\"><?image-name
        pone.0041873.g004.jpg?><?image-size 133791?><?image-md5 6418d8be88f35c999006c20b84adf823?><?image-image-server-status
        LOAD_COMPLETED?><?image-original-height 2802?><?image-original-width 1885?><?image-scaled-height
        1121?><?image-scaled-width 754?><?image-cloudpmc-urn urn:cdn:blobs/e2e8/3407125/6418d8be88f3/pone.0041873.g004.jpg?><?thumb-name
        pone.0041873.g004.gif?><?thumb-size 11557?><?thumb-md5 d4ffa4e4d3c793a42607a4b438548402?><?thumb-image-server-status
        NEVER_LOAD?><?thumb-scaled-height 149?><?thumb-scaled-width 100?><?thumb-cloudpmc-urn
        urn:cdn:blobs/e2e8/3407125/d4ffa4e4d3c7/pone.0041873.g004.gif?></graphic></fig></sec><sec
        id=\"s2d\"><title>Analysis of Anatomical Brain Regions</title><p>LVR maps
        were analysed in two different ways <xref rid=\"pone.0041873-Pieperhoff2\"
        ref-type=\"bibr\">[16]</xref>: (a) Voxel-wise analyses; maps showing individual
        changes of brain structure in the native space of each subject were generated,
        as well as statistical maps showing differences on the group level. The latter
        analysis required all subjects\u2019 LVR-maps of the last examination to be
        transformed into the standard space of the MNI single-subject template <xref
        rid=\"pone.0041873-Holmes1\" ref-type=\"bibr\">[23]</xref>. Differences between
        the transformed maps were examined by SPM 8 (<ext-link xmlns:xlink=\"http://www.w3.org/1999/xlink\"
        ext-link-type=\"uri\" xlink:href=\"http://www.fil.ion.ucl.ac.uk/spm\">http://www.fil.ion.ucl.ac.uk/spm</ext-link>).
        Voxel-wise analyses enable to visualize small regional effects. On the other
        hand, they are also prone to uncertainties due to image registration, which
        may impact voxel-wise statistical analysis. (b) Volume changes of anatomical
        regions; such changes were calculated as the weighted sum of the voxel-wise
        LVR-values (see below) in regions of interest. Hence the impact of registration
        errors of single voxels is reduced as compared to a), the robustness of the
        volume measures is higher. In addition, reducing the volume change data of
        millions of voxels to a much lower number of regional volume data permits
        a better visualization. For example, representations of individual time-dependent
        volume changes as charts provide important information about the individual
        course of the disease as well as inter-individual variability in an intuitive
        manner, whereas similar representations by statistical parametric maps are
        hardly possible.</p><fig id=\"pone-0041873-g005\" orientation=\"portrait\"
        position=\"float\"><object-id pub-id-type=\"doi\">10.1371/journal.pone.0041873.g005</object-id><label>Figure
        5</label><caption><title>Topography of brain volume changes as detected by
        DFM analysis in comparison to probabilistic maps of cytoarchitectonically
        defined areas that were superimposed on each individual MRI-Scan in (A\u2013C)
        three CBS patients (case 1, 2 and 6) and (D) a healthy control during long-term
        follow-up examination.</title><p>The color coding of the voxels indicate the
        time interval since the initial scan, when their volume had declined by 5%
        relative to the initial time point. Thus these images show the temporal spreading
        of the atrophy in each subject\u2019s brain (e.g. red or yellow mean, that
        after 10 or 20 months, respectively, the voxel volume had shrunk by 5%). Note
        that in (A) patient 1 and (B) patient 2 showed a more prominent volume decline
        within area 6 and basal ganglia nuclei, whereas (C) patient 6 revealed lesser
        volume changes with stronger involvement of temporal regions. The control
        brain (D) showed only minimal brain volume alterations. Abbreviations: CN
        \u200A=\u200A Caudate Nucleus, CST \u200A=\u200A Corticospinal Tract, IPL
        \u200A=\u200A Inferior Parietal Lobule, SPL \u200A=\u200A Superior Parietal
        Lobule, VA \u200A=\u200A Ventral Anterior Nucleus of the thalamus, VL \u200A=\u200A
        Ventral Lateral Nucleus of the thalamus, VP \u200A=\u200A Ventral Posterior
        Nucleus of the thalamus, L \u200A=\u200A Left, R \u200A=\u200A Right.</p></caption><graphic
        xmlns:xlink=\"http://www.w3.org/1999/xlink\" position=\"float\" orientation=\"portrait\"
        xlink:href=\"pone.0041873.g005.jpg\"><?image-name pone.0041873.g005.jpg?><?image-size
        329915?><?image-md5 0ee142416d92645fa8a1a889cbc08724?><?image-image-server-status
        LOAD_COMPLETED?><?image-original-height 6899?><?image-original-width 4418?><?image-scaled-height
        1149?><?image-scaled-width 736?><?image-cloudpmc-urn urn:cdn:blobs/e2e8/3407125/0ee142416d92/pone.0041873.g005.jpg?><?thumb-name
        pone.0041873.g005.gif?><?thumb-size 24443?><?thumb-md5 3cc337a8cb2e8badacd9581664c0702c?><?thumb-image-server-status
        NEVER_LOAD?><?thumb-scaled-height 156?><?thumb-scaled-width 100?><?thumb-cloudpmc-urn
        urn:cdn:blobs/e2e8/3407125/3cc337a8cb2e/pone.0041873.g005.gif?></graphic></fig><p>Probabilistic
        maps of cytoarchitectonically defined cortical areas and subcortical nuclei,
        as well as myeloarchitectonically delineated fiber tracts (<ext-link xmlns:xlink=\"http://www.w3.org/1999/xlink\"
        ext-link-type=\"uri\" xlink:href=\"http://www.fz-juelich.de/inm/inm-1\">http://www.fz-juelich.de/inm/inm-1</ext-link>)
        were used for measurements of localized changes in circumscribed anatomical
        entities. These structures have been delineated in histological sections of
        ten post-mortem brains <xref rid=\"pone.0041873-Amunts1\" ref-type=\"bibr\">[14]</xref>,
        <xref rid=\"pone.0041873-Amunts2\" ref-type=\"bibr\">[24]</xref>, <xref rid=\"pone.0041873-Brgel1\"
        ref-type=\"bibr\">[25]</xref>, <xref rid=\"pone.0041873-Zilles1\" ref-type=\"bibr\">[26]</xref>.
        The probabilistic maps were registered to the T1-weighted single-subject template
        of the Montreal Neurological Institute (MNI) <xref rid=\"pone.0041873-Holmes1\"
        ref-type=\"bibr\">[23]</xref>. In the present study, cytoarchitectonic maps
        of somatosensory and motor cortex areas as well as the superior parietal lobule
        were particularly relevant <xref rid=\"pone.0041873-Geyer1\" ref-type=\"bibr\">[27]</xref>,
        <xref rid=\"pone.0041873-Geyer2\" ref-type=\"bibr\">[28]</xref>, <xref rid=\"pone.0041873-Grefkes1\"
        ref-type=\"bibr\">[29]</xref>, <xref rid=\"pone.0041873-Scheperjans1\" ref-type=\"bibr\">[30]</xref>.
        In addition to the presently available probabilistic cyto- and myeloarchitectonic
        maps, which do not cover the entire cortex and subcortical nuclei, maps of
        macroanatomically defined structures of the MNI template (<ext-link xmlns:xlink=\"http://www.w3.org/1999/xlink\"
        ext-link-type=\"uri\" xlink:href=\"http://www.loni.ucla.edu/ICBM/Downloads/Downloads_ICBMtemplate.shtml\">http://www.loni.ucla.edu/ICBM/Downloads/Downloads_ICBMtemplate.shtml</ext-link>)
        were used whenever necessary. All anatomical maps (macrostructural as well
        as myelo- and cytoarchitectonic) were warped onto each brain volume <xref
        rid=\"pone.0041873-Pieperhoff1\" ref-type=\"bibr\">[15]</xref>, <xref rid=\"pone.0041873-Pieperhoff2\"
        ref-type=\"bibr\">[16]</xref>. For each case, relative volume changes of cyto-
        and myeloarchitectonically defined regions of interest were calculated as
        the sum of voxel-wise LVR-values weighted by the voxel-values of probabilistic
        cyto- or myeloarchitectonical maps:</p><disp-formula id=\"pone.0041873.e001\"><graphic
        xmlns:xlink=\"http://www.w3.org/1999/xlink\" position=\"anchor\" orientation=\"portrait\"
        xlink:href=\"pone.0041873.e001.jpg\"><?image-name pone.0041873.e001.jpg?><?image-size
        6594?><?image-md5 1af49e95d146a9572ec367e3f33e0643?><?image-image-server-status
        NEVER_LOAD?><?image-scaled-height 78?><?image-scaled-width 304?><?image-cloudpmc-urn
        urn:cdn:blobs/e2e8/3407125/1af49e95d146/pone.0041873.e001.jpg?></graphic></disp-formula><p>\u0394<italic
        toggle=\"yes\">v<sub>RegionI</sub>(t<sub>k</sub>)</italic> \u200A=\u200A relative
        volume change of the anatomical region under consideration at time point <italic
        toggle=\"yes\">t<sub>k</sub></italic> relative to the initial measurement,
        <italic toggle=\"yes\">t<sub>k</sub></italic> \u200A=\u200A time point of
        a follow-up scan (<italic toggle=\"yes\">k\u2265</italic>1), <italic toggle=\"yes\">\u03A9<sub>Region</sub></italic>
        \u200A=\u200A set of voxels belonging to the region (at the initial measurement),
        <inline-formula id=\"pone.0041873.e002\"><inline-graphic xmlns:xlink=\"http://www.w3.org/1999/xlink\"
        xlink:href=\"pone.0041873.e002.jpg\"><?image-name pone.0041873.e002.jpg?><?image-size
        1145?><?image-md5 87d8ffa08da877eb93b7d03f17ce7696?><?image-image-server-status
        NEVER_LOAD?><?image-scaled-height 17?><?image-scaled-width 74?><?image-cloudpmc-urn
        urn:cdn:blobs/e2e8/3407125/87d8ffa08da8/pone.0041873.e002.jpg?></inline-graphic></inline-formula>\u200A=\u200A
        local volume ratio in voxel <inline-formula id=\"pone.0041873.e003\"><inline-graphic
        xmlns:xlink=\"http://www.w3.org/1999/xlink\" xlink:href=\"pone.0041873.e003.jpg\"><?image-name
        pone.0041873.e003.jpg?><?image-size 293?><?image-md5 e8b27aa89679a29dd1ae6bdcbbd80620?><?image-image-server-status
        NEVER_LOAD?><?image-scaled-height 13?><?image-scaled-width 9?><?image-cloudpmc-urn
        urn:cdn:blobs/e2e8/3407125/e8b27aa89679/pone.0041873.e003.jpg?></inline-graphic></inline-formula>
        at the follow-up measurement at time point <italic toggle=\"yes\">t<sub>k</sub></italic>,
        <inline-formula id=\"pone.0041873.e004\"><inline-graphic xmlns:xlink=\"http://www.w3.org/1999/xlink\"
        xlink:href=\"pone.0041873.e004.jpg\"><?image-name pone.0041873.e004.jpg?><?image-size
        1136?><?image-md5 a4e5a48333eb9a7166f36769605267eb?><?image-image-server-status
        NEVER_LOAD?><?image-scaled-height 18?><?image-scaled-width 66?><?image-cloudpmc-urn
        urn:cdn:blobs/e2e8/3407125/a4e5a48333eb/pone.0041873.e004.jpg?></inline-graphic></inline-formula>
        \u200A=\u200A probabilistic value of the region in voxel <inline-formula id=\"pone.0041873.e005\"><inline-graphic
        xmlns:xlink=\"http://www.w3.org/1999/xlink\" xlink:href=\"pone.0041873.e005.jpg\"><?image-name
        pone.0041873.e005.jpg?><?image-size 293?><?image-md5 e8b27aa89679a29dd1ae6bdcbbd80620?><?image-image-server-status
        NEVER_LOAD?><?image-scaled-height 13?><?image-scaled-width 9?><?image-cloudpmc-urn
        urn:cdn:blobs/e2e8/3407125/e8b27aa89679/pone.0041873.e005.jpg?></inline-graphic></inline-formula>.</p></sec><sec
        id=\"s2e\"><title>Statistical Evaluation</title><p>For statistical comparison
        of the demographic and clinical parameters between CBS patients and control
        subjects the two-sided t-test was used for normally distributed and the two-sided
        Mann-Whitney-U-test for non-normally distributed data. Normality of data distribution
        was assessed using the Kolmogorov-Smirnov test. Differences of <italic toggle=\"yes\">p</italic>&lt;0.05
        were considered significant.</p><p>Further, we analysed the dynamics of intraindividual
        volume reduction in myeloarchitectonically defined fiber tracts, cytoarchitectonic
        areas as well as macroanatomically defined cortical and subcortical areas
        in CBS patients and controls. Between-group differences of local volume changes
        at the last follow-up examination were assessed using the two-sided Mann-Whitney-U-test
        to determine those brain areas, where volume loss was significantly greater
        in CBS patients than in healthy controls. All controls were right-handed wherefore
        we defined left-hemispheric data as \u201Ccontralateral\u201D and right-hemispheric
        data as \u201Cipsilateral\u201D. This explorative analysis was applied to
        all brain regions. Testing multiple brain regions in parallel increases the
        risk of false positive findings. However, the commonly used Bonferroni\u2019s
        method to control the family wise error will become conservative, in particular
        when correlations between the tests are present. Such correlations are to
        be expected, because volume changes of the brain which are caused either by
        normal aging or by neurodegenerative disease, will in general affect systems
        of anatomical entities in the brain. Moreover, Bonferroni\u2019s method corrects
        for the occurrence of <italic toggle=\"yes\">any</italic> false positive result.
        Therefore, we chose to control the \u201CFalse discovery rate\u201D at 0.05
        in order to correct for multiple comparisons <xref rid=\"pone.0041873-Benjamini1\"
        ref-type=\"bibr\">[31]</xref>, <xref rid=\"pone.0041873-Genovese1\" ref-type=\"bibr\">[32]</xref>.
        In addition, the complementary voxel-wise analysis of group differences was
        calculated in SPM 8.</p><p>The gender of the participants and the MR scanner
        which was used for the image acquisition are two further factors which could
        intermingle with differences between both patients and controls. The sample
        size, however, was too low to consider these factors in a multi-way statistical
        analysis and both groups were balanced against the factor gender (number of
        males/females: controls 5/6, patients 3/3). Therefore, a gender-related confounding
        effect was not expected. The effect of the different MR scanner type was analyzed
        by calculating a t-test of differences between the 1.5-Tesla- and 3.0-Tesla
        scans within the control group, which did not reach significance. Therefore,
        both factors were not further considered in the following analyses. Moreover,
        it should be stressed, that each participant\u2019s sequence of MR scans was
        acquired in the same scanner (i.e. there was no mixing of scans from different
        scanners within the same participant).</p><p>Descriptive statistics and basic
        comparisons were analyzed using the MedCalC software package (MedCalc 11.1,
        Belgium).</p></sec><sec id=\"s2f\"><title>Clinical Parameters</title><p>None
        of the patients had other neurologic diseases or family history for dementia
        and parkinsonism. Motor symptoms showed no positive response to levodopa during
        levodopa-test or continuing dopaminergic therapy.</p></sec><sec id=\"s2g\"><title>Case
        1</title><p>A 72-year-old woman presented with a 1 year history of progressive
        rigidity, bradykinesia and ideomotor limb apraxia (IMA) of her right arm at
        the time of initial volumetric MRI. Neuropsychological evaluation and diagnostic
        MRI scans were normal. During the 26-months follow-up period (examinations
        after 16, 20, 23, 26 months) the hypokinetic-rigid syndrome (UPDRS-III 18
        \u2192 33), and ideomotor apraxia worsened significantly and additionally
        affected the left upper extremity. Furthermore, a right-sided cortical sensory
        loss in terms of a tactile agnosia, speech apraxia, Babinski sign and alien
        limb syndrome appeared. There were no clinical features of clonus or muscle
        atrophy. After 26 months of follow-up, she revealed no cognitive impairments
        besides mild visuoconstruction and attention deficits (MDRS 133/144).</p></sec><sec
        id=\"s2h\"><title>Case 2</title><p>A 69-year-old man complained that over
        the last 2 years his left upper extremity became clumsy and useless. At initial
        follow-up examination he revealed a moderate left-dominant hypokinetic-rigid
        syndrome (UPDRS-III 21) as well as myoclonus and ideomotor apraxia of the
        left hand. Diagnostic brain MRI scans were normal. Neuropsychological testing
        detected mild deficits in the subitems attention, initiation-perseveration
        as well as construction of the MDRS (total score 126/144); memory subscales
        were normal. During the 25-months follow-up period (examinations after 3,
        6, 10, 13, 18, 22, 26 months) the hypokinetic-rigid syndrome dramatically
        worsened (UPDRS-III 21 \u2192 46) and a left upper alien limb syndrome appeared.
        Furthermore, ideomotor apraxia became bilateral and a speech apraxia was evident.
        He developed a vertical supranuclear palsy and postural instability. His abilities
        on formal psychometric testing deteriorated and MDRS declined to 96, showing
        worsening of attention, initiation-perseveration and construction as well
        as onset of memory deficits.</p></sec><sec id=\"s2i\"><title>Case 3</title><p>A
        76-year-old man progressively developed a stiffness and uselessness of his
        left arm and leg over the course of 2 two years. At initial examination he
        presented with a left-dominant moderate hypokinetic-rigid syndrome (UPDRS-III
        33). Furthermore, he was affected by a solely left-sided ideomotor apraxia
        and dystonia. Diagnostic MRI scans demonstrated cortical atrophy pronounced
        in fronto-parietal regions accompanied by a ventricular widening. The neuropsychological
        examination was limited since the patient was nearly blind due to a senile
        macular degeneration. Therefore, only verbal testing was possible and MDRS
        was reduced to a maximum of 103 and MMSE to a maximum of 25 points. He initially
        revealed minimal deficits in the domains initiation-perseveration and attention.
        Memory functions, orientation and conceptualization were normal. During the
        24-months follow-up (examinations after 11, 14, 20, 24 months), he developed
        a severe bilateral but left-dominant akinetic-rigid syndrome (UPDRS-III up
        to 58) and ideomotor apraxia of all limbs. He became chairbound due to the
        apractic gait dysfunction. Furthermore, he developed an alien limb syndrome
        and astereognosia of the left arm as well as a supranuclear palsy. Psychometry
        revealed worsening of initiation-perseveration and onset of mild memory deficits.</p></sec><sec
        id=\"s2j\"><title>Case 4</title><p>A 68-year-old woman developed a severe
        akinetic-rigid syndrome (UPDRS-III 44) with dystonic and painful contraction
        of the left upper and lower extremity over the last 2 years. The left leg
        became apractic with consecutive gait difficulties. Babinski sign was positive,
        but there were no clinical findings of weakness, hyperreflexia or fasciculations.
        Diagnostic MRI scans showed mild to moderate cortical atrophy but detailed
        neuropsychological testing was normal. After a 14-months follow-up period
        (examinations after 7, 14 months) she was chairbound due to a gait apraxia.
        The hypokinetic-rigid syndrome worsened and manifested bilaterally (UPDRS-III
        44 \u2192 64). Furthermore, a painful left-dominant dystonia affected all
        limbs, wherefore initiation of botulinum toxin injection was necessary. Moreover,
        a speech apraxia and astereognosia developed. She still performed normal on
        psychometric testing. Two months after the last follow-up examination the
        patient died of a subacute ileus.</p></sec><sec id=\"s2k\"><title>Case 5</title><p>A
        62-year-old woman presented with a progressive stiffness, slowness and difficulty
        using the right arm. At initial examination, she had moderate hypokinetic-rigid
        syndrome (UPDRS-III 20), ideomotor apraxia, alien limb phenomenon and myoclonus
        of the right upper limb. Diagnostic MRI scans and detailed neuropsychological
        testing were normal. During a 16-months follow-up period (examinations after
        4, 7, 10, 12, 16 months) the hypokinetic-rigid syndrome rapidly worsened and
        became bilateral (UPDRS-III up to 45). The ideomotor apraxia as well as the
        alien limb syndrome further increased and she developed a painful dystonia
        of the right hand. At final visit, formal psychometry revealed severe constructional
        apraxia as well as slight initiation-perseveration impairment; memory functions
        were normal.</p></sec><sec id=\"s2l\"><title>Case 6</title><p>A 65-year-old
        man suffered of a 4 year history of progressive right-dominant upper ideomotor
        apraxia, dystonia, bradykinesia and rigidity as well as right-sided alien
        limb syndrome. At the time of first scanning neuropsychological examination
        revealed reduced verbal fluency due to dysphasia, a moderate dyscalculia and
        slight deficits of additional cognitive functions. Diagnostic brain MRI demonstrated
        mild left-sided parietal-frontal atrophy. During the 19-months follow-up significant
        worsening of right-dominant ideomotor apraxia and hypokinetic-rigid syndrome
        (UPDRS-III 25 \u2192 32) was evident and a right-sided stereoagnosia developed.
        Furthermore, pronounced memory impairment and onset of visuoconstructive and
        attention deficits were obvious.</p></sec></sec><sec id=\"s3\"><title>Results</title><sec
        id=\"s3a\"><title>Clinical Findings</title><p>The clinical data of the CBS
        patients are summarized in <xref ref-type=\"table\" rid=\"pone-0041873-t001\">Table
        1</xref>. The mean age (68.7\xB15 years, range 62\u201376 years) and the mean
        time of follow-up examinations (20.8\xB15.2 months, range 14\u201326 months)
        were similar to those of the control group (mean age 60.1\xB110.3 years, range
        45\u201379 years, p\u200A=\u200A0.06, Mann-Whitney-U-Test, two-sided; mean
        follow-up 21.4\xB12.7, range 18\u201326 months, p\u200A=\u200A0.9, Mann-Whitney-U-Test,
        two-sided).</p><p>During the follow-up period CBS patients showed rapid worsening
        of clinical symptoms, reflected by a significant increase of the UPDRS-III
        score (p\u200A=\u200A0.015, t test), the FAST score (stronger affected limb
        p\u200A=\u200A0.36, lesser affected limb p\u200A=\u200A0.04, t test) and the
        FT scores (stronger affected limb p\u200A=\u200A0.04, lesser affected limb
        p\u200A=\u200A0.004, t test). Asymmetric hypokinetic-rigid syndrome and ideomotor
        apraxia were present in all CBS patients. The second most frequent clinical
        findings were limb dystonia and alien limb syndrome in 5/6 patients (83%).
        Neuropsychological follow-up assessment revealed pathologic findings particularly
        in the domain of initiation and construction. Mild to moderate memory impairment
        was present in case 2, 3 and 6.</p><p>Neurological and neuropsychological
        scores of the control subjects remained in normal range during the course
        of the entire study period (<xref ref-type=\"supplementary-material\" rid=\"pone.0041873.s001\">Table
        S1</xref>). They revealed constant UPDRS-III (T initial: 0.9\xB11.4; T final:
        1.1\xB11.3; p\u200A=\u200A0.68, Mann-Whitney-U-Test) and MMSE (T initial:
        29.9\xB10.3, T final: 29.9\xB10.3) values.</p></sec><sec id=\"s3b\"><title>Group
        Comparison of Regional Brain Volume Changes between CBS Patients and Controls</title><p>\n<xref
        ref-type=\"table\" rid=\"pone-0041873-t002\">Table 2</xref> summarizes the
        between-group comparison of local volume changes at final follow-up examination
        (T final) within anatomically defined regions between CBS patients and healthy
        volunteers. Group comparison identified different cortical and subcortical
        regions with significant atrophy in CBS patients as compared to controls.
        Bilaterally, a highly significant volume loss of the premotor area 6 and the
        primary motor area 4 was detected. Furthermore, the superior parietal lobules
        of both hemispheres and the somatosensory area 3a demonstrated a significant
        volume decrease relative to controls. Occipital and temporal regions did not
        show differences in volume reduction between groups, although in individual
        patients we found a reduction of volume. With respect to the subcortical regions,
        significant atrophy was identified in the head of the caudate nucleus, putamen,
        pallidum and substantia nigra. In addition, highly significant gray matter
        loss was observed within the motor thalamus comprising the ventral anterior
        (VA) and ventral lateral (VL) thalamic nuclei. Furthermore, prominent atrophy
        of the corticospinal tract and widening of the ventricles was found. None
        of the identified regions revealed significant side-to-side differences.</p><p>The
        complementary voxel-wise analysis of group differences revealed the same pattern
        (<xref ref-type=\"fig\" rid=\"pone-0041873-g001\">Figure 1</xref>): Cortex
        and underlying white matter of the prefrontal and parietal lobes showed strong
        volume loss, whereas other parts of the neocortex were spared. Moreover, head
        of caudate nucleus, globus pallidus and thalamus were strongly affected in
        the patients group.</p></sec><sec id=\"s3c\"><title>Comparison of Individual
        Atrophy Patterns Across CBS Patients and Healthy Controls</title><p>The individual
        dynamics of brain volume changes in the regions that revealed significant
        group differences between CBS patients and healthy controls are demonstrated
        in <xref ref-type=\"fig\" rid=\"pone-0041873-g002\">Figure 2</xref> and <xref
        ref-type=\"fig\" rid=\"pone-0041873-g003\">Figure 3</xref>; examples of other
        cytoarchitectonically defined areas are shown in <xref ref-type=\"fig\" rid=\"pone-0041873-g004\">Figure
        4</xref>.</p><p>Longitudinal DFM analysis in the control group showed only
        minimal alterations of the total brain volume. Only ventricles revealed a
        mild to moderate increase in total volume after the follow-up period of 18\u201326
        months. In contrast to these minimal brain volume changes, individual CBS
        patients presented severe and focal atrophy within basal ganglia, thalamus,
        frontal and parietal areas. Involved regions thereby revealed different degrees
        of spatio-temporal atrophy contralateral as well as ipsilateral to the clinically
        most affected side. In all cases, there was a prominent bilateral, progressive
        volume loss in the premotor and primary motor cortex and the corticospinal
        tract. Patients with shorter disease durations of 1\u20132 years at study
        inclusion (cases 1\u20134) showed a more severe volume decline than patients
        with longer disease durations of 3\u20134 years (case 5\u20136). The contralateral
        head of the caudate nucleus, putamen and pallidum were affected in all CBS
        patients. The ventral anterior nuclei of the motor thalamus were most strongly
        affected and revealed bilateral involvement in all patients. The rates of
        volume decline in the substantia nigra and the posterior parietal cortical
        regions were not as prominent and overlapped between CBS patients and normally
        aging controls. Atrophy of area 3a was only visible in cases 1, 3, 4 and 6.
        Interestingly, these patients developed an astereognosia during clinical follow-up
        examination. The superior parietal lobule revealed only mild rates of atrophy.
        An affection of the temporal lobe, that did not show significant differences
        at group comparison, was found in cases 3 and 6 who also presented a cognitive
        impairment. The topography of brain volume changes during longitudinal DFM
        analysis and the dynamics of progression are shown in <xref ref-type=\"fig\"
        rid=\"pone-0041873-g005\">Figure 5</xref>.</p></sec></sec><sec id=\"s4\"><title>Discussion</title><p>In
        this study pathological changes in the individual brains of patients with
        the clinical diagnosis of CBS were compared to normal aging in healthy controls
        using longitudinal DFM analysis <xref rid=\"pone.0041873-Pieperhoff2\" ref-type=\"bibr\">[16]</xref>.
        During two years of follow-up scans, relatively short time intervals of three
        to four months revealed the spatio-temporal dynamics of cortical and subcortical
        atrophy. In all CBS patients, a common degeneration within motor circuits,
        comprising basal ganglia and motor thalamic nuclei as well as the premotor
        and primary motor cortex was present. Clinical long-term follow-up examination
        revealed characteristic progressive, asymmetrical cortical and basal-ganglia
        features that were unresponsive to levodopa and supported the diagnosis of
        CBS <xref rid=\"pone.0041873-Boeve1\" ref-type=\"bibr\">[6]</xref>, <xref
        rid=\"pone.0041873-Shelley1\" ref-type=\"bibr\">[21]</xref>, <xref rid=\"pone.0041873-Mathew1\"
        ref-type=\"bibr\">[22]</xref>.</p><p>To increase the in vivo diagnostic accuracy
        in CBS several imaging techniques have been proposed to detect neurodegenerative
        brain volume changes <xref rid=\"pone.0041873-Brooks1\" ref-type=\"bibr\">[1]</xref>,
        <xref rid=\"pone.0041873-Boeve1\" ref-type=\"bibr\">[6]</xref>. One methodological
        approach for the differentiation of CBS during lifetime is given by the visualization
        of the underlying neurodegeneration using morphometric MRI analysis <xref
        rid=\"pone.0041873-Josephs1\" ref-type=\"bibr\">[3]</xref>, <xref rid=\"pone.0041873-Whitwell1\"
        ref-type=\"bibr\">[4]</xref>, <xref rid=\"pone.0041873-Boxer1\" ref-type=\"bibr\">[13]</xref>,
        <xref rid=\"pone.0041873-Huey1\" ref-type=\"bibr\">[33]</xref>, <xref rid=\"pone.0041873-Whitwell2\"
        ref-type=\"bibr\">[34]</xref>. In this respect, Whitwell and colleagues only
        recently showed imaging of atrophy patterns in autopsy proven subtypes of
        CBS that were of diagnostic value to discriminate CBS-CBD, CBS-PSP, CBS-AD
        and frontotemporal lobar degeneration with TDP-43 immunoreactivity (CBS-TDP)
        <xref rid=\"pone.0041873-Whitwell1\" ref-type=\"bibr\">[4]</xref>. They demonstrated
        a prominent focal gray matter loss of the premotor cortex and supplementary
        cortex in CBS-CBD and CBS-PSP with sparing of inferior frontal lobe in CBS-PSP.
        In CBS-AD and CBS-TDP a more widespread and distinctive pattern of gray matter
        loss was shown, with pronounced frontotemporal volume degeneration suggesting
        CBS-TDP and temporoparietal deterioration suggesting CBS-AD. Consistent with
        histopathological findings, degeneration of the premotor and supplementary
        motor area was evident in all of these different CBS subtypes reflecting a
        common pattern of atrophy in these regions. However, the analysis had a cross-sectional
        design and did not identify topography and dynamics of structural changes
        in individual patients <xref rid=\"pone.0041873-Whitwell1\" ref-type=\"bibr\">[4]</xref>.</p><p>Therefore,
        the novel aspect of our study is the use of DFM which allows the robust detection
        and quantification of individual brain atrophy patterns without predefinition
        of regions of interest. We were able to show the course of atrophy progression
        within short time intervals of only a few months. Only one report exists,
        that used longitudinal voxel-based morphometry analysis in a single, not autopsy
        proven patient, who initially presented with a nonfluent progressive aphasia
        and later on developed atypical clinical signs of a CBS <xref rid=\"pone.0041873-GornoTempini1\"
        ref-type=\"bibr\">[35]</xref>. Interestingly, this patient revealed an akinetic-rigid
        syndrome, dystonia and alien limb phenomenon accompanied by an atrophy spreading
        from the posterior inferior frontal gyrus to insular regions, thalamus, caudate
        nucleus and medial frontal lobe. We also found volume reduction in most of
        these areas. Our results demonstrate highest atrophy rates of up to 15% after
        26 months in the premotor region, particularily in the cases with shorter
        disease duration. This might reflect a phenomenon of slowing neurodegenerative
        processes in later disease stages which has also been shown by neuropathological
        and PET studies in Parkinson\u2019s disease <xref rid=\"pone.0041873-Morrish1\"
        ref-type=\"bibr\">[36]</xref>, <xref rid=\"pone.0041873-Pirker1\" ref-type=\"bibr\">[37]</xref>,
        <xref rid=\"pone.0041873-Fearnley1\" ref-type=\"bibr\">[38]</xref>. In addition,
        we found in all CBS patients a distinct and asymmetric volume loss in the
        substantia nigra, striatum, pallidum, motor thalamic nuclei including anterior
        ventral and anterior lateral nuclei as well as the primary motor cortex. This
        affection of a functionally interconnected motor circuit concurs with neuropathological
        results <xref rid=\"pone.0041873-Mackenzie1\" ref-type=\"bibr\">[12]</xref>
        and also with a deformation tensor imaging study that revealed structural
        changes within parts of the same network including the motor thalamus, the
        caudate head, the supplementary motor area and the pre\u2212/postcentral region
        in CBS patients <xref rid=\"pone.0041873-Erbetta1\" ref-type=\"bibr\">[2]</xref>.
        Therefore, it seems very likely that an anatomically specific network undergoes
        degeneration in CBS, which causes the clinical symptoms.</p><p>In parallel
        with cortical and subcortical atrophy we detected a widening of the ventricles.
        This is in agreement with previously described ventricular volume increase
        in CBS that ranges from 8.3% in CBS-AD to 16.2% per annum in CBS-CBD <xref
        rid=\"pone.0041873-Whitwell2\" ref-type=\"bibr\">[34]</xref>, and with previous
        aging studies in healthy subjects <xref rid=\"pone.0041873-Scahill1\" ref-type=\"bibr\">[39]</xref>,
        <xref rid=\"pone.0041873-Tang1\" ref-type=\"bibr\">[40]</xref>.</p><p>In contrast
        to these regionally localized volume changes in CBS patients, the DFM analysis
        of the entire brain with follow-up periods of 18\u201326 months in healthy
        controls revealed comparatively weak volume alterations, which correspond
        to reported changes during normal aging as shown in cross-sectional studies
        <xref rid=\"pone.0041873-Curiati1\" ref-type=\"bibr\">[41]</xref>.</p><p>All
        of our patients showed major basal ganglia degeneration with affection of
        nigro-striatal regions. It seems plausible that the akinetic-rigid syndrome,
        often combined with a limb dystonia, was caused by this damage. Another prominent
        clinical finding was an ideomotor apraxia of at least one limb in all cases
        as well as an alien limb phenomenon in 5 out of 6 patients, which previously
        has been shown to be associated with affection of the premotor area <xref
        rid=\"pone.0041873-Huey1\" ref-type=\"bibr\">[33]</xref>, <xref rid=\"pone.0041873-Schaefer1\"
        ref-type=\"bibr\">[42]</xref>. A further distinct clinical feature in 4 out
        of 6 patients (case 1, 3, 4, 6) was the manifestation of a cortical sensory
        loss in terms of an astereognosia of the dominantly affected hand. Interestingly,
        these patients demonstrated distinct bilateral atrophy in the somatosensory
        area 3a. The volume reduction was more severe on the contralateral side. Tactile
        object discrimination depends on the conveyance of multiple afferents from
        cutaneous and deep receptors in joints and muscles of an exploring hand. Hierarchical
        somatosensory processing of shape is computed by Brodmann\u2019s areas 3,
        1, 2 and parts of the supramarginal gyrus as well as the intraparietal sulcus
        <xref rid=\"pone.0041873-Bodegard1\" ref-type=\"bibr\">[43]</xref>, <xref
        rid=\"pone.0041873-Hmke1\" ref-type=\"bibr\">[44]</xref>. Areas 3a and 3b
        receive input from muscle stretch receptors and cutaneous mechanoreceptors
        <xref rid=\"pone.0041873-Hmke1\" ref-type=\"bibr\">[44]</xref>. Therefore,
        it is plausible that the present results explain the cortical sensory loss
        in CBS. Communication skills were impaired in 4 patients due to a speech apraxia
        and dysphasia. However, none of the subjects developed a primary progressive
        aphasia which correlates with our findings of an unaffected Broca\u2019s area
        in all of our patients <xref rid=\"pone.0041873-GornoTempini1\" ref-type=\"bibr\">[35]</xref>.
        From human imaging and lesioning-studies it is known that the superior parietal
        cortex plays an important role in visuospatial and attentional processing
        <xref rid=\"pone.0041873-Vandenberghe1\" ref-type=\"bibr\">[45]</xref>. Interestingly,
        the most common neuropsychological impairments in our patients were visuoconstructive
        and attention deficits which might be related to the detected atrophy of the
        area 5 and 7 of the parietal lobe. Three patients further developed mild to
        moderate memory deficits during clinical follow-up examinations, whereby the
        cases 3 and 6 displayed commencing temporal lobe atrophy, possibly due to
        an underlying Alzheimer pathology <xref rid=\"pone.0041873-Whitwell1\" ref-type=\"bibr\">[4]</xref>,
        <xref rid=\"pone.0041873-Zhang1\" ref-type=\"bibr\">[46]</xref>.</p><p>One
        limitation of our study is the missing post-mortem confirmed diagnosis making
        an accurate discrimination of different nosological entities difficult <xref
        rid=\"pone.0041873-Boeve1\" ref-type=\"bibr\">[6]</xref>, <xref rid=\"pone.0041873-Ling1\"
        ref-type=\"bibr\">[7]</xref>, <xref rid=\"pone.0041873-Litvan1\" ref-type=\"bibr\">[8]</xref>,
        <xref rid=\"pone.0041873-Boeve2\" ref-type=\"bibr\">[9]</xref>, <xref rid=\"pone.0041873-Wadia1\"
        ref-type=\"bibr\">[10]</xref>. However, this is an ongoing follow-up study
        with the strength that the clinical features are very accurately documented
        and the course of the illness in the examined patients clearly fits the diagnosis
        of CBS <xref rid=\"pone.0041873-Boeve1\" ref-type=\"bibr\">[6]</xref>, <xref
        rid=\"pone.0041873-Ling1\" ref-type=\"bibr\">[7]</xref>, <xref rid=\"pone.0041873-Wadia1\"
        ref-type=\"bibr\">[10]</xref>, <xref rid=\"pone.0041873-Mahapatra1\" ref-type=\"bibr\">[11]</xref>,
        <xref rid=\"pone.0041873-Shelley1\" ref-type=\"bibr\">[21]</xref>, <xref rid=\"pone.0041873-Mathew1\"
        ref-type=\"bibr\">[22]</xref>, <xref rid=\"pone.0041873-Schneider1\" ref-type=\"bibr\">[47]</xref>.
        Another limitation is that patients were examined with 1.5 or alternatively
        3.0 T MR-scanners. However, the two different imaging types were matched between
        groups. Furthermore, the effect of the different scanners was tested within
        the control group and no significant influence on the measurement of volume
        changes was found.</p><p>In summary, this study shows that longitudinal DFM
        is a powerful image analysis tool that supports the investigation of the course
        of CBS brain pathology in individual patients during short time intervals
        of only a few months, helping to distinguish their temporal gradient of brain
        volume changes from that of healthy aging. DFM may therefore become a sensitive
        biomarker for a more accurate clinical diagnosis even at an early disease
        stage. Additionally, longitudinal DFM studies could become a helpful structural
        imaging method to identify agents that slow, stop, or even reverse the disease
        pathology in CBS and also other neurodegenerative disorders involving the
        central nervous system.</p></sec><sec sec-type=\"supplementary-material\"
