        id=\"nt101\"><label/><p>Abbreviations: MMSE \u200A=\u200A Mini Mental State
        Examination, MDRS \u200A=\u200A Mattis Dementia Rating Scale, MRI \u200A=\u200A
        Magnetic resonance imaging, n.d. \u200A=\u200A not done, UPDRS-III \u200A=\u200A
        Unified Parkinson\u2019s Disease Rating Scale part III, FT \u200A=\u200A Finger
        tapping, le \u200A=\u200A left, ri \u200A=\u200A right, f \u200A=\u200A female,
        m \u200A=\u200A male, T initial \u200A=\u200A initial examination, T final
        \u200A=\u200A final examination, \u2212 \u200A=\u200A absent, + \u200A=\u200A
        present.</p></fn></table-wrap-foot></table-wrap></sec><sec sec-type=\"methods\"
        id=\"s2\"><title>Methods</title><p>A sample of six patients with the clinical
        diagnosis of CBS attending the Movement Disorder Centre of the University
        Hospital D\xFCsseldorf was prospectively recruited. At the time point of study
        inclusion (T initial) all patients underwent detailed neurological examination
        (including testing of the autonomic nervous system and formal psychometry
        using Florida Apraxia Screening Test (FAST) <xref rid=\"pone.0041873-Rothi1\"
        ref-type=\"bibr\">[17]</xref>, Mattis Dementia Rating Scale (MDRS) <xref rid=\"pone.0041873-Mattis1\"
        ref-type=\"bibr\">[18]</xref>, Mini Mental State Examination (MMSE) <xref
        rid=\"pone.0041873-Folstein1\" ref-type=\"bibr\">[19]</xref>), routine laboratory
        tests, and volumetric as well as diagnostic magnetic resonance brain imaging
        to exclude symptomatic parkinsonism during hospitalization over a time period
        of 5\u20138 days. Additionally, the Unified Parkinson Disease Rating Scale
        part III (UPDRS-III) was determined 12 hours after discontinuation of antiparkinsonian
        medication and after oral administration of 250 mg L-Dopa <xref rid=\"pone.0041873-Movement1\"
        ref-type=\"bibr\">[20]</xref>. Furthermore, one minute of finger tapping (FT)
        was performed with the left and right forefinger; subjects were required to
        alternatingly press specific counting devices which were fixed on a board
        as rapidly as possible. In addition, all patients underwent clinical and MRI
        follow-up examinations performed on the same day during the course of 20.7\xB15
        months (4\u20138 serial MRIs). In most cases, intervals between consecutive
        scans were about three to four months. Final diagnosis of CBS was made in
        a consensus panel arrangement by two movement disorder specialists (A.S.,
        M.S.), taking into consideration data of carefully assessed longitudinal neurologic
        follow-up examinations, possible response to dopaminergic treatment, diagnostic
        MRI and published clinical criteria <xref rid=\"pone.0041873-Boeve1\" ref-type=\"bibr\">[6]</xref>,
        <xref rid=\"pone.0041873-Shelley1\" ref-type=\"bibr\">[21]</xref>, <xref rid=\"pone.0041873-Mathew1\"
        ref-type=\"bibr\">[22]</xref>. No subjects were excluded from the study, but
        two follow-up scans were discarded from further analysis due to movement artefacts.</p><table-wrap
