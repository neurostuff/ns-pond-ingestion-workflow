      string: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"institution":[{"name":"bioRxiv"}],"indexed":{"date-parts":[[2026,1,15]],"date-time":"2026-01-15T16:45:06Z","timestamp":1768495506708,"version":"3.49.0"},"posted":{"date-parts":[[2021,6,7]]},"group-title":"Bioengineering","reference-count":37,"publisher":"openRxiv","content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"accepted":{"date-parts":[[2021,6,7]]},"abstract":"<jats:title>Abstract<\/jats:title>\n                <jats:p>The
        mechanics of collageneous soft tissues, such as skin, are sensitive to heat.
        Thus, quantifying and modeling thermo-mechanical coupling of skin is critical
        to our understanding of skin\u2019s physiology, pathophysiology, as well as
        its treatment. However, key gaps persist in our knowledge about skin\u2019s
        coupled thermo-mechanics. Among them, we haven\u2019t quantified the role
        of skin\u2019s microstructural organization in its response to superphysiological
        loading. To fill this gap, we conducted a comprehensive set of experiments
        in which we combined biaxial mechanical testing with histology and two-photon
        imaging under liquid heat treatment. Among other observations, we found that
        unconstrained skin, when exposed to high temperatures, shrinks anisotropically
        with the principle direction of shrinkage being aligned with collagen\u2019s
        principle orientation. Additionally, we found that when skin is isometrically
        constrained, it produces significant forces during denaturing that are also
        anisotropic. Finally, we found that denaturation significantly alters the
        mechanical behavior of skin. For short exposure times, this alteration is
        reflected in a reduction of stiffness at high strains. At long exposure times,
        the tissue softened to a point where it became untestable. We supplemented
        our findings with confirmation of collagen denaturation in skin via loss of
        birefringence and second harmonic generation. Finally, we captured all time-,
        temperature-, and direction-dependent experimental findings in a hypothetical
        model. Thus, this work fills a fundamental gap in our current understanding
        of skin thermo-mechanics and will support future developments in thermal injury
        prevention, thermal injury management, and thermal therapeutics of skin.<\/jats:p>","DOI":"10.1101\/2021.06.04.447116","type":"posted-content","created":{"date-parts":[[2021,6,7]],"date-time":"2021-06-07T11:51:04Z","timestamp":1623066664000},"source":"Crossref","is-referenced-by-count":1,"title":["The
