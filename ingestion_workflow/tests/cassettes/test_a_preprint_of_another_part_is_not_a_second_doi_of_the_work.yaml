  response:
    body:
      string: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"institution":[{"name":"bioRxiv"}],"indexed":{"date-parts":[[2026,1,15]],"date-time":"2026-01-15T16:22:28Z","timestamp":1768494148966,"version":"3.49.0"},"posted":{"date-parts":[[2021,6,6]]},"group-title":"Biophysics","reference-count":42,"publisher":"openRxiv","content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"accepted":{"date-parts":[[2021,6,6]]},"abstract":"<jats:title>Abstract<\/jats:title>\n                <jats:p>Understanding
        the response of skin to superphysiological temperatures is critical to the
        diagnosis and prognosis of thermal injuries, and to the development of temperature-based
        medical therapeutics. Unfortunately, this understanding has been hindered
        by our incomplete knowledge about the nonlinear coupling between skin temperature
        and its mechanics. In Part I of this study we experimentally demonstrated
        a complex interdependence of time, temperature, direction, and load in skin\u2019s
        response to superphysiological temperatures. In Part II of our study, we test
        two different models of skin\u2019s thermo-mechanics to explain our observations.
        In both models we assume that skin\u2019s response to superphysiological temperatures
        is governed by the denaturation of its highly collageneous microstructure.
        Thus, we capture skin\u2019s native mechanics via a microstructurally-motivated
        strain energy function which includes probability distributions for collagen
        fiber orientation and waviness. In the first model, we capture skin\u2019s
        response to superphysiological temperatures as a transition between two states
        that link the kinetics of collagen fiber denaturation to fiber coiling and
        to the transformation of each fiber\u2019s constitutive behavior from purely
        elastic to viscoelastic. In the second model, we capture skin\u2019s response
        to super-physiological temperatures instead via three states in which a sequence
        of two reactions link the kinetics of collagen fiber denaturation to fiber
        coiling, followed by a state of fiber damage. Given the success of both models
        in qualitatively capturing our observations, we expect that our work will
        provide guidance for future experiments that could probe each model\u2019s
        assumptions toward a better understanding of skin\u2019s coupled thermo-mechanics
        and that our work will be used to guide the engineering design of heat treatment
        therapies.<\/jats:p>","DOI":"10.1101\/2021.06.04.447120","type":"posted-content","created":{"date-parts":[[2021,6,6]],"date-time":"2021-06-06T23:50:24Z","timestamp":1623023424000},"source":"Crossref","is-referenced-by-count":0,"title":["The
