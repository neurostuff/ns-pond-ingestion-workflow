# Composed: vLLM behind a key gate answers a key it did not issue with
# a 401, which cannot be recorded without a gated server.
interactions:
- request:
    body: null
    headers:
      accept:
      - application/json
      content-type:
      - application/json
      host:
      - prose.test
    method: POST
    uri: http://prose.test/v1/chat/completions
  response:
    body:
      string: '{"error": {"message": "Incorrect API key provided.", "type": "invalid_request_error", "param": null, "code": "invalid_api_key"}}'
    headers:
      content-type:
      - application/json
    status:
      code: 401
      message: Unauthorized
version: 1
