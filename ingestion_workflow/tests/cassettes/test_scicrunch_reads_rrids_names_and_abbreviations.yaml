        neuroanatomy resource"},{"keyword":"nervous system"},{"keyword":"adult"},{"keyword":"murine"}],"synonyms":[{"name":""}],"name":"NeuroMouse
        Database","description":"THIS RESOURCE IS NO LONGER IN SERVICE. Documented
        on February 17, 2023.Toolbook(tm) based, interactive graphical database which
        provides structural, molecular, and genetic information on the adult murine
        nervous system; and its relevance to human neurobiology. This resource is
        primarily designed as a platform for users to interact, each sharing knowledge
        on their own area of expertise, which is compiled to a master database. This
        hypertext atlas presently comprises more than 1000 pages and is designed to
        provide a flexible integrated resource for the description and discussion
        of all forms mammalian neurologic data. Version 4.0 of the NeuroMouse program
        extends the program''s basic framework to include a number of areas in modern
        molecular neurobiology. This system provides an integrated resource for the
        characterization and description of mammalian neurological data. Major divisions
        include: Neural Atlas, Molecular Atlas, Genetics/Surgical Lesion Atlas. Neuromouse
        has been integrated into our strain-specific three dimensional MRI and surgical
        atlases of the murine CNS. Database contents: Neural Atlas: - Rotational representation
        of the murine brain. - Neural structures: visual and alphabetic point and
        click index of neural structures, pathways and systems. - Brain atlas:photographic
        serial sections in the coronal, sagittal, and horizontal planes (average plate
        distance - 300 um). Physical brain distances are also provided as are meta-index
        grids to allow rapid movement between different planes and regions. # Catalog
        of primary and immortalized neural cells indexed to relevant neural structures.
        Molecular Atlas: - Index of neurotransmitters: Acetylcholine, GABA, Glutamate,
        Aspartate, Glycine, Dopamine, Norepinephrine, Epinephrine, Serotonin (synthesis,
        distribution, degradation, molecular modules, receptors, subunits, agonists,
        antagonists, gene structure, localization, physical properties and transgenics
        are indicated for each item). - Index of neurotrophins / neurokines: NGF,
        BDNF, NT-3, NT-4/5, CNTF, LIF, Onostain M, IL-6, GDNF, FGF''s, S100b (ligand,
        receptors, expression pattern, physical properties, homologous factors, transgenics/knockouts,
        chromosomal location, effects of agent, and effects of factors on agent are
        indicated for each item). - Index of additional neural agents: Bcl-2, TNF/Fas,
        TGF-beta, P53/Rb, PDGF, EGF family (ligand, receptor, expression patterns,
        physical properties, homologous factors, transgenics/ knockouts, chromosomal
        location, effects of agent, effects of factors on agent are indicated for
        each item). - Molecular biology: Molecular biology of important neural genes
        with integrated l links, plus selected neural topics (ex. programmed cell
        death, inducible gene systems, protein motifs, neural gene elements, and selected
        signal transduction pathways). Genetics Atlas: - Lesion paradigms: Index of
        common neuronal structural and chemical lesion paradigms. - Selected procedures:
        description of common neurosurgical, cell tracing, culturing and laboratory
        procedures. - Neurologic syndromes: Index of important human neurologic syndromes
        and appropriate animals models. - Neural mutant database: Index and description
        of naturally occurring and genetically modified murine neurologic mutations;
        including pages on double knockout animals. Interactive maps of each murine
        chromosome and human syntenic maps.","abbreviations":[{"name":"NeuroMouse"}]}},"sort":["scr_001143"]},{"_index":"scr_005400-registry_resources_dev-rin-2025feb05","_type":"rin","_id":"rrid:scr_001145","_score":null,"_source":{"item":{"identifier":"SCR_001145","types":[{"name":"atlas","type":"category"},{"name":"data
