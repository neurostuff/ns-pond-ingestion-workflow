        by Highly Oriented Research Center for Neuroinformatics"}],"name":"THOR Center
        for Neuroinformatics","description":"THIS RESOURCE IS NO LONGER IN SERVICE.
        Documented on September 23,2022.Center hosting a number of related projects
        concerning neural networks, functional neuroimaging, multimedia signal processing,
        and biomedical signal processing. Neuroinformatics is a research field rooted
        in classical disciplines like signal processing, biology, physics, computer
        science and engineering. Neuroinformatics combines learning from the brain
        and learning about the brain. By studying information processing in the brain
        neuroinformatics invents new computing paradigms (e.g., artificial neural
        networks) with the objective of understanding the dynamics of the conscious
        mind. Artificial neural networks is an active neuroinformatics research field,
        which combines many approaches to adaptive signal processing in solving real
        world problems. They began using neural networks for general nonlinear adaptive
        signal processing. Since 1991 the CONNECT groups have participated in the
        development of neural computing as an advanced, non-linear statistical tool,
        which has been applied to forecasting within dynamical systems, pattern recognition,
        and medical image analysis, particularly functional neuroimages. While neural
        computing has largely been viewed as a black box approach, they have initiated
        research aimed at opening this black box, using hypertext, multimedia, and
        interactivity. Their key objective is to convert abstract models into intuitive
        knowledge through interactive visualization.","abbreviations":[{"name":"THOR
        Center"}]}},"sort":["scr_001400"]}]}}'
