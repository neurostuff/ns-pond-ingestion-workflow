        Probabilistic Atlas","description":"Vervet (Chlorocebus aethiops sabaeus)
        probabilistic atlas that defines an anatomical space (template) with associated
        tissue and regional prior probability maps. The atlas was produced from whole
        head MRI of 10 normal adult animal subjects. The package consists of two atlases.
        The Biased directory contains the average template and probabilistic atlases
