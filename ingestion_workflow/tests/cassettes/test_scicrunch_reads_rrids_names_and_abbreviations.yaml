        Research And Integrative Neuroscience Network"}],"name":"BRAINnet-Brain Research
        And Integrative Neuroscience Network","description":"A neuroscience network
        providing access to a database of brain, cognitive, genomic and clinical data
        for research and scientific publication. Data include genomic information,
        electrical measures of brain and body function, structural and functional
        MRI, and cognitive and medical history. All data are collected using a standardized
