        at UCLA"},{"name":"Center for Computational Biology"}],"name":"Center for
        Computational Biology at UCLA","description":"THIS RESOURCE IS NO LONGER IN
        SERVICE. Documented on August 31, 2022. Center focused on the development
        of computational biological atlases of different populations, subjects, modalities,
        and spatio-temporal scales with 3 types of resources: (1) Stand-alone computational
        software tools (image and volume processing, analysis, visualization, graphical
        workflow environments). (2) Infrastructure Resources (Databases, computational
        Grid, services). (3) Web-services (web-accessible resources for processing,
        validation and exploration of multimodal/multichannel data including clinical
        data, imaging data, genetics data and phenotypic data). The CCB develops novel
        mathematical, computational, and engineering approaches to map biological
        form and function in health and disease. CCB computational tools integrate
        neuroimaging, genetic, clinical, and other relevant data to enable the detailed
        exploration of distinct spatial and temporal biological characteristics. Generalizable
        mathematical approaches are developed and deployed using Grid computing to
        create practical biological atlases that describe spatiotemporal change in
        biological systems. The efforts of CCB make possible discovery-oriented science
        and the accumulation of new biological knowledge. The Center has been divided
        into cores organized as follows: - Core 1 is focused on mathematical and computational
        research. Core 2 is involved in the development of tools to be used by Core
        3. Core 3 is composed of the driving biological projects; Mapping Genomic
        Function, Mapping Biological Structure, and Mapping Brain Phenotype. - Cores
        4 - 7 provide the infrastructure for joint structure within the Center as
        well as the development of new approaches and procedures to augment the research
        and development of Cores 1-3. These cores are: (4)Infrastructure and Resources,
        (5) Education and Training, (6) Dissemination, and (7) Administration and
        Management. The main focus of the CCB is on the brain, and specifically on
        neuroimaging. This area has a long tradition of sophisticated mathematical
        and computational techniques. Nevertheless, new developments in related areas
        of mathematics and computational science have emerged in recent years, some
        from related application areas such as Computer Graphics, Computer Vision,
        and Image Processing, as well as from Computational Mathematics and the Computational
        Sciences. We are confident that many of these ideas can be applied beneficially
        to neuroimaging.","abbreviations":[{"name":"CCB"},{"name":"UCLA CCB"},{"name":"USC
        CCB"}]}},"sort":["scr_000334"]},{"_index":"scr_005400-registry_resources_dev-rin-2025feb05","_type":"rin","_id":"rrid:scr_000419","_score":null,"_source":{"item":{"identifier":"SCR_000419","types":[{"name":"data
