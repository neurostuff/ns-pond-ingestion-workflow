        Network - Collaborative Informatics and Neuroimaging Suite"},{"name":"Collaborative
        Informatics Neuroimaging Suite"},{"name":"Collaborative Informatics and Neuroimaging
        Suite"}],"name":"Mind Research Network - COINS","description":"A web-based
        neuroimaging and neuropsychology software suite that offers versatile, automatable
        data upload/import/entry options, rapid and secure sharing of data among PIs,
        querying and export all data, real-time reporting, and HIPAA and IRB compliant
        study-management tools suitable to large institutions as well as smaller scale
        neuroscience and neuropsychology researchers. COINS manages over over 400
        studies, more than 265,000 clinical neuropsychological assessments, and 26,000
        MRI, EEG, and MEG scan sessions collected from 18,000 participants at over
        ten institutions on topics related to the brain and behavior. As neuroimaging
        research continues to grow, dynamic neuroinformatics systems are necessary
        to store, retrieve, mine and share the massive amounts of data. The Collaborative
        Informatics and Neuroimaging Suite (COINS) has been created to facilitate
        communication and cultivate a data community. This tool suite offers versatile
        data upload/import/entry options, rapid and secure sharing of data among PIs,
        querying of data types and assessments, real-time reporting, and study-management
        tools suitable to large institutions as well as smaller scale researchers.
        It manages studies and their data at the Mind Research Network, the Nathan
        Kline Institute, University of Colorado Boulder, the Olin Neuropsychiatry
        Research Center (at) Hartford Hospital, and others. COINS is dynamic and evolves
        as the neuroimaging field grows. COINS consists of the following collaboration-centric
        tools: * Subject and Study Management: MICIS (Medical Imaging Computer Information
        System) is a centralized PostgreSQL-based web application that implements
        best practices for participant enrollment and management. Research site administrators
        can easily create and manage studies, as well as generate reports useful for
        reporting to funding agencies. * Scan Data Collection: An automated DICOM
        receiver collects, archives, and imports imaging data into the file system
        and COINS, requiring no user intervention. The database also offers scan annotation
        and behavioral data management, radiology review event reports, and scan time
        billing. * Assessment Data Collection: Clinical data gathered from interviews,
        questionnaires, and neuropsychological tests are entered into COINS through
        the web application called Assessment Manager (ASMT). ASMT''s intuitive design
        allows users to start data collection with little or no training. ASMT offers
        several options for data collection/entry: dual data entry, for paper assessments,
        the Participant Portal, an online tool that allows subjects to fill out questionnaires,
        and Tablet entry, an offline data entry tool. * Data Sharing: De-identified
        neuroimaging datasets with associated clinical-data, cognitive-data, and associated
        meta-data are available through the COINS Data Exchange tool. The Data Exchange
        is an interface that allows investigators to request and share data. It also
        tracks data requests and keeps an inventory of data that has already been
        shared between users. Once requests for data have been approved, investigators
        can download the data directly from COINS.","abbreviations":[{"name":"COINS"}]}},"sort":["scr_000805"]},{"_index":"scr_005400-registry_resources_dev-rin-2025feb05","_type":"rin","_id":"rrid:scr_001143","_score":null,"_source":{"item":{"identifier":"SCR_001143","types":[{"name":"atlas","type":"category"},{"name":"data
