        Subject Database"},{"name":"ICBM - International Consortium for Brain Mapping"},{"name":"International
        Consortium for Brain Mapping (ICBM)"},{"name":"ICBM Atlas"}],"name":"International
        Consortium for Brain Mapping","description":"Probabilistic reference system
        for human brain, including tools to establish this reference system for structural
        and functional anatomy on both macroscopic (in vivo) and microscopic (post
        mortem) levels. Project has expanded neuroinformatics tools for data sharing
        and created Conforming Site System that allows laboratories worldwide to contribute
        data to evolving atlas. Through implementation of ICBM data sharing policy
        space, they are fostering data exchange while still providing for scientific
        credit assignment and subject confidentiality.ICBM atlas collection consists
        of ICBM Template,  tool developed to provide reference that includes both
        set of coordinates and associated anatomical labels; the ICBM 452 T1 atlas,
        average of T1-weighted MRIs of normal young adult brains, ICBM probabilistic
        atlases, and Cytoarchitectonic Atlas. ICBM Subject Database is web-based database
