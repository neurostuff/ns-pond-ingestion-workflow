        biology"},{"keyword":"magnetic resonance imaging"},{"keyword":"mouse"},{"keyword":"development"},{"keyword":"newborn
        mouse"},{"keyword":"embryonic mouse"},{"keyword":"stage of development"},{"keyword":"magnetic
        resonance microscopy"}],"synonyms":[{"name":"MRI Embryos"}],"name":"Magnetic
        Resonance Microscopy of Mouse Embryo Specimens","description":"THIS RESOURCE
        IS NO LONGER IN SERVICE, documented on February 14, 2013. A multidimensional,
        digital atlas based on magnetic resonance images of normal mouse embryos from
        9.5 days after conception (E9) to the newborn (P0). The images include surface
        views and cross-sectional views from the transverse, coronal, and sagittal
        planes for each embryo. Several movies have also been included to demonstrate
        growth of the embryos and to present a variety of visualization tools available
        for studying and documenting embryonic anatomy. These images are organized
        as a reference for educators and researchers who want to understand better
        the embryological anatomy of their own specimens and to understand how their
        images relate to the whole embryo at many stages of development.","abbreviations":[{"name":""}]}},"sort":["scr_001145"]},{"_index":"scr_005400-registry_resources_dev-rin-2025feb05","_type":"rin","_id":"rrid:scr_001226","_score":null,"_source":{"item":{"identifier":"SCR_001226","types":[{"name":"blog","type":"category"},{"name":"data
