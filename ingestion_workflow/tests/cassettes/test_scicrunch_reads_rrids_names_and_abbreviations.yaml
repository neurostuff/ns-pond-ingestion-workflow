        pathway"},{"keyword":"bio.tools"}],"synonyms":[{"name":""}],"name":"AETIONOMY","description":"Consortium
        founded to establish mechanism-based taxonomies for Alzheimer''s and Parkinson''s
        disease and other neurodegenerative disorders (NDD), with the goal of facilitating
        development of more effective and targeted treatments. To do this, the consortium
        collects and analyzes data to: * Create new ways to combine underutilized
        data currently available in the literature, public databases, and from private
        companies * Determine how to dynamically organize and structure different
        types of knowledge about NDD * Determine how to apply this knowledge to construct
        new patient group classification * Identify correlations between disease features
        at molecular, tissue or organ-specific, and clinical levels * Identify sub-groups
        of patients based on the molecular cause of their disease, as opposed to the
        nature and location of their symptoms * Deliver data, tools, and recommendations
        for the biomedical community in the treatment of NDD A mechanism-based taxonomy
        is hoped to advance the: # Description and organization of the indication-specific
        data # Linking of data to disease models, based on causal and correlative
        relationships The expected outcome of AETIONOMY is a new NDD taxonomy system
        that distinguishes mixed pathologies, allowing for new features or classes
        to be added into the taxonomy, all with the goal of aiding drug and biomarker
        discovery.","abbreviations":[{"name":"AETIONOMY"}]}},"sort":["scr_000232"]},{"_index":"scr_005400-registry_resources_dev-rin-2025feb05","_type":"rin","_id":"rrid:scr_000334","_score":null,"_source":{"item":{"identifier":"SCR_000334","types":[{"name":"data
