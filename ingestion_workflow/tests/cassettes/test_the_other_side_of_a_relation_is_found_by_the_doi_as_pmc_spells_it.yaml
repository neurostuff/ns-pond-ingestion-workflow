      string: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"indexed":{"date-parts":[[2026,6,4]],"date-time":"2026-06-04T02:25:46Z","timestamp":1780539946399,"version":"3.54.1"},"reference-count":56,"publisher":"MIT
        Press","license":[{"start":{"date-parts":[[2025,10,24]],"date-time":"2025-10-24T00:00:00Z","timestamp":1761264000000},"content-version":"vor","delay-in-days":296,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":["direct.mit.edu"],"crossmark-restriction":true},"short-container-title":[],"published-print":{"date-parts":[[2025,11,12]]},"abstract":"<jats:title>Abstract<\/jats:title>\n                  <jats:p>The
        thalamus, traditionally viewed as a sensory relay station, is now recognized
        for its critical role in higher-order cognitive functions, including memory.
        While most research has focused on its distinct nuclei, the thalamus also
        contains crucial white matter tracts, such as the mammillothalamic tract (MTT),
        part of the Papez circuit. Despite its established role in memory, the MTT
        remains underappreciated in studies on the cognitive role of the thalamus,
        increasing the risk of misattributing memory functions to nearby thalamic
        nuclei. This study investigates the memory impact of thalamic strokes by considering
        disruption to the MTT. We examined 40 patients with chronic ischemic thalamic
        lesions and 45 healthy controls using neuropsychological assessments, focusing
        on the Free and Cued Selective Reminding Test (FCSRT) and high-resolution
        structural neuroimaging. Advanced imaging techniques, such as symptom mapping
        and disconnectome analyses, were employed to analyze the relationships between
        lesion sites, tract disconnections, and cognitive outcomes. Additionally,
        the expression of calbindin-rich matrix cells and parvalbumin-rich core cells
        was examined to assess how the connectivity property of thalamic cells, and
        its disruption, can relate to cognitive deficits following a thalamic stroke.
        Patients with left-sided thalamic lesions, especially those involving the
        MTT, showed significant memory impairments. Symptom mapping identified a specific
        cluster of lesioned voxels in the left anterior-lateral thalamus, including
        the MTT, as being strongly associated with poorer memory performance. Disconnectome
        analysis confirmed that verbal memory deficits were associated with disruption
        of the MTT. Furthermore, a striking overlap was observed between the critical
        regions linked to memory deficits and calbindin-rich thalamic areas. However,
        this calbindin-rich region was also disrupted in patients without memory impairment,
        revealing that MTT disruption, and not lesions to this region, induced memory
        deficits in these patients. The identified FCSRT deficit cluster overlapped
        with brain regions consistently linked to memory processes following fMRI
        meta-analytic mapping of memory-related keywords. These findings challenge
        the traditional focus on thalamic nuclei and connector hubs, indicating a
        need to reappraise the importance of the MTT in memory impairment after a
        thalamic stroke. This study advocates for a shift in thalamic research, emphasizing
        the need to investigate tract-specific contributions and disruptions of the
        MTT but also of other tracts such as the interthalamic adhesion or amygdalofugal
        pathway, rather than holding only to a \u201cnuclei-centric\u201d view of
        the thalamus.<\/jats:p>","DOI":"10.1162\/imag.a.1007","type":"journal-article","created":{"date-parts":[[2025,10,24]],"date-time":"2025-10-24T20:02:19Z","timestamp":1761336139000},"update-policy":"https:\/\/doi.org\/10.1162\/mitpressjournals.corrections.policy","source":"Crossref","is-referenced-by-count":1,"title":["A
