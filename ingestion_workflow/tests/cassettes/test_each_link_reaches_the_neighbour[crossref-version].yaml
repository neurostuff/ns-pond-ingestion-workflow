    body:
      string: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"institution":[{"name":"bioRxiv"}],"indexed":{"date-parts":[[2026,2,27]],"date-time":"2026-02-27T01:39:30Z","timestamp":1772156370917,"version":"3.50.1"},"posted":{"date-parts":[[2023,9,27]]},"group-title":"Neuroscience","reference-count":88,"publisher":"openRxiv","content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"accepted":{"date-parts":[[2023,11,13]]},"abstract":"<jats:title>Abstract<\/jats:title>\n                <jats:p>\n                  Abnormal
        cellular and circuit excitability is believed to drive many core phenotypes
        in fragile X syndrome (FXS). The dentate gyrus is a brain area performing
        critical computations essential for learning and memory. However, little is
        known about dentate circuit defects and their mechanisms in FXS. Understanding
        dentate circuit dysfunction in FXS has been complicated by the presence of
        two types of excitatory neurons, the granule cells and mossy cells. Here we
        report that loss of FMRP markedly decreased excitability of dentate mossy
        cells, a change opposite to all other known excitability defects in excitatory
        neurons in FXS. This mossy cell hypo-excitability is caused by increased Kv7
        function in\n                  <jats:italic>Fmr1<\/jats:italic>\n                  KO
        mice. By reducing the excitatory drive onto local hilar interneurons, hypo-excitability
        of mossy cells results in increased excitation\/inhibition ratio in granule
        cells and thus paradoxically leads to excessive dentate output. Circuit-wide
        inhibition of Kv7 channels in\n                  <jats:italic>Fmr1<\/jats:italic>\n                  KO
        mice increases inhibitory drive onto granule cells and normalizes the dentate
        output in response to physiologically relevant theta-gamma coupling stimulation.
        Our study suggests that circuit-based interventions may provide a promising
        strategy in this disorder to bypass irreconcilable excitability defects in
        different cell types and restore their pathophysiological consequences at
        the circuit level.\n                <\/jats:p>","DOI":"10.1101\/2023.09.27.559792","type":"posted-content","created":{"date-parts":[[2023,9,27]],"date-time":"2023-09-27T21:15:27Z","timestamp":1695849327000},"source":"Crossref","is-referenced-by-count":0,"title":["Circuit-based
        intervention corrects excessive dentate gyrus output in the Fragile X mouse
