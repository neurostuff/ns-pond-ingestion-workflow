  response:
    body:
      string: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"institution":[{"name":"bioRxiv"}],"indexed":{"date-parts":[[2026,1,17]],"date-time":"2026-01-17T20:32:55Z","timestamp":1768681975469,"version":"3.49.0"},"posted":{"date-parts":[[2024,1,12]]},"group-title":"Neuroscience","reference-count":116,"publisher":"openRxiv","content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"accepted":{"date-parts":[[2024,1,12]]},"abstract":"<jats:title>Abstract<\/jats:title>\n                <jats:p>Microsaccades\u2013tiny
        fixational eye movements\u2013 improve discriminability in high acuity tasks
        in the foveola. To investigate whether they help compensate for low discriminability
        at perifovea, we examined MS characteristics relative to the adult visual
        performance field, which is characterized by two perceptual asymmetries: Horizontal-Vertical
        Anisotropy (better discrimination along the horizontal than vertical meridian),
        and Vertical Meridian Asymmetry (better discrimination along the lower-than
        upper-vertical meridian). We investigated whether and to what extent microsaccade
        directionality varies when stimuli are at isoeccentric locations along the
        cardinals under conditions of heterogeneous discriminability (Experiment 1)
        and homogeneous discriminability, equated by adjusting stimulus contrast (Experiment
        2). Participants performed a two-alternative forced-choice orientation discrimination
        task. In both experiments, performance was better on trials without microsaccades
        between ready signal onset and stimulus offset than on trials with microsaccades.
        Across the trial sequence the microsaccade rate and directional pattern were
        similar across locations. Our results indicate that microsaccades were similar
        regardless of stimulus discriminability and target location, except during
        the response period\u2013once the stimuli were no longer present and target
        location no longer uncertain\u2013when microsaccades were biased toward the
        target location. Thus, this study reveals that microsaccades do not flexibly
        adapt as a function of varying discriminability in a basic visual task around
        the visual field.<\/jats:p>","DOI":"10.1101\/2024.01.11.575288","type":"posted-content","created":{"date-parts":[[2024,1,13]],"date-time":"2024-01-13T00:15:12Z","timestamp":1705104912000},"source":"Crossref","is-referenced-by-count":0,"title":["Do
