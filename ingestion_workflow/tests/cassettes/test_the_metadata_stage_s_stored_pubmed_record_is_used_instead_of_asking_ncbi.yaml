        and gender are associated with human behavior throughout the lifespan and
        across health and disease, but whether they are associated with similar or
        distinct neural phenotypes is unknown. Here, we demonstrate that, in children,
        sex and gender are uniquely reflected in the intrinsic functional connectivity
        of the brain. Unimodal networks are more strongly associated with sex while
        heteromodal networks are more strongly associated with gender. These results
        suggest sex and gender are irreducible to one another not only in society
        but also in biology.<\/jats:p>","DOI":"10.1101\/2023.11.12.566592","type":"posted-content","created":{"date-parts":[[2023,11,15]],"date-time":"2023-11-15T17:55:16Z","timestamp":1700070916000},"source":"Crossref","is-referenced-by-count":0,"title":["Functional
