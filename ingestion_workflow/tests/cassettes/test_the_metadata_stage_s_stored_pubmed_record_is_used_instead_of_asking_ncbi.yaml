        Adv."],"published-print":{"date-parts":[[2024,7,12]]},"abstract":"<jats:p>Sex
        and gender are associated with human behavior throughout the life span and
        across health and disease, but whether they are associated with similar or
        distinct neural phenotypes is unknown. Here, we demonstrate that, in children,
        sex and gender are uniquely reflected in the intrinsic functional connectivity
        of the brain. Somatomotor, visual, control, and limbic networks are preferentially
        associated with sex, while network correlates of gender are more distributed
        throughout the cortex. These results suggest that sex and gender are irreducible
        to one another not only in society but also in biology.<\/jats:p>","DOI":"10.1126\/sciadv.adn4202","type":"journal-article","created":{"date-parts":[[2024,7,12]],"date-time":"2024-07-12T13:59:05Z","timestamp":1720792745000},"update-policy":"https:\/\/doi.org\/10.34133\/aaas_crossmark","source":"Crossref","is-referenced-by-count":47,"title":["Functional
