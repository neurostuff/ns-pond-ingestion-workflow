      string: '[{"paperId": "a8ebeaf273b0dbcfc2621554ad9a2a3811c8715e", "title": "Neuroticism
        modulates brain visuo\u2010vestibular and anxiety systems during a virtual
        rollercoaster task", "venue": "Human Brain Mapping", "year": 2016, "isOpenAccess":
        true, "openAccessPdf": {"url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/hbm.23411",
        "status": "HYBRID", "license": "CCBYNCND", "disclaimer": "Notice: Paper or
        abstract available at https://pmc.ncbi.nlm.nih.gov/articles/PMC6866907, which
        is subject to the license by the author or copyright owner provided with this
        content. Please go to the source to verify the license and copyright information
        for your use."}, "publicationDate": "2016-09-28", "authors": [{"authorId":
        "2926164", "name": "R. Riccelli"}, {"authorId": "35149192", "name": "I. Indovina"},
        {"authorId": "4660897", "name": "Jeffrey P. Staab"}, {"authorId": "51375213",
        "name": "S. Nigro"}, {"authorId": "2914598", "name": "A. Augimeri"}, {"authorId":
        "145526369", "name": "F. Lacquaniti"}, {"authorId": "2946383", "name": "L.
        Passamonti"}], "abstract": "Different lines of research suggest that anxiety\u2010related
        personality traits may influence the visual and vestibular control of balance,
        although the brain mechanisms underlying this effect remain unclear. To our
        knowledge, this is the first functional magnetic resonance imaging (fMRI)
        study that investigates how individual differences in neuroticism and introversion,
        two key personality traits linked to anxiety, modulate brain regional responses
        and functional connectivity patterns during a fMRI task simulating self\u2010motion.
        Twenty\u2010four healthy individuals with variable levels of neuroticism and
        introversion underwent fMRI while performing a virtual reality rollercoaster
        task that included two main types of trials: (1) trials simulating downward
        or upward self\u2010motion (vertical motion), and (2) trials simulating self\u2010motion
        in horizontal planes (horizontal motion). Regional brain activity and functional
        connectivity patterns when comparing vertical versus horizontal motion trials
        were correlated with personality traits of the Five Factor Model (i.e., neuroticism,
        extraversion\u2010introversion, openness, agreeableness, and conscientiousness).
        When comparing vertical to horizontal motion trials, we found a positive correlation
        between neuroticism scores and regional activity in the left parieto\u2010insular
        vestibular cortex (PIVC). For the same contrast, increased functional connectivity
        between the left PIVC and right amygdala was also detected as a function of
        higher neuroticism scores. Together, these findings provide new evidence that
        individual differences in personality traits linked to anxiety are significantly
        associated with changes in the activity and functional connectivity patterns
        within visuo\u2010vestibular and anxiety\u2010related systems during simulated
        vertical self\u2010motion. Hum Brain Mapp 38:715\u2013726, 2017. \u00a9 2016
        The Authors Human Brain Mapping Published by Wiley Periodicals, Inc."}]

        '
