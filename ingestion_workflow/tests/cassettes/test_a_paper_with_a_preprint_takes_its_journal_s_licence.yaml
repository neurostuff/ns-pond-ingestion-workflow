    body:
      string: '[{"paperId": "cbcdf6864cc8a7b569775642037d112066d326d5", "title": "Direct
        visualization and characterization of the human zona incerta and surrounding
        structures", "venue": "bioRxiv", "year": 2020, "isOpenAccess": true, "openAccessPdf":
        {"url": "https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/hbm.25137",
        "status": "GOLD", "license": "CCBY", "disclaimer": "Notice: Paper or abstract
        available at https://pmc.ncbi.nlm.nih.gov/articles/PMC7555067, which is subject
        to the license by the author or copyright owner provided with this content.
        Please go to the source to verify the license and copyright information for
        your use."}, "publicationDate": "2020-03-26", "authors": [{"authorId": "145169034",
        "name": "Jonathan C. Lau"}, {"authorId": "2605028", "name": "Yiming Xiao"},
        {"authorId": "3815893", "name": "R. Haast"}, {"authorId": "46569517", "name":
        "G. Gilmore"}, {"authorId": "2592869", "name": "K. Uluda\u011f"}, {"authorId":
        "4692856", "name": "K. Macdougall"}, {"authorId": "144637542", "name": "Ravi
        S. Menon"}, {"authorId": "1692843", "name": "A. Parrent"}, {"authorId": "1698185",
        "name": "T. Peters"}, {"authorId": "2218490594", "name": "Ali R. Khan"}],
        "abstract": "The zona incerta (ZI) is a small gray matter region of the deep
        brain first identified in the 19th century, yet direct in vivo visualization
        and characterization has remained elusive. Noninvasive detection of the ZI
        and surrounding region could be critical to further our understanding of this
        widely connected but poorly understood deep brain region and could contribute
        to the development and optimization of neuromodulatory therapies. We demonstrate
        that high resolution (submillimetric) longitudinal (T1) relaxometry measurements
        at high magnetic field strength (7 Tesla) can be used to delineate the ZI
        from surrounding white matter structures, specifically the fasciculus cerebellothalamicus,
        fields of Forel (fasciculus lenticularis, fasciculus thalamicus, field H),
        and medial lemniscus. Using this approach, we successfully derived in vivo
        estimates of the size, shape, location, and tissue characteristics of substructures
        in the ZI region, confirming observations only previously possible through
        histological evaluation that this region is not just a space between structures
        but contains distinct morphological entities that should be considered separately.
        Our findings pave the way for increasingly detailed in vivo study and provide
        a structural foundation for precise functional and neuromodulatory investigation."}]

        '
