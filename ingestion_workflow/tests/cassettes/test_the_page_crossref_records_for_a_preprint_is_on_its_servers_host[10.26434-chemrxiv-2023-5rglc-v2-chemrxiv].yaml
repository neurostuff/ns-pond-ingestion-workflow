        Chemical Society (ACS)","license":[{"start":{"date-parts":[[2023,9,4]],"date-time":"2023-09-04T00:00:00Z","timestamp":1693785600000},"content-version":"unspecified","delay-in-days":0,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"abstract":"<jats:p>Aggregation-induced
        emission (AIE) is a photophysical phenomenon wherein luminescent materials
        exhibit weak emission in solution but strong emission after aggregation. This
        phenomenon has garnered significant attention in the realm of multifunctional
        luminescent materials. Specifically, AIE molecules, which operate through
        the restriction of intramolecular vibration (RIV) mechanism, have emerged
        as a pivotal constituent of AIE materials, captivating the interest of both
        academia and industry. This review aims to present a comprehensive overview
        of recent advancements in the domain of RIV-type AIE and its associated areas.
        It encompasses a survey of the classifications, molecular design strategies,
        and mechanisms underlying RIV-type AIE molecules. Furthermore, the review
        delves into the prospects and challenges encountered in the realm. We hope
        this review can provide novel insights into the theory, materials, and applications
