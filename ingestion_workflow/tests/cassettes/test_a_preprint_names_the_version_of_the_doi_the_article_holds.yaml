        NS122260"],"award-info":[{"award-number":["R35 NS122260"]}],"id":[{"id":"10.13039\/100000065","id-type":"DOI","asserted-by":"publisher"}]}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"abstract":"<jats:p>Abstract<\/jats:p>\n                <jats:p>Abnormal
        cellular and circuit excitability is believed to drive many core phenotypes
        in fragile X syndrome (FXS). The dentate gyrus is a brain area performing
        critical computations essential for learning and memory. However, little is
        known about dentate circuit defects and their mechanisms in FXS. Understanding
        dentate circuit dysfunction in FXS has been complicated by the presence of
        two types of excitatory neurons, the granule cells and mossy cells. Here we
        report that loss of FMRP markedly decreased excitability of dentate mossy
        cells, a change opposite to all other known excitability defects in excitatory
        neurons in FXS. This mossy cell hypo-excitability is caused by increased Kv7
        function in Fmr1 KO mice. By reducing the excitatory drive onto local hilar
        interneurons, hypo-excitability of mossy cells results in increased excitation\/inhibition
        ratio in granule cells and thus paradoxically leads to excessive dentate output.
        Circuit-wide inhibition of Kv7 channels in Fmr1 KO mice increases inhibitory
        drive onto granule cells and normalizes the dentate output in response to
        physiologically relevant theta-gamma coupling stimulation. Our study suggests
        that circuit-based interventions may provide a promising strategy in this
        disorder to bypass irreconcilable excitability defects in different cell types
        and restore their pathophysiological consequences at the circuit level.<\/jats:p>","DOI":"10.7554\/elife.92563.2","type":"posted-content","created":{"date-parts":[[2024,1,26]],"date-time":"2024-01-26T08:25:07Z","timestamp":1706257507000},"source":"Crossref","is-referenced-by-count":1,"title":["Circuit-based
        intervention corrects excessive dentate gyrus output in the Fragile X mouse
        model"],"prefix":"10.7554","author":[{"given":"Pan-Yue","family":"Deng","sequence":"first","affiliation":[{"name":"Department
        of Cell Biology and Physiology","place":["USA"]}],"role":[{"vocabulary":"crossref","role":"author"}]},{"given":"Ajeet","family":"Kumar","sequence":"additional","affiliation":[{"name":"Department
