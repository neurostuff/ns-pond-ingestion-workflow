    body:
      string: '[{"paperId": "62ef6768b72bca72f5a33cf7771891f97a81c0f9", "title": "The
        Medial Temporal Lobe Distinguishes Old from New Independently of Consciousness",
        "venue": "Journal of Neuroscience", "year": 2006, "isOpenAccess": true, "openAccessPdf":
        {"url": "https://www.jneurosci.org/content/jneuro/26/21/5835.full.pdf", "status":
        "HYBRID", "license": "CCBYNCSA", "disclaimer": "Notice: Paper or abstract
        available at https://api.unpaywall.org/v2/10.1523/JNEUROSCI.0258-06.2006?email=<INSERT_YOUR_EMAIL>
        or https://doi.org/10.1523/JNEUROSCI.0258-06.2006, which is subject to the
        license by the author or copyright owner provided with this content. Please
        go to the source to verify the license and copyright information for your
        use."}, "publicationDate": "2006-05-24", "authors": [{"authorId": "2749675",
        "name": "S. Daselaar"}, {"authorId": "3395895", "name": "M. Fleck"}, {"authorId":
        "2175233", "name": "S. E. Prince"}, {"authorId": "145097462", "name": "R.
        Cabeza"}], "abstract": "Although it is widely accepted that the medial temporal
        lobes (MTLs) are critical for becoming aware that something happened in the
        past, there is virtually no evidence whether MTL sensitivity to event oldness
        also depends on conscious awareness. Using event-related functional magnetic
        resonance imaging, we show that activity in posterior MTL tracks whether an
        item is actually old (true oldness), regardless of participants'' awareness
        of oldness (perceived oldness). Confirming its sensitivity to the objective
        nature of the stimulus, activity in this region was strongly correlated with
        individual memory performance (r = 0.74). At the same time, we found that
        memory errors (misses) were associated with activity in an anterior MTL region,
        which signaled whether an item was consciously experienced as new (perceived
        novelty). Logistic regression analyses based on individual trial activity
        indicated that the two MTL regions showed opposing relationships with behavior,
        and that memory performance was determined by their joint activity. Furthermore,
        functional connectivity analyses showed that perceived novelty activity in
        the posterior MTL inhibited true oldness activity in the anterior MTL. These
        findings indicate that participants'' behavior reflected the combined effects
        of multiple MTL regions. More generally, our results show that parts of MTL
        can distinguish old from new independently of consciousness."}]

        '
