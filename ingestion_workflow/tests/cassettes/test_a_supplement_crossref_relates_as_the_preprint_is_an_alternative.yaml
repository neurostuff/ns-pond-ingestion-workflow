        Association for Cancer Research (AACR)","license":[{"start":{"date-parts":[[2023,3,31]],"date-time":"2023-03-31T00:00:00Z","timestamp":1680220800000},"content-version":"unspecified","delay-in-days":0,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"abstract":"<jats:p>&lt;div&gt;Abstract&lt;p&gt;Three-dimensional
        (3D) tumor spheroid models have gained increased recognition as important
        tools in cancer research and anticancer drug development. However, currently
        available imaging approaches used in high-throughput screening drug discovery
        platforms, for example, bright-field, phase contrast, and fluorescence microscopies,
        are unable to resolve 3D structures deep inside (&gt;50 \u03bcm) tumor spheroids.
        In this study, we established a label-free, noninvasive optical coherence
        tomography (OCT) imaging platform to characterize 3D morphologic and physiologic
        information of multicellular tumor spheroids (MCTS) growing from approximately
        250 to 600 \u03bcm in height over 21 days. In particular, tumor spheroids
        of two cell lines, glioblastoma (U-87MG) and colorectal carcinoma (HCT116),
        exhibited distinctive evolutions in their geometric shapes at late growth
        stages. Volumes of MCTS were accurately quantified using a voxel-based approach
        without presumptions of their geometries. In contrast, conventional diameter-based
        volume calculations assuming perfect spherical shape resulted in large quantification
        errors. Furthermore, we successfully detected necrotic regions within these
        tumor spheroids based on increased intrinsic optical attenuation, suggesting
        a promising alternative of label-free viability tests in tumor spheroids.
        Therefore, OCT can serve as a promising imaging modality to characterize morphologic
        and physiologic features of MCTS, showing great potential for high-throughput
        drug screening. &lt;i&gt;Cancer Res; 77(21); 6011\u201320. \u00a92017 AACR&lt;\/i&gt;.&lt;\/p&gt;&lt;\/div&gt;<\/jats:p>","DOI":"10.1158\/0008-5472.c.6510299","type":"posted-content","created":{"date-parts":[[2024,3,12]],"date-time":"2024-03-12T22:51:02Z","timestamp":1710283862000},"source":"Crossref","is-referenced-by-count":0,"title":["Data
