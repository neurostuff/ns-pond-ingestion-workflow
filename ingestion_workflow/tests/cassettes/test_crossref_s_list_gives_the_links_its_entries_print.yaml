        528318902"],"award-info":[{"award-number":["KU 3711\/4-1, 528318902"]}],"id":[{"id":"10.13039\/501100001659","id-type":"DOI","asserted-by":"publisher"}]}],"content-domain":{"domain":["direct.mit.edu"],"crossmark-restriction":true},"short-container-title":[],"published-print":{"date-parts":[[2026,5,26]]},"abstract":"<jats:title>Abstract<\/jats:title>\n                  <jats:p>Tactile
        fingertip sensations are critical for everyday life. Accordingly, tactile
        fingertip maps have been extensively studied in human primary somatosensory
        cortex. However, the fine-grained functional architecture of these maps remains
        largely unknown. To uncover this architecture, we sought to estimate 2D spatio-tactile
        population receptive fields (pRFs) of the tip of the index finger in human
        Brodmann area 3b (BA3b). Using functional magnetic resonance imaging at 7T
        and submillimeter resolution along with prospective motion correction, we
        recorded brain responses while participants sensed a row of vibrotactile pins
        sweeping along cardinal axes over a portion of the fingertip. To estimate
        pRF position and size, we initially fit a 2D Gaussian pRF model to the data,
        which, however, produced largely implausible pRF estimates. Simulations indicated
        that this likely occurred because the size of pRFs in BA3b surpasses the portion
        of the fingertip we stimulated, resulting in an incomplete mapping of pRFs.
        To address this issue, we constrained the fitting procedure and refined the
        2D Gaussian pRF model by keeping pRF size constant. Our results for pRF position
        then revealed that the ulnar-to-radial axis spanning the fingertip maps onto
        a superior-to-inferior axis in BA3b. Both the putatively large pRF size (relative
        to the mapping area) and the pRF position gradient we uncover here appear
        compatible with receptive field properties quantified in monkeys. Our study
        provides the first comprehensive investigation into the fine-grained functional
        architecture of human fingertip maps and brings us one step closer to a thorough
        understanding thereof.<\/jats:p>","DOI":"10.1162\/imag.a.1210","type":"journal-article","created":{"date-parts":[[2026,3,30]],"date-time":"2026-03-30T20:02:00Z","timestamp":1774900920000},"update-policy":"https:\/\/doi.org\/10.1162\/mitpressjournals.corrections.policy","source":"Crossref","is-referenced-by-count":5,"title":["Modeling
