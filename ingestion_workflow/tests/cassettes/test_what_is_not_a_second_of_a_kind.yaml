    body:
      string: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"institution":[{"name":"bioRxiv"}],"indexed":{"date-parts":[[2026,5,10]],"date-time":"2026-05-10T16:11:01Z","timestamp":1778429461326,"version":"3.51.4"},"posted":{"date-parts":[[2023,10,23]]},"group-title":"Neuroscience","reference-count":117,"publisher":"openRxiv","license":[{"start":{"date-parts":[[2023,10,23]],"date-time":"2023-10-23T00:00:00Z","timestamp":1698019200000},"content-version":"vor","delay-in-days":0,"URL":"http:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"accepted":{"date-parts":[[2025,3,7]]},"abstract":"<jats:title>Abstract<\/jats:title>\n                <jats:p>Explore-exploit
        research faces challenges in generalizability due to a limited theoretical
        basis for exploration and exploitation. Neuroimaging can help identify whether
        explore-exploit decisions involve an opponent processing system to address
        this issue. Thus, we conducted a coordinate-based meta-analysis (N=23 studies)
        finding activation in the dorsal lateral prefrontal cortex, anterior insula,
        and anterior cingulate cortex during exploration versus exploitation, which
        provides some evidence for opponent processing. However, the conjunction of
        explore-exploit decisions was associated with activation in the dorsal anterior
        cingulate cortex and dorsal medial prefrontal cortex, suggesting that these
        brain regions do not engage in opponent processing. Furthermore, exploratory
        analyses revealed heterogeneity in brain responses between task types during
        exploration and exploitation respectively. Coupled with results suggesting
        that activation during exploration and exploitation decisions is generally
        more similar than it is different suggests that there remain significant challenges
        in characterizing explore-exploit decision making. Nonetheless, dorsal lateral
        prefrontal cortex, anterior insula, and dorsal anterior cingulate cortex activation
        differentiate explore and exploit decisions and identifying these responses
        can aid in targeted interventions aimed at manipulating these decisions.<\/jats:p>\n                <jats:sec>\n                  <jats:title>Abstract
        Figure<\/jats:title>\n                  <jats:fig id=\"ufig1\" position=\"float\"
        orientation=\"portrait\" fig-type=\"figure\">\n                    <jats:label>Graphical
        Abstract<\/jats:label>\n                    <jats:caption>\n                      <jats:title>We
        conducted a coordinate-based meta-analysis (N=23 studies) where we found activation
        in the dorsal lateral prefrontal cortex, anterior insula, and the anterior
        cingulate cortex during exploration versus exploitation.<\/jats:title>\n                      <jats:p>However,
        the conjunction of explore-exploit decisions was associated with activation
        in the dorsal medial prefrontal cortex, and the insula, suggesting that these
        brain regions do not engage in opponent processing. Nonetheless, activation
        that differentiates explore and exploit decisions and can help in targeted
        interventions aimed at manipulating these decisions.<\/jats:p>\n                    <\/jats:caption>\n                    <jats:graphic
