    body:
      string: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"institution":[{"name":"bioRxiv"}],"indexed":{"date-parts":[[2026,6,24]],"date-time":"2026-06-24T05:58:07Z","timestamp":1782280687924,"version":"3.54.5"},"posted":{"date-parts":[[2024,5,9]]},"group-title":"Neuroscience","reference-count":67,"publisher":"openRxiv","content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"accepted":{"date-parts":[[2024,5,9]]},"abstract":"<jats:title>ABSTRACT<\/jats:title>\n                <jats:p>Magnetic
        resonance elastography (MRE) is a promising neuroimaging technique to probe
        tissue microstructure, which has revealed widespread softening with loss of
        structural integrity in the aging brain. Traditional MRE approaches assume
        mechanical isotropy. However, white matter is known to be anisotropic from
        aligned, myelinated axonal bundles, which can lead to uncertainty in mechanical
        property estimates in these areas when using isotropic MRE. Recent advances
        in anisotropic MRE now allow for estimation of shear and tensile anisotropy,
        along with substrate shear modulus, in white matter tracts. The objective
        of this study was to investigate age-related differences in anisotropic mechanical
        properties in human brain white matter tracts for the first time. Anisotropic
        mechanical properties in all tracts were found to be significantly lower in
        older adults compared to young adults, with average property differences ranging
        between 0.028-0.107 for shear anisotropy and between 0.139-0.347 for tensile
        anisotropy. Stiffness perpendicular to the axonal fiber direction was also
        significantly lower in older age, but only in certain tracts. When compared
        with fractional anisotropy measures from diffusion tensor imaging, we found
        that anisotropic MRE measures provided additional, complementary information
        in describing differences between the white matter integrity of young and
        older populations. Anisotropic MRE provides a new tool for studying white
        matter structural integrity in aging and neurodegeneration.<\/jats:p>","DOI":"10.1101\/2024.05.08.593260","type":"posted-content","created":{"date-parts":[[2024,5,9]],"date-time":"2024-05-09T23:05:12Z","timestamp":1715295912000},"source":"Crossref","is-referenced-by-count":2,"title":["Mechanical
