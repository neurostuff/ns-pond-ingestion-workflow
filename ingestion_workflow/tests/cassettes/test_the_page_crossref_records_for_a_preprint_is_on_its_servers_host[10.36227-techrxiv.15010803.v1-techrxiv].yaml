      string: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"indexed":{"date-parts":[[2026,6,3]],"date-time":"2026-06-03T18:14:00Z","timestamp":1780510440669,"version":"3.54.1"},"posted":{"date-parts":[[2021,7,19]]},"reference-count":0,"publisher":"Institute
        of Electrical and Electronics Engineers (IEEE)","license":[{"start":{"date-parts":[[2021,7,19]],"date-time":"2021-07-19T00:00:00Z","timestamp":1626652800000},"content-version":"unspecified","delay-in-days":0,"URL":"https:\/\/creativecommons.org\/licenses\/by-nc-sa\/4.0\/"}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"abstract":"<jats:p>Convolutional
        neural networks are gradually being recognized in the\nneuroimaging community
        as a powerful tool for image analysis. In the\npresent study, we tested the
        ability of 3D convolutional neural networks\nto discriminate between whole-brain
        parametric maps obtained from\ndiffusion-weighted magnetic resonance imaging.
        Original parametric maps\nwere subjected to intensity-based region-specific
        alterations, to create\naltered maps. To analyze how position, size and intensity
        of altered\nregions affected the networks\u2019 learning process, we generated
        monoregion\nand biregion maps by systematically modifying the size and intensity
        of\none or two brain regions in each image. We assessed network performance\nover
        a range of intensity increases and combinations of maps, carrying\nout 10-fold
        cross-validation and using a hold-out set for testing. We\nthen tested the
        networks trained with monoregion images on the\ncorresponding biregion images
        and vice versa. Results showed an\ninversely proportional link between size
        and intensity for the\nmonoregion networks, in that the larger the region,
        the smaller the\nincrease in intensity needed to achieve good performances.
        Accuracy was\nbetter for biregion networks than for their monoregion counterparts,\nshowing
        that altering more than one region in the brain can improve\ndiscrimination.
        Monoregion networks correctly detected their target\nregion in biregion maps,
        whereas biregion networks could only detect one\nof the two target regions
        at most. Biregion networks therefore learned a\nmore complex pattern that
        was absent from the monoregion images. This\ndeep learning approach could
        be tailored to explore the behavior of\nother convolutional neural networks
        for other regions of interest.<\/jats:p>","DOI":"10.36227\/techrxiv.15010803.v1","type":"posted-content","created":{"date-parts":[[2021,7,19]],"date-time":"2021-07-19T19:17:59Z","timestamp":1626722279000},"source":"Crossref","is-referenced-by-count":0,"title":["Investigating
